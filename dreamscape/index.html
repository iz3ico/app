  html,body { margin:0; height:100%; overflow:hidden; background:#cfe6ee; color:var(--ink);

  canvas { display:block; }

    background:radial-gradient(ellipse at 50% 40%, rgba(246,250,255,.5), rgba(196,226,236,.82) 60%, rgba(214,206,236,.85)); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    transition:opacity .6s; }

  .card { text-align:center; padding:28px 24px; max-width:520px; width:100%; }

  .chip.on { background:rgba(255,255,255,.85); color:var(--ink); border-color:rgba(75,106,124,.45); }
  .keys { display:grid; grid-template-columns:auto auto; gap:6px 18px; justify-content:center; font-size:13px; color:var(--ink2); margin:0 auto 28px; text-align:left; }

  .btn { font:inherit; font-size:15px; letter-spacing:.3em; padding:13px 38px 13px 44px; border-radius:999px; border:1px solid rgba(75,106,124,.35);
    background:rgba(255,255,255,.7); color:var(--ink); cursor:pointer; transition:background .25s, transform .25s; margin:4px; }
  .btn:hover { background:#fff; transform:translateY(-1px); }

  .btn.sm { font-size:13px; padding:10px 26px 10px 30px; letter-spacing:.2em; }
  #msg { font-size:12px; color:var(--ink2); margin-top:18px; min-height:1em; line-height:1.7; }
  #hud { position:fixed; inset:0; pointer-events:none; z-index:5; }
  #area { position:absolute; left:50%; top:16%; transform:translateX(-50%); text-align:center; opacity:0; transition:opacity 2.4s; white-space:nowrap; }
  #area .a1 { font-family:"Cormorant Garamond",serif; font-size:clamp(26px,5vw,44px); letter-spacing:.45em; color:rgba(70,98,114,.85); margin-left:.45em; }
  #area .a2 { font-size:12px; letter-spacing:.5em; color:rgba(70,98,114,.7); margin-top:6px; margin-left:.5em; }
  #hint { position:absolute; left:50%; bottom:22px; transform:translateX(-50%); font-size:12px; letter-spacing:.08em; color:rgba(60,88,104,.8);
    background:rgba(255,255,255,.45); padding:7px 16px; border-radius:999px; white-space:nowrap; transition:opacity 1.5s; opacity:0; }
  #speed { position:absolute; right:18px; bottom:20px; font-size:12px; letter-spacing:.15em; color:rgba(60,88,104,.75); }
  #dot { position:absolute; left:50%; top:50%; width:4px; height:4px; margin:-2px 0 0 -2px; border-radius:50%; background:rgba(60,90,110,.45); }
  #fade { position:fixed; inset:0; background:#f3f8fc; opacity:0; pointer-events:none; z-index:8; }
  #end { position:fixed; inset:0; z-index:9; display:none; align-items:center; justify-content:center; text-align:center; }
  #end.show { display:flex; }
  #end p { font-size:15px; letter-spacing:.2em; line-height:2.2; color:var(--ink); margin:0 0 26px; }
  #touch { position:fixed; inset:0; z-index:6; display:none; }
  #touch.on { display:block; }
  #stick { position:absolute; left:28px; bottom:34px; width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,.22); border:1px solid rgba(255,255,255,.55); }
  #knob { position:absolute; left:40px; top:40px; width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.65); }
  .tbtn { position:absolute; width:58px; height:58px; border-radius:50%; background:rgba(255,255,255,.3); border:1px solid rgba(255,255,255,.6);
    color:#4b6a7c; font-size:12px; display:flex; align-items:center; justify-content:center; letter-spacing:.05em; }
  #tjump { right:30px; bottom:44px; } #tspeed { right:100px; bottom:26px; width:48px; height:48px; font-size:11px; }
  #tpause { right:16px; top:16px; width:40px; height:40px; font-size:14px; }
</style>

      var m = document.getElementById('msg');
      if (m && !m.textContent) m.textContent = 'Three.js の読み込みに時間がかかっています。通信環境を確認して再読み込みしてください。';
    }
  }, 15000);

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const $ = (id) => document.getElementById(id);
const isTouch = matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window && navigator.maxTouchPoints > 0);

// ------------------------------------------------------------------
// レンダラー
// ------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, isTouch ? 1.5 : 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.93;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;   // 建物は動かないので影はステージごとに一度だけ描く
renderer.shadowMap.needsUpdate = true;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const FOG_COLOR = new THREE.Color(0xc9e3ec);
scene.fog = new THREE.FogExp2(FOG_COLOR, 0.0065);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.08, 1600);
camera.rotation.order = 'YXZ';

const SUN_DIR = new THREE.Vector3(0.85, 0.42, 0.32).normalize();
const MOON_DIR = new THREE.Vector3(0.03, 0.105, -1).normalize();

// ステージごとに切り替わる共有値
const U = {
  uTime: { value: 0 },
  uPool: { value: new THREE.Vector4(-16, 18, -19.5, 20.5) },   // 水の範囲 x0,x1,z0,z1
  uWaterY: { value: -0.1 },
  uRoom: { value: new THREE.Vector4(-20, 20, -27.5, 27.5) },   // 部屋の内側（隅の陰り用）
  uCaus: { value: 0.3 },
  uCumulus: { value: 0 }, uCirrus: { value: 1 }, uMoon: { value: 1 },
  uSkyZen: { value: new THREE.Color() }, uSkyMid: { value: new THREE.Color() }, uSkyHor: { value: new THREE.Color() },
  uBounce: { value: new THREE.Color(0.45, 0.88, 1.0) },
  uCloudPhase: { value: 0 },
};

// ------------------------------------------------------------------
// マテリアル（目地はワールド座標から計算：引き伸ばし・ノイズなし）
// ------------------------------------------------------------------
const CAUS_GLSL = /* glsl */`
// 模様は x・z とも 16 で周期的（迷宮のループで継ぎ目が出ないように、周波数を 2π/16 の整数倍にそろえる）
const float W0 = 0.39269908;
float dsCaus(vec2 p, float t){
  vec2 q = p + vec2(sin(p.y*3.0*W0 + t*0.7), cos(p.x*3.0*W0 - t*0.6))*0.48;
  float a = sin(q.x*6.0*W0 + t*0.9) + sin(q.y*7.0*W0 - t*0.8);
  vec2 r = p + vec2(cos(p.y*4.0*W0 - t*0.5), sin(p.x*4.0*W0 + t*0.6))*0.24;
  float b = sin(r.x*10.0*W0 - t*0.7) + sin(r.y*11.0*W0 + t*1.0);
  float c1 = pow(1.0 - min(abs(a), 1.0), 5.0);
  float c2 = pow(1.0 - min(abs(b), 1.0), 5.0);
  return c1 + c2*0.7;
}
`;
const FRAG_HEAD = /* glsl */`
varying vec3 vWPos;
varying vec3 vWNrm;
uniform float uTime;
uniform float uGrid;
uniform float uLineW;
uniform float uLineDark;
uniform vec2 uOff;
uniform vec4 uPool;
uniform float uWaterY;
uniform vec4 uRoom;
uniform float uCaus;
uniform vec3 uBounce;
${CAUS_GLSL}
float dsInPool(vec3 p){ return step(uPool.x, p.x)*step(p.x, uPool.y)*step(uPool.z, p.z)*step(p.z, uPool.w); }
`;
const FRAG_COLOR = /* glsl */`
{
  vec3 an = abs(vWNrm);
  float wet = dsInPool(vWPos) * (1.0 - smoothstep(uWaterY - 0.08, uWaterY - 0.02, vWPos.y));
#ifdef GRID
  vec2 gp;
  if (an.y > 0.5) gp = vec2(vWPos.x - uOff.x, vWPos.z - uOff.y);
  else if (an.x > an.z) gp = vec2(vWPos.z - uOff.y, vWPos.y);
  else gp = vec2(vWPos.x - uOff.x, vWPos.y);
  // 水の下は目地をゆらす（屈折の代わり）
  gp += wet * 0.035 * vec2(sin(gp.y*7.0*W0 + uTime*1.1 + gp.x*2.0*W0), sin(gp.x*6.0*W0 - uTime*0.9 + gp.y*W0));
  gp /= uGrid;
  vec2 fw = max(fwidth(gp)*uGrid, vec2(1e-4));
  vec2 dd = abs(fract(gp + 0.5) - 0.5)*uGrid;
  vec2 ln = 1.0 - smoothstep(vec2(uLineW) - fw, vec2(uLineW) + fw, dd);
  ln = mix(ln, vec2(min(1.0, 2.0*uLineW/uGrid)), smoothstep(uLineW*0.7, uLineW*3.0, fw));
  float gl = max(ln.x, ln.y);
  diffuseColor.rgb *= 1.0 - gl*uLineDark*vec3(1.2, 0.92, 0.8);
#endif
  float ao = 1.0;
  if (vWNrm.y > 0.5 && vWPos.x > uRoom.x && vWPos.x < uRoom.y && vWPos.z > uRoom.z && vWPos.z < uRoom.w) {
    float dw = min(min(vWPos.x - uRoom.x, uRoom.y - vWPos.x), min(vWPos.z - uRoom.z, uRoom.w - vWPos.z));
    ao = mix(0.86, 1.0, smoothstep(0.0, 1.8, dw));
  }
  if (an.y < 0.5) ao = mix(0.88, 1.0, smoothstep(-0.6, 1.2, vWPos.y));
  diffuseColor.rgb *= ao;
}
`;
const FRAG_EMIS = /* glsl */`
{
  vec3 bounce = uBounce;
  float vert = 1.0 - step(0.5, abs(vWNrm.y));
#ifdef CAUSTIC
  float inP = dsInPool(vWPos);
  float cz = dsCaus(vWPos.xz, uTime);
  float under = 1.0 - smoothstep(uWaterY - 0.06, uWaterY + 0.02, vWPos.y);
  totalEmissiveRadiance += bounce * cz * uCaus * inP * under;
  float above = smoothstep(uWaterY - 0.02, uWaterY + 0.2, vWPos.y) * (1.0 - smoothstep(uWaterY + 0.3, uWaterY + 2.6, vWPos.y));
  float cv = dsCaus(vWPos.xz + vec2(vWPos.y*1.3), uTime*0.8);
  vec2 pd = max(max(uPool.xz - vWPos.xz, vWPos.xz - uPool.yw), vec2(0.0));
  float nearP = 1.0 - smoothstep(0.5, 3.0, length(pd));   // 水のそばだけ（迷宮の継ぎ目に模様を出さない）
  totalEmissiveRadiance += bounce * cv * 0.27 * uCaus * above * vert * nearP;
#endif
  totalEmissiveRadiance += bounce * 0.045 * (1.0 - smoothstep(0.0, 8.0, vWPos.y)) * vert;
}
`;
const VERT_POS = /* glsl */`
#include <project_vertex>
{
  vec4 dsW = vec4(transformed, 1.0);
  vec3 dsN = objectNormal;
#ifdef USE_INSTANCING
  dsW = instanceMatrix * dsW;
  dsN = mat3(instanceMatrix) * dsN;
#endif
  dsW = modelMatrix * dsW;
  vWPos = dsW.xyz;
  vWNrm = normalize(mat3(modelMatrix) * dsN);
}
`;

function archMat(color, opt = {}) {
  const m = new THREE.MeshStandardMaterial({ color, roughness: opt.rough ?? 0.55, metalness: 0 });
  m.defines = {};
  if (opt.grid) m.defines.GRID = '';
  if (opt.caustic) m.defines.CAUSTIC = '';
  const off = opt.off || [0, 0];
  m.onBeforeCompile = (sh) => {
    for (const k of ['uTime', 'uPool', 'uWaterY', 'uRoom', 'uCaus', 'uBounce']) sh.uniforms[k] = U[k];
    sh.uniforms.uGrid = { value: opt.grid || 1 };
    sh.uniforms.uLineW = { value: opt.lineW || 0.012 };
    sh.uniforms.uLineDark = { value: opt.lineDark || 0.18 };
    sh.uniforms.uOff = { value: new THREE.Vector2(off[0], off[1]) };
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;\nvarying vec3 vWNrm;')
      .replace('#include <project_vertex>', VERT_POS);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\n' + FRAG_HEAD)
      .replace('#include <color_fragment>', '#include <color_fragment>\n' + FRAG_COLOR)
      .replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\n' + FRAG_EMIS);
  };
  const key = 'ds3-' + (opt.grid || 0) + '-' + (opt.caustic ? 1 : 0);
  m.customProgramCacheKey = () => key;
  return m;
}

const M = {
  // WHITE GATE
  floor1: archMat(0xe0f0f4, { grid: 2.0, lineW: 0.016, lineDark: 0.2, caustic: true, rough: 0.42, off: [0, -27.5] }),
  wall1:  archMat(0xd9ecf1, { grid: 1.0, lineW: 0.011, lineDark: 0.15, caustic: true, rough: 0.5, off: [0, -27.5] }),
  plain:  archMat(0xe4f2f5, { caustic: true, rough: 0.58 }),
  fin:    archMat(0xd4eaee, { rough: 0.62 }),
  ceil:   archMat(0xd6e8ee, { rough: 0.8 }),
  // 青の回廊（細かい壁タイル・1×1 の床タイル）
  floor2: archMat(0xdcedf3, { grid: 1.0, lineW: 0.012, lineDark: 0.26, caustic: true, rough: 0.35 }),
  wall2:  archMat(0xdbebf2, { grid: 0.5, lineW: 0.008, lineDark: 0.2, caustic: true, rough: 0.4 }),
  ceil2:  archMat(0xd5e6ee, { rough: 0.85 }),
};

// ------------------------------------------------------------------
// ステージ構築の道具
// ------------------------------------------------------------------
let root = new THREE.Group();
scene.add(root);
const solids = [];   // {type:'box', x0,x1,y0,y1,z0,z1} / {type:'cyl', x,z,r,y0,y1}
let solidOwner = null;   // 迷路の作り直しで差し替える当たり判定の持ち主
function solidBox(x0, x1, y0, y1, z0, z1) { solids.push({ type:'box', x0, x1, y0, y1, z0, z1, owner: solidOwner }); }
function solidCyl(x, z, r, y0, y1) { solids.push({ type:'cyl', x, z, r, y0, y1, owner: solidOwner }); }

function addBox(mat, x0, x1, y0, y1, z0, z1, opt = {}) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), mat);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  m.castShadow = opt.cast !== false; m.receiveShadow = true;
  root.add(m);
  if (opt.solid !== false) solidBox(x0, x1, opt.sy0 ?? y0, opt.sy1 ?? y1, z0, z1);
  return m;
}
// 床の土台：見える上面は -0.02、当たり判定とタイルは y
function addSlab(mat, x0, x1, z0, z1, y) { addBox(mat, x0, x1, -3, y - 0.02, z0, z1, { sy1: y }); }

// タイル（InstancedMesh）
function addTileField(mat, list, size, parent = root, vary = true) {
  if (!list.length) return;
  const tiles = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), mat, list.length);
  const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -Math.PI / 2);
  const m4 = new THREE.Matrix4(), p = new THREE.Vector3(), s = new THREE.Vector3(), c = new THREE.Color();
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  list.forEach(([x, z, sx, sz, y], i) => {
    p.set(x + sx / 2, y, z + sz / 2); s.set(sx, sz, 1);
    m4.compose(p, q, s); tiles.setMatrixAt(i, m4);
    const v = vary ? 0.985 + rnd() * 0.03 : 1;   // ごくわずかな個体差（迷路では揃える：ループの継ぎ目を消すため）
    c.setRGB(v, v, v + 0.004); tiles.setColorAt(i, c);
  });
  tiles.receiveShadow = true;
  tiles.computeBoundingSphere?.();
  parent.add(tiles);
}
function tileRect(list, x0, x1, z0, z1, y, size) {
  for (let x = x0; x < x1 - 1e-3; x += size)
    for (let z = z0; z < z1 - 1e-3; z += size)
      list.push([x, z, Math.min(size, x1 - x), Math.min(size, z1 - z), y]);
}

function instanced(geo, mat, positions) {
  const im = new THREE.InstancedMesh(geo, mat, positions.length);
  const m4 = new THREE.Matrix4();
  positions.forEach(([x, y, z], i) => { m4.makeTranslation(x, y, z); im.setMatrixAt(i, m4); });
  im.castShadow = true; im.receiveShadow = true;
  root.add(im);
  return im;
}


// ------------------------------------------------------------------
// 迷路の道具：箱のまとめ描き（InstancedMesh）・グリッド迷路・階段
// ------------------------------------------------------------------
const LAMP_MAT = new THREE.MeshBasicMaterial({ color: new THREE.Color(2.4, 2.3, 2.1) });
const GLOW_MAT = new THREE.MeshBasicMaterial({ color: new THREE.Color(2.3, 2.55, 2.7), side: THREE.DoubleSide });

class BoxBatch {
  constructor() { this.lists = new Map(); }
  add(mat, x0, x1, y0, y1, z0, z1) {
    if (x1 - x0 < 1e-4 || y1 - y0 < 1e-4 || z1 - z0 < 1e-4) return;
    if (!this.lists.has(mat)) this.lists.set(mat, []);
    this.lists.get(mat).push([x0, x1, y0, y1, z0, z1]);
  }
  flush(parent) {
    const m4 = new THREE.Matrix4(), p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3();
    for (const [mat, list] of this.lists) {
      const im = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), mat, list.length);
      list.forEach((b, i) => {
        p.set((b[0] + b[1]) / 2, (b[2] + b[3]) / 2, (b[4] + b[5]) / 2);
        s.set(b[1] - b[0], b[3] - b[2], b[5] - b[4]);
        m4.compose(p, q, s); im.setMatrixAt(i, m4);
      });
      im.castShadow = mat !== LAMP_MAT && mat !== GLOW_MAT; im.receiveShadow = true;
      im.computeBoundingSphere?.();
      parent.add(im);
    }
    this.lists.clear();
  }
}
// 箱を描いて当たり判定も付ける
function sbox(B, mat, x0, x1, y0, y1, z0, z1) { B.add(mat, x0, x1, y0, y1, z0, z1); solidBox(x0, x1, y0, y1, z0, z1); }
// 階段：z 方向に za → zb へ進みながら y0 → y1 へ n 段で上がる
function flight(B, mat, xa, xb, za, zb, y0, y1, n, base = null) {
  const dz = (zb - za) / n;
  for (let i = 0; i < n; i++) {
    const top = y0 + (y1 - y0) * (i + 1) / n;
    const s0 = za + dz * i, s1 = za + dz * (i + 1);
    const lo = base != null ? base : Math.max(y0 - 0.2, top - 0.6);
    sbox(B, mat, xa, xb, lo, top, Math.min(s0, s1), Math.max(s0, s1));

}
function addLamps(list, parent) {
  if (!list.length) return;
  const im = new THREE.InstancedMesh(new THREE.SphereGeometry(0.17, 16, 12), LAMP_MAT, list.length);
  const m4 = new THREE.Matrix4();
  list.forEach(([x, y, z], i) => { m4.makeTranslation(x, y, z); im.setMatrixAt(i, m4); });
  im.computeBoundingSphere?.();

}
// 光る門（出口）
function addGate(B, parent, x0, x1, z, y, h) {
  const t = 0.35;
  B.add(M.plain, x0 - t, x0, y, y + h + t, z - t, z + t);
  B.add(M.plain, x1, x1 + t, y, y + h + t, z - t, z + t);
  B.add(M.plain, x0 - t, x1 + t, y + h, y + h + t, z - t, z + t);
  const g = new THREE.Mesh(new THREE.PlaneGeometry(x1 - x0, h), GLOW_MAT);

// グリッド迷路：床のマスを置くと、まわりの壁・天井・床板・当たり判定を自動で作る。

      if (!cell.sky && cell.h < cell.top) B.add(this.mats.ceil, x0, x1, Y + cell.h, Y + cell.top, z0, z1);

      const m4 = new THREE.Matrix4();
      st.forEach(([x, z], i) => { m4.makeTranslation(x, Y + (STONE_TOP + POOL_LV) / 2, z); im.setMatrixAt(i, m4); solidCyl(x, z, STONE_R, Y + POOL_LV, Y + STONE_TOP); });

// 鉤形（S 字）の小部屋：入口は西、北へ折れて、東へ抜ける。視線が通らない形。
//   (c,r) が入口のマス。ループの発動は (c+1, r+1)。
function sChunk(g, c, r, o = {}) {
  const h = o.h ?? 3.4;
  g.floor(c, r, c + 1, r, { h });
  g.floor(c + 1, r + 1, c + 1, r + 2, { h });
  g.floor(c + 2, r + 2, c + 3, r + 2, { h });

// ------------------------------------------------------------------
// 当たり判定の近傍検索（空間ハッシュ）
// ------------------------------------------------------------------
const HASH = new Map(), HC = 4, NONE = [];
function rebuildHash() {
  HASH.clear();
  for (const s of solids) {
    let x0, x1, z0, z1;
    if (s.type === 'box') { x0 = s.x0; x1 = s.x1; z0 = s.z0; z1 = s.z1; }
    else { x0 = s.x - s.r; x1 = s.x + s.r; z0 = s.z - s.r; z1 = s.z + s.r; }
    for (let i = Math.floor((x0 - 0.6) / HC); i <= Math.floor((x1 + 0.6) / HC); i++)
      for (let j = Math.floor((z0 - 0.6) / HC); j <= Math.floor((z1 + 0.6) / HC); j++) {
        const k = i * 100003 + j;
        let a = HASH.get(k); if (!a) HASH.set(k, a = []);
        a.push(s);
      }
  }
}
function near(x, z) { return HASH.get(Math.floor(x / HC) * 100003 + Math.floor(z / HC)) || NONE; }
const inBox = (p, b) => p.x >= b.x0 && p.x <= b.x1 && p.z >= b.z0 && p.z <= b.z1 && p.y >= (b.y0 ?? -1e9) && p.y <= (b.y1 ?? 1e9);

// ------------------------------------------------------------------
// ループと空間変化（ステージごとの実行時データ）
//   loop = { id, zone(発動範囲), when(向きの条件), offset(接続先へのずれ), turn(移動後の向き),
//            keepVel(速度の引き継ぎ), cooldown(再発動防止), phase(空間変化の段階を進める量), max(回数上限) }
// ------------------------------------------------------------------
const RT = { grids: [], loops: [], safe: [], hub: null, exit: null, onPhase: null, maxPhase: 3, log: [] };

function updatePhase(dt) {
  if (RT.hub) {
    const inside = inBox(P.pos, RT.hub);
    if (inside && !PH.inHub && PH.outT > 3) { PH.visits++; bumpPhase(1); }   // 同じ場所を再訪するたびに一段
    PH.outT = inside ? 0 : PH.outT + dt;
    PH.inHub = inside;
  }
  // 変化は、その場所が見えないところにいるときにだけ反映する
  if (PH.target !== PH.phase && RT.safe.some((b) => inBox(P.pos, b))) applyPhase(PH.target);

function teleport(L) {
  const [dx, dy, dz] = L.offset, turn = L.turn || 0;
  if (turn) {
    const zc = L.zone, cx = (zc.x0 + zc.x1) / 2, cz = (zc.z0 + zc.z1) / 2;
    const rx = P.pos.x - cx, rz = P.pos.z - cz, c = Math.cos(turn), s = Math.sin(turn);
    P.pos.x = cx + c * rx + s * rz + dx; P.pos.z = cz - s * rx + c * rz + dz;
    const vx = P.vel.x, vz = P.vel.y; P.vel.x = c * vx + s * vz; P.vel.y = -s * vx + c * vz;
    P.yaw += turn;
  } else { P.pos.x += dx; P.pos.z += dz; }

function checkLoops(dt) {
  loopCool -= dt;

  if (loopCool > 0) return;
  for (const L of RT.loops) {
    if (L.cool > 0 || (L.max != null && L.count >= L.max)) continue;
    if (!inBox(P.pos, L.zone) || (L.when && !L.when(P.vel))) continue;
    // 行き先に床がなければ発動しない（床の外へ出さない）
    const g = groundAt(P.pos.x + L.offset[0], P.pos.z + L.offset[2], P.pos.y + L.offset[1], 0.4);
    if (!(g > P.pos.y + L.offset[1] - 1.2)) continue;
    teleport(L);
    L.count = (L.count || 0) + 1; L.cool = L.cooldown ?? 1; loopCool = 0.35;

// 空（グラデーション＋巻雲＋積雲＋三日月）

const SKY_GLSL = /* glsl */`
uniform vec3 uSunDir;
uniform vec3 uSkyZen;
uniform vec3 uSkyMid;
uniform vec3 uSkyHor;
vec3 skyGrad(vec3 d){
  float y = d.y;
  vec3 c = mix(uSkyHor, uSkyMid, smoothstep(0.0, 0.25, y));
  c = mix(c, uSkyZen, smoothstep(0.2, 0.9, y));
  c = mix(c, mix(uSkyHor, uSkyMid, 0.45), 1.0 - smoothstep(-0.2, 0.0, y));
  float sg = max(dot(d, uSunDir), 0.0);
  c += vec3(1.0, 0.93, 0.85) * (pow(sg, 8.0)*0.22 + pow(sg, 64.0)*0.45);
  return c * 1.12;
}

const WATER_VERT = /* glsl */`
varying vec3 vW;
void main(){
  vec4 p = vec4(position, 1.0);
#ifdef USE_INSTANCING
  p = instanceMatrix * p;
#endif
  vec4 w = modelMatrix * p; vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`;
const WATER_FRAG = /* glsl */`
#include <packing>
uniform float uTime;
uniform float uSea;
uniform float uCaus;
uniform vec4 uRipples[${MAX_RIPPLES}];
uniform sampler2D uShadowMap;
uniform mat4 uShadowMatrix;
uniform float uShadowReady;
uniform float uShadowBias;
uniform vec2 uShadowSize;
uniform samplerCube uEnv;
uniform float uEnvReady;
uniform vec3 uFogColor;
uniform float uFogDensity;
uniform vec3 uBody;
uniform float uAlphaBase;
uniform float uRefl;
varying vec3 vW;
${SKY_GLSL}
${CAUS_GLSL}
float waveH(vec2 p){
  float t = uTime;
  float k = mix(1.0, 0.35, uSea);
  float A = mix(1.0, 2.5, uSea);
  vec2 q = p * k;
  float h = sin(dot(q, vec2(3.0, 2.0)*W0) + t*1.1)*0.010
          + sin(dot(q, vec2(-3.0, 7.0)*W0) + t*1.45)*0.007
          + sin(dot(q, vec2(13.0, -3.0)*W0) - t*1.9)*0.004
          + sin(dot(q, vec2(-16.0, -13.0)*W0) + t*2.6)*0.0022;
  h *= A;
  if (uSea < 0.5) {
    for (int i = 0; i < ${MAX_RIPPLES}; i++) {
      vec4 r = uRipples[i];
      float age = t - r.z;
      if (age < 0.0 || age > 4.0 || r.w <= 0.0) continue;
      float d = distance(p, r.xy);
      float x = d - age*1.2;
      float env = exp(-x*x*2.5) * exp(-age*0.9) * r.w / (1.0 + d*1.2);
      h += sin(x*14.0) * 0.006 * env;
    }
  }
  return h;
}
float shadowAt(vec3 wp){
  vec4 sc = uShadowMatrix * vec4(wp, 1.0);
  sc.xyz /= sc.w;
  if (sc.x < 0.0 || sc.x > 1.0 || sc.y < 0.0 || sc.y > 1.0 || sc.z > 1.0) return 1.0;
  float z = sc.z + uShadowBias;
  vec2 ts = 1.5 / uShadowSize;
  float s = 0.0;
  s += step(z, unpackRGBAToDepth(texture2D(uShadowMap, sc.xy + vec2(-ts.x, -ts.y))));
  s += step(z, unpackRGBAToDepth(texture2D(uShadowMap, sc.xy + vec2( ts.x, -ts.y))));
  s += step(z, unpackRGBAToDepth(texture2D(uShadowMap, sc.xy + vec2(-ts.x,  ts.y))));
  s += step(z, unpackRGBAToDepth(texture2D(uShadowMap, sc.xy + vec2( ts.x,  ts.y))));

}
void main(){
  vec2 p = vW.xz;
  float e = 0.05;
  float h0 = waveH(p);
  float hx = waveH(p + vec2(e, 0.0));
  float hz = waveH(p + vec2(0.0, e));
  float S = 3.5;
  vec3 n = normalize(vec3(-(hx - h0)/e*S, 1.0, -(hz - h0)/e*S));
  float dist = length(cameraPosition - vW);
  n = normalize(mix(n, vec3(0.0, 1.0, 0.0), smoothstep(12.0, 70.0, dist) * (1.0 - uSea*0.6)));
  vec3 V = normalize(cameraPosition - vW);
  float NdV = max(dot(n, V), 0.0);
  float fres = 0.02 + 0.98*pow(1.0 - NdV, 5.0);
  vec3 R = reflect(-V, n);
  R.y = abs(R.y);
  vec3 env = skyGrad(R);
  if (uEnvReady > 0.5 && uSea < 0.5) env = textureCube(uEnv, R, 2.0).rgb;
  float s = 1.0;
  if (uShadowReady > 0.5) s = shadowAt(vW + vec3(n.x, 0.0, n.z)*0.6);
  float sd = max(dot(R, uSunDir), 0.0);
  float spec = pow(sd, 180.0)*2.2 + pow(sd, 24.0)*0.1;
  vec3 sunCol = vec3(1.0, 0.94, 0.95);
  vec3 col; float alpha;
  if (uSea < 0.5) {
    float em = clamp(fres*0.9 + uRefl*0.38, 0.0, 1.0);
    col = mix(uBody*(0.5 + 0.6*s), env, em) + sunCol*spec*s;
    // 日なたに出る、白い光の網目
    float cs = dsCaus(p + n.xz*2.0, uTime*1.2);
    col += vec3(0.85, 1.0, 1.0) * cs * uCaus * (0.15 + 1.6*s) * (1.0 - fres);
    alpha = mix(uAlphaBase + 0.12*s, 0.95, max(fres, uRefl*0.35)) + cs*uCaus*s*0.35;
    col = mix(col, uFogColor, 1.0 - exp(-uFogDensity*uFogDensity*dist*dist));

    col = mix(uBody*(0.6 + 0.4*s), env, clamp(fres*1.2, 0.0, 1.0)) + sunCol*spec*s;
    vec3 hz = skyGrad(normalize(vec3(-V.x, 0.0, -V.z)));

    attribute float seed; uniform float uTime; uniform float uPR; uniform vec3 uWrap; varying float vA;

      p += vec3(sin(t*0.07 + seed*6.28)*0.7, sin(t*0.05 + seed*3.1)*0.45, cos(t*0.06 + seed*5.0)*0.7);

    varying float vA;

  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,

function addDust(n, x0, x1, y0, y1, z0, z1, wrap = null) {
  if (wrap) { x0 = 0; x1 = wrap[0]; y0 = 0; y1 = wrap[1]; z0 = 0; z1 = wrap[2]; }
  dustMat.uniforms.uWrap.value.set(...(wrap || [0, 0, 0]));
  const pos = new Float32Array(n * 3), seed = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    pos[i*3] = x0 + Math.random() * (x1 - x0); pos[i*3+1] = y0 + Math.random() * (y1 - y0); pos[i*3+2] = z0 + Math.random() * (z1 - z0);
    seed[i] = Math.random();
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('seed', new THREE.BufferAttribute(seed, 1));
  dust = new THREE.Points(g, dustMat);

// ------------------------------------------------------------------
// ステージ 1 の迷宮：最初の広間をもとにした、大きな白い建築の連なり
//   マス目は 2。列 c → x = -24 + 2c、行 r → z = -43.5 - 2r（北へ進むほど r が増える）
//   床は基本プール。最初の広間のように、ところどころに飛び石と足場がある。
//   ・大広間（ハブ）…最初の広間と同じ作り（東にフィン、北のアーチへ続く飛び石）。
//                     再訪するたびに 天窓・足場・扉・壁・中央の像 が段階的に変わる（E）
//   ・北：永遠の回廊（A）… 広間のような部屋が続く。3 回巡ると出口の中庭へ抜けられる
//   ・北西：鉤形の水路（B）… 角を曲がると別の水路に出て、長い回廊を通り、入口の通路へ戻る
//   ・西：三つの扉（C）… どの扉も同じ部屋へ（扉の数は段階 1・2 で増える）
//   ・西の果て：白い塔（D）… 上り続けると同じ踊り場へ。1 階上の扉から上の回廊（別の階層）へ
//   ・抜け道 … 段階 2 で広間の南西の壁が消え、長い回廊へ近道できる
// ------------------------------------------------------------------
// 鉤形の通路（入口 → 曲がる → 曲がる）。視線が抜けないので、ここでループを継ぐ。
//   ブロック単位の形：(0,0) (1,0) (1,1)★ (1,2) (2,2) (3,2) ［(4,2) は出口］。mirror で東西反転。
function hook(g, cR, r0, o) {
  const B = o.blk, at = (u, v) => ({ c0: o.mirror ? cR - (u * B + B - 1) : cR + u * B, r0: r0 + v * B });
  const blocks = [[0, 0], [1, 0], [1, 1], [1, 2], [2, 2], [3, 2]];
  if (o.entry) blocks.unshift([-1, 0]);
  if (o.exit) blocks.push([4, 2]);
  for (const [u, v] of blocks) {
    const p = at(u, v);
    const opt = { h: o.h, top: o.top, pool: !!o.pool, lv: o.pool ? undefined : 0 };
    g.floor(p.c0, p.r0, p.c0 + B - 1, p.r0 + B - 1, opt);
    const cc = p.c0 + Math.floor(B / 2), rc = p.r0 + Math.floor(B / 2);
    if (o.pool) g.stone(g.cx(cc), g.cz(rc));
    if (o.lamps) g.lamp(cc, rc, 1.2);
  }
  // ループの発動帯：★のブロックの北半分のうち、手前の細い帯（前後とも見通せない位置）
  const t = at(1, 1);
  return { x0: g.x0(t.c0), x1: g.x0(t.c0 + B), z1: g.zS(t.r0) - g.C * B * 0.5, z0: g.zS(t.r0) - g.C * B * 0.75, y0: -5, y1: 20 };
}

function buildMaze1() {
  const MATS = { floor: M.floor1, wall: M.wall1, ceil: M.ceil, fin: M.fin };
  const HT = 12, TP = 13;   // 広間と同じ天井高
  let trigB, trigC1, trigC3;
  const G = new Grid({
    C: 2, ox: -24, oz: -43.5, y: 0, top: TP, h: 6, slabDepth: 3, under: 1, mats: MATS,
    define(g) {
      g.ext(10, -7, 13, 0);                  // アーチの先の通路
      g.ext(-41, 20, -36, 30);               // 白い塔
      // ── 大広間（56×36）。床はプール、西に歩ける縁、入口に足場、東にフィン
      g.pool(-2, 1, 25, 18, { h: HT, top: TP });
      g.floor(9, 1, 14, 3, { h: HT, top: TP });               // 入口の足場（通路から下りたところ）
      g.floor(-2, 1, -1, 18, { h: HT, top: TP });             // 西の縁
      g.fins(26, 1, 26, 18, 'z', TP);
      g.door(12, 19, 15, 19, 'x', { pool: true, arch: 9 });   // 北のアーチ → A
      g.door(-1, 19, 2, 19, 'x', { pool: true, arch: 9 });    // 北西のアーチ → B
      g.door(-3, 9, -3, 10, 'z', { arch: 4.6 });              // 西の扉（いつもある）→ C
      g.stoneLine(4, -53, 4, -80.5);                          // 入口 → 北のアーチ（最初の広間と同じ一直線）
      // ── A：永遠の回廊。広間のような部屋（24×14）がアーチでつながる。扉は東西交互
      for (let k = 0; k <= 5; k++) {
        const b = 20 + 8 * k, inW = (k - 1) % 2 === 0, outW = k % 2 === 0;
        g.pool(4, b, 15, b + 6, { h: HT, top: TP });
        g.fins(16, b, 16, b + 6, 'z', TP);
        g.door(outW ? 4 : 12, b + 7, outW ? 7 : 15, b + 7, 'x', { pool: true, arch: 9 });
        // 入ってきた扉の真ん中 → 出ていく扉の真ん中（扉は東西交互なので、部屋を斜めに渡る）
        g.stoneLine(inW ? -12 : 4, g.zS(b) + 1, outW ? -12 : 4, g.zN(b + 6) - 1, 2.6, k > 0);
        const pc = outW ? 11 : 7;                              // 部屋ごとの小さな足場（交互）
        g.floor(pc, b + 3, pc + 1, b + 4, { h: HT, top: TP });
      }
      // ── 出口の中庭（空が開いている）：飛び石で光る門へ
      g.pool(2, 68, 19, 85, { sky: true, top: 14 });
      g.floor(8, 82, 13, 85, { sky: true, top: 14 });          // 門の前の足場
      g.floor(2, 82, 4, 85, { sky: true, top: 14 });           // 階段の下
      g.wall(1, 70, 1, 71, { top: 14, gap: [10, 13.5] });      // 上の回廊からの出入口
      g.stoneLine(4, -178.5, 2, -205.5, 2.6, true);
      g.stoneLine(-12.5, -209, -9.5, -209, 3);
      g.thing((B, gg) => addGate(B, gg.group, gg.x0(9) + 0.4, gg.x0(13) - 0.4, gg.zN(85) + 0.4, 0, 6.5));
      // ── B：北西のアーチ → 水路 → 鉤形（V1）
      g.pool(-1, 20, 2, 23, { h: 9, top: TP });
      g.stoneLine(-21, -84.5, -19, -91);
      trigB = hook(g, -3, 24, { blk: 3, mirror: true, entry: true, pool: true, h: 7, top: 8, lamps: true });
      // B の接続先（V2）：入口側は行き止まり。出口から西へ、長い回廊を南へ下り、入口の通路の横へ
      hook(g, -3, 40, { blk: 3, mirror: true, entry: true, exit: true, pool: true, h: 7, top: 8, lamps: true });
      g.pool(-26, 46, -18, 48, { h: 7, top: 8 }); g.stoneLine(-60, -138.5, -74, -138.5);
      g.floor(-29, -6, -29, 48, { h: 7, top: 8 });             // 長い回廊：西側は歩ける縁
      g.pool(-28, -6, -27, 48, { h: 7, top: 8 });
      for (let r = 0; r <= 44; r += 8) g.sky(-28, r, -27, r);  // ところどころ天窓
      g.floor(-29, -4, 8, -3, { h: 7, top: 8 });               // 南の回廊：北側は縁、南側はプール
      g.pool(-28, -6, 8, -5, { h: 7, top: 8 });
      g.door(9, -5, 9, -4, 'z', { h: 3.6, top: 8 });           // 入口の通路の横の扉
      g.floor(-2, -2, 1, -1, { h: 5, top: 8 });                // 抜け道の手前（段階 2 で広間とつながる）
      // ── C：西の扉の先。三つの小部屋（本物は真ん中）→ 同じ部屋
      trigC1 = hook(g, -4, 1, { blk: 2, mirror: true, h: 4.6, top: 8, lamps: true });
      hook(g, -4, 9, { blk: 2, mirror: true, exit: true, h: 4.6, top: 8, lamps: true });
      trigC3 = hook(g, -4, 17, { blk: 2, mirror: true, h: 4.6, top: 8, lamps: true });
      g.pool(-24, 9, -14, 18, { h: 9, top: 10 });              // 同じ部屋：プールの中の白い球
      g.floor(-21, 12, -18, 15, { h: 9, top: 10 });
      g.thing((B, gg) => {
        const ball = new THREE.Mesh(new THREE.SphereGeometry(1.6, 48, 32), M.plain);
        ball.position.set(gg.x0(-19), 3.6, gg.zN(13)); ball.castShadow = true; gg.group.add(ball);
        sbox(B, M.plain, gg.x0(-19) - 1, gg.x0(-19) + 1, 0, 1, gg.zN(13) - 1, gg.zN(13) + 1);
      });
      g.stoneLine(-51.5, -71.5, -56.5, -71.5, 2.5);
      // ── D：長い回廊 → 白い塔の入口
      g.floor(-35, 21, -30, 22, { h: 4, top: 8 });
    },
    variant(g, ph) {
      const p = Math.min(ph, 3);
      // 天窓の位置
      [[[0, 6, 3, 7], [18, 12, 21, 13]], [[6, 3, 9, 4], [16, 14, 19, 15]], [[-2, 12, 1, 13], [10, 8, 13, 9], [20, 4, 23, 5]], [[4, 15, 21, 15]]][p]
        .forEach(([a, b, c, d]) => g.sky(a, b, c, d));
      // 扉の数が増える（C の左右の扉）
      if (p >= 1) g.door(-3, 1, -3, 2, 'z', { arch: 4.6 });
      if (p >= 2) g.door(-3, 17, -3, 18, 'z', { arch: 4.6 });
      // 壁が消える → 抜け道
      if (p >= 2) g.floor(-2, 0, 1, 0, { h: 5, top: TP });
      // 中央の島と足場の配置
      const ISL = [[3, 8], [8, 9], [16, 6], [11, 11]][p];
      g.floor(ISL[0], ISL[1], ISL[0] + 3, ISL[1] + 3, { h: HT, top: TP });
      const ix = g.x0(ISL[0] + 2), iz = g.zS(ISL[1] + 2);
      g.stoneLine(-6, -48, ix, iz);                                        // 入口の足場 → 島
      g.stoneLine(ix, iz, -21, -82);                                       // 島 → 北西のアーチ
      g.stoneLine(ix, iz, -24.5, -63.5);                                   // 島 → 西の縁
      [[[18, 3], [22, 15]], [[20, 10]], [[6, 15], [21, 3]], [[17, 16], [19, 8], [7, 4]]][p]
        .forEach(([c, r]) => g.floor(c, r, c + 1, r + 1, { h: HT, top: TP }));
      g.thing((B, gg) => {   // 島の上の像（段階ごとに形が変わる）
        let m;
        if (p === 0) m = new THREE.Mesh(new THREE.SphereGeometry(1.4, 48, 32), M.plain);
        else if (p === 1) { m = new THREE.Mesh(new THREE.TorusGeometry(2.2, 0.35, 24, 64), M.plain); }
        else if (p === 2) m = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 1.6), M.plain);
        else m = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 6, 32), M.plain);
        m.position.set(ix, p === 3 ? 3 : 2.8, iz); if (p === 2) m.rotation.set(0.6, 0.7, 0);
        m.castShadow = true; gg.group.add(m);
        sbox(B, M.plain, ix - 0.9, ix + 0.9, 0, 0.8, iz - 0.9, iz + 0.9);
      });
    },
  });
  // 上の回廊（y=10）：塔の 1 階上の扉 → 西の窓の長い回廊 → 中庭の上の踊り場
  const GU = new Grid({
    C: 2, ox: -24, oz: -43.5, y: 10, top: 6, h: 5, slabDepth: 0.6, under: 0.6, mats: MATS,
    define(g) {
      g.ext(-41, 20, -36, 30); g.ext(2, 67, 20, 87);
      g.floor(-35, 21, -34, 24, { h: 4 }); g.lamp(-34, 23, 0.8);
      g.floor(-35, 25, -32, 69, { h: 5 });
      g.floor(-31, 66, 0, 69, { h: 5 });
      g.floor(-1, 70, 1, 71, { h: 3.6 });
      for (let r = 32; r <= 62; r += 6) g.wall(-36, r, -36, r + 1, { gap: [1.1, 3.6] });
      for (let r = 30; r <= 66; r += 9) g.lamp(-33, r, 1.2);
      g.lamp(-14, 67, 1.2);
    },
  });
  const ghost = (y) => new Grid({
    C: 2, ox: -24, oz: -43.5, y, top: 6, h: 5, slabDepth: 0.6, under: 0.6, mats: MATS,
    define(g) { g.ext(-41, 20, -36, 30); g.floor(-35, 21, -34, 24, { h: 4 }); g.lamp(-34, 23, 0.8); },
  });
  const grids = [G, GU, ghost(20), ghost(30)];
  grids.forEach((g) => g.build(0));
  RT.grids.push(...grids);

  // ── 白い塔（D）：芯壁のある折り返し階段。1 層 10。幅の広い段
  {
    const B = new BoxBatch(), W = M.wall1, Pm = M.plain;
    const X0 = -106, I0 = -104, I1 = -96, X1 = -94, F = 10, TOP = 43;
    const ZS = -83.5, L0 = -85.5, L1 = -89.5, N0 = -99.5, N1 = -103.5, ZN = -105.5;
    sbox(B, W, X0, X1, -3, TOP, L0, ZS); sbox(B, W, X0, X1, -3, TOP, ZN, N1);
    sbox(B, W, -101, -99, -0.5, TOP, N0, L1);                          // 芯の壁
    B.add(M.ceil, X0, X1, TOP, TOP + 0.6, ZN, ZS);
    sbox(B, M.floor1, I0, I1, -0.6, 0, N1, L0);
    for (let k = 0; k <= 4; k++) {
      const y = k * F, yt = Math.min(y + F, TOP);
      B.add(W, X0, I0, y, y + 1.2, N1, L0); B.add(W, X0, I0, y + 2.8, yt, N1, L0);
      B.add(W, X0, I0, y + 1.2, y + 2.8, N1, -88.5); B.add(W, X0, I0, y + 1.2, y + 2.8, -86.5, L0);
      sbox(B, W, I1, X1, y, yt, N1, L1);
      sbox(B, W, I1, X1, y + 3.6, yt, L1, L0);
      if (k < 4) sbox(B, M.floor1, I1, X1, y - 0.5, y, L1, L0);
      if (k === 4) break;
      if (k > 0) sbox(B, Pm, I0, I1, y - 0.5, y, L1, L0);
      sbox(B, Pm, I0, I1, y + 4.5, y + 5, N1, N0);
      flight(B, Pm, -99, I1, L1, N0, y, y + 5, 20, k === 0 ? 0 : null);
      flight(B, Pm, I0, -101, N0, L1, y + 5, y + 10, 20);
      addLamps([[-100, y + 8.2, -87.5]], root);
      B.add(Pm, -100.02, -99.98, y + 8.35, y + 9.5, -87.52, -87.48);
    }
    sbox(B, Pm, I0, I1, 39.5, 40, L1, L0);
    solidBox(X0, I0, -3, TOP, N1, L0);
    // 出口の中庭：上の回廊から降りる幅の広い階段
    const cx0 = G.x0(2), cx1 = G.x0(5);
    sbox(B, Pm, cx0, cx1, -0.6, 10, G.zN(71), G.zS(70));
    flight(B, Pm, cx0, cx1, G.zN(81), G.zN(71), 0, 10, 40, -0.6);
    B.flush(root);
  }

  RT.loops.push(
    { id: 'A 永遠の回廊', zone: G.box(4, 48, 15, 50), when: (v) => v.y < -0.1, offset: [0, 0, 32], cooldown: 1.5, phase: 1, max: 3, keepVel: true },
    { id: 'B 角のループ', zone: trigB, when: (v) => v.y < -0.1, offset: [0, 0, -32], cooldown: 1.5, phase: 1, keepVel: true },
    { id: 'C 扉のループ(南)', zone: trigC1, when: (v) => v.y < -0.1, offset: [0, 0, -16], cooldown: 1.5, phase: 1, keepVel: true },
    { id: 'C 扉のループ(北)', zone: trigC3, when: (v) => v.y < -0.1, offset: [0, 0, 16], cooldown: 1.5, phase: 1, keepVel: true },
    { id: 'D 階段のループ', zone: { x0: -104, x1: -96, z0: -91.5, z1: -85.5, y0: 19.3, y1: 21.5 }, offset: [0, -10, 0], cooldown: 0.8, phase: 1, keepVel: true },
  );
  RT.hub = G.box(-2, 1, 25, 18);
  RT.exit = Object.assign(G.box(9, 85, 12, 85), { z0: G.zN(85), z1: G.zN(85) + 1.8 });
  RT.safe = [
    G.box(4, 28, 15, 67), G.box(1, 67, 20, 87),
    G.box(-18, 23, -3, 55), G.box(-30, -7, -26, 49),
    G.box(-26, 0, -6, 23), { x0: -107, x1: -93, z0: -106, z1: -83, y0: -1, y1: 60 },
    { x0: -300, x1: 300, z0: -400, z1: 100, y0: 8, y1: 100 },
  ];
  // 遠くの景色：海に立つ白い塔の影と月の位置も、段階ごとに動く
  const obel = new THREE.Mesh(new THREE.BoxGeometry(6, 60, 6), M.plain);
  root.add(obel);
  RT.onPhase = (ph) => {
    const O = [[-200, -260], [-90, -320], [150, -290], [20, -380]][Math.min(ph, 3)];
    obel.position.set(O[0], 28, O[1]);
    const Mo = [[0.03, 0.105, -1], [0.3, 0.17, -1], [-0.35, 0.2, -1], [0.0, 0.32, -1]][Math.min(ph, 3)];
    MOON_DIR.set(...Mo).normalize();
  };
  RT.onPhase(0);
}

// ------------------------------------------------------------------
// ステージ 2：BLUE CORRIDOR（青の回廊）
//   細いタイル張りの回廊に浅い水。天井の右寄りのスリットから日が落ち、
//   右の壁と水面を照らす。突き当たりは海とピンクの入道雲が見えるテラス。
// ------------------------------------------------------------------
function buildBlueCorridor() {
  const W0 = -3, W1 = 3, B = -0.35, H = 7;
  const Z_START = 5, Z_DRY = -2, Z_TER = -34, Z_EDGE = -45;
  const N0 = -15, N1 = -13;          // 右の壁の扉（柱の広間へ）
  const S0 = -26, S1 = -4, SX = 0.4; // 天井のスリット

  // 床
  addSlab(M.wall2, W0, W1, Z_DRY, Z_START, 0);          // 入口の乾いた床
  addSlab(M.wall2, W0, W1, Z_TER, Z_DRY, B);            // 水の通路
  addSlab(M.wall2, -7, 7, Z_EDGE, Z_TER, 0);            // 突き当たりのテラス
  addSlab(M.wall2, W1, W1 + 1, N0, N1, 0);              // 右の扉の床
  addSlab(M.wall2, 0, 2, Z_START, Z_START + 1, 0);      // 手前の壁の扉の床
  const tl = [];
  tileRect(tl, W0, W1, Z_DRY, Z_START, 0, 1);
  tileRect(tl, W0, W1, Z_TER, Z_DRY, B, 1);
  tileRect(tl, -7, 7, Z_EDGE, Z_TER, 0, 1);
  tileRect(tl, W1, W1 + 1, N0, N1, 0, 1);
  tileRect(tl, 0, 2, Z_START, Z_START + 1, 0, 1);
  addTileField(M.floor2, tl);

  // 左の壁・手前の壁
  addBox(M.wall2, W0 - 0.6, W0, 0, H + 0.6, Z_TER, Z_START + 1);
  // 手前の壁（背中側に小さな扉：角のループの戻り口）
  addBox(M.wall2, W0 - 0.6, 0, 0, H + 0.6, Z_START, Z_START + 1);
  addBox(M.wall2, 2, W1 + 1, 0, H + 0.6, Z_START, Z_START + 1);
  addBox(M.wall2, 0, 2, 3.2, H + 0.6, Z_START, Z_START + 1);
  // 右の壁（途中に扉：柱の広間へ）
  addBox(M.wall2, W1, W1 + 1, 0, H + 0.6, N1, Z_START);
  addBox(M.wall2, W1, W1 + 1, 0, H + 0.6, Z_TER, N0);
  addBox(M.wall2, W1, W1 + 1, 3.4, H + 0.6, N0, N1);
  // 天井：右寄りに細長いスリット（ここから日が落ちる）
  addBox(M.ceil2, W0 - 0.6, SX, H, H + 0.6, Z_TER, Z_START, { solid: false });
  addBox(M.ceil2, SX, W1 + 0.6, H, H + 0.6, S1, Z_START, { solid: false });
  addBox(M.ceil2, SX, W1 + 0.6, H, H + 0.6, Z_TER, S0, { solid: false });

  // 突き当たり：右は背の高い白いブロックと張り出し、左は低いブロック
  addBox(M.wall2, W1, 7, 0, H + 0.6, -39, Z_TER);
  addBox(M.plain, 1.4, W1, 5.3, 6.1, -38, Z_TER, { solid: false });
  addBox(M.wall2, -7, W0 - 0.6, 0, 4.2, -40, Z_TER);
  addBox(M.wall2, W0 - 0.6, W0, 0, 4.2, -40, Z_TER);
  // テラスの縁（見えない柵）
  solidBox(-7.6, 7.6, -3, 2.5, Z_EDGE - 0.6, Z_EDGE);
  solidBox(-7.6, -7, -3, 2.5, Z_EDGE, -40);
  solidBox(7, 7.6, -3, 2.5, Z_EDGE, -43);   // 右奥は細い渡り廊下へ（角のループ）

  // 回廊の奥をほんのり明るく
  const fill = new THREE.PointLight(0xd6e6ff, 9, 22, 1.6);
  fill.position.set(0, 4.5, -18);
  root.add(fill);

  addWater(W0, W1, Z_TER, Z_DRY, -0.05);
  addDust(150, W0 + 0.2, W1 - 0.2, 0.3, H - 0.3, Z_TER, Z_START);
  buildMaze2();
}

// ------------------------------------------------------------------
// ステージ 2 の迷宮（回廊の右の扉の先）
//   列 c → x = 4 + 2c、行 r → z = 5 - 2r
//   ・柱の広間（ハブ）…再訪のたびに 照明・天窓・柱・扉が段階的に変わる（E）
//   ・東の廊下の先：永遠の廊下（A）… 3 回巡ると階段の中庭へ
//   ・南：扉の広間（C）… 三つの扉がすべて同じ部屋へ
//   ・テラスの右奥（B）… 角を曲がると、回廊の入口（背中側の扉）へ戻ってくる
//   ・階段の中庭 → 上のテラス（別の階層）の門が出口。抜け道は段階 2 で開く
// ------------------------------------------------------------------
function buildMaze2() {
  const G = new Grid({
    C: 2, ox: 4, oz: 5, y: 0, top: 9, h: 7, slabDepth: 3,
    mats: { floor: M.floor2, wall: M.wall2, ceil: M.ceil2 },
    define(g) {
      g.ext(-4, 0, -1, 19);                // 水の回廊
      g.ext(-6, 19, 1, 25);                // テラスと両脇のブロック
      // 回廊の右の扉 → 柱の広間
      g.floor(0, 9, 1, 9, { h: 3.4 }); g.lamp(1, 9, 0.8);
      g.floor(2, 5, 9, 12, { h: 7 });
      g.wall(4, 7); g.wall(7, 7); g.wall(4, 10);
      g.floor(10, 12, 13, 12, { h: 3 }); g.lamp(12, 12, 0.8);   // 東の扉 → A への廊下
      g.floor(5, 4, 5, 4, { h: 3 });                    // 南の扉 → C
      g.floor(10, 6, 13, 6, { h: 3.4 }); g.lamp(12, 6, 0.8);
      g.wall(14, 6, 14, 6, { gap: [1.1, 2.7] });        // 東の行き止まり（海の見える小窓）
      // A：永遠の廊下（扉は左右交互）
      g.floor(13, 13, 13, 13, { h: 3 });
      for (let k = 0; k <= 6; k++) {
        const b = 14 + 3 * k, d = k % 2 === 0 ? 10 : 13;
        g.floor(10, b, 13, b + 1, { h: 4.5 }); g.sky(11, b, 12, b);
        g.lamp(11, b + 1, 1.1); g.lamp(12, b + 1, 1.1);
        g.floor(d, b + 2, d, b + 2, { h: 3 });
      }
      // 階段の中庭（空が開いている）
      g.floor(8, 35, 15, 42, { sky: true, top: 9 });
      g.wall(14, 43, 15, 43, { top: 7 });
      // 抜け道（中庭側からは行き止まり。段階 2 で広間の東の壁が開く）
      g.floor(11, 8, 17, 8, { h: 3.2 }); g.floor(17, 9, 17, 35, { h: 3.2 }); g.floor(16, 35, 16, 35, { h: 3.2 });
      g.lamp(14, 8, 0.8); g.lamp(17, 16, 0.8); g.lamp(17, 24, 0.8); g.lamp(17, 32, 0.8);
      // C：扉の広間 → 三つの小部屋 → 同じ部屋
      g.floor(2, -8, 6, 3, { h: 6 }); g.lamp(4, -6, 1.4); g.lamp(4, 1, 1.4);
      for (const rr of [-8, -4, 0]) { g.floor(7, rr, 7, rr, { h: 3.4 }); sChunk(g, 8, rr, { exit: rr === 0 }); }
      g.floor(13, 0, 17, 3, { h: 5 });
      g.thing((B, gg) => {   // 同じ部屋の目印：白い円柱と水盤
        const c = gg.center(15, 1);
        const col = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 3.2, 32), M.plain);
        col.position.set(c.x, 1.6, c.z - 1); col.castShadow = true; gg.group.add(col);
        solidCyl(c.x, c.z - 1, 0.5, 0, 3.2);
      });
      // B：テラスの右奥 → 鉤形の小部屋（V1）
      g.wall(1, 21); g.wall(1, 23); g.floor(1, 22, 2, 22, { h: 3.4 });
      sChunk(g, 3, 22);
      // B の接続先（V2）：回廊の入口の背中側へ
      g.floor(-7, -5, -7, -5, { h: 3.4 });
      sChunk(g, -6, -5, { exit: true });
      g.floor(-2, -2, -2, -1, { h: 3.4 });
    },
    variant(g, ph) {
      const p = Math.min(ph, 3);
      const L = [[[3, 6], [8, 6], [3, 11], [8, 11]], [[5, 6], [6, 11], [3, 8], [8, 9]],
                 [[3, 5], [8, 12], [5, 12], [6, 5]], [[2, 9], [9, 8], [5, 7], [6, 10]]][p];
      L.forEach(([c, r]) => g.lamp(c, r, 2.2));
      const S = [[[5, 8, 6, 9]], [[2, 5, 3, 6], [8, 11, 9, 12]], [[5, 5, 6, 12]], [[2, 8, 3, 9], [8, 8, 9, 9], [5, 11, 6, 12]]][p];
      S.forEach(([a, b, c, d]) => g.sky(a, b, c, d));
      if (p < 3) g.wall(7, 10);                                                // 段階 3 で柱が一本消える
      if (p >= 1) { g.floor(0, 6, 1, 6, { h: 3 }); g.lamp(0, 6, 0.8); }      // 扉が増える（小さなくぼみ）
      if (p >= 2) g.floor(10, 8, 10, 8, { h: 3.2 });                           // 壁が消える → 抜け道

const _sc = new THREE.OrthographicCamera(), _v = new THREE.Vector3();
function fitShadow(b) {
  _sc.position.copy(sun.position); _sc.lookAt(sun.target.position); _sc.updateMatrixWorld();
  const inv = _sc.matrixWorldInverse;
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9, z0 = 1e9, z1 = -1e9;
  for (const X of [b[0], b[1]]) for (const Y of [b[2], b[3]]) for (const Z of [b[4], b[5]]) {
    _v.set(X, Y, Z).applyMatrix4(inv);
    x0 = Math.min(x0, _v.x); x1 = Math.max(x1, _v.x); y0 = Math.min(y0, _v.y); y1 = Math.max(y1, _v.y); z0 = Math.min(z0, _v.z); z1 = Math.max(z1, _v.z);
  }
  const cam = sun.shadow.camera;
  cam.left = x0 - 1; cam.right = x1 + 1; cam.bottom = y0 - 1; cam.top = y1 + 1;
  cam.near = Math.max(0.5, -z1 - 2); cam.far = -z0 + 2;
  cam.updateProjectionMatrix();
  const maxS = isTouch ? 2048 : 4096, w = x1 - x0, h = y1 - y0;
  const mw = w >= h ? maxS : Math.max(512, Math.pow(2, Math.ceil(Math.log2(maxS * w / h))));
  const mh = h > w ? maxS : Math.max(512, Math.pow(2, Math.ceil(Math.log2(maxS * h / w))));
  if (sun.shadow.mapSize.x !== mw || sun.shadow.mapSize.y !== mh) {
    sun.shadow.mapSize.set(mw, mh);
    if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
    for (const m of [waterMat, seaMat]) { m.uniforms.uShadowReady.value = 0; m.uniforms.uShadowSize.value.set(mw, mh); }
  }
}

// ------------------------------------------------------------------
// プレイヤー
// ------------------------------------------------------------------
const P = {
  pos: new THREE.Vector3(1, 0, 24.5), vy: 0, onGround: true,
  yaw: 0, pitch: -0.02, vel: new THREE.Vector2(), fast: false,
  camY: 1.65, bob: 0, rippleT: 0,
};
const EYE = 1.65, RADIUS = 0.3, SUPPORT = 0.25, STEP = 0.7, HEIGHT = 1.75, GRAV = 14, JUMP_V = 4.6;
const SPEED_WALK = 3.2, SPEED_FAST = 5.2;

function groundAt(x, z, feet, allow) {
  let g = -Infinity;
  for (const s of near(x, z)) {
    let inside;
    if (s.type === 'box') inside = x >= s.x0 - SUPPORT && x <= s.x1 + SUPPORT && z >= s.z0 - SUPPORT && z <= s.z1 + SUPPORT;
    else inside = (x - s.x) ** 2 + (z - s.z) ** 2 <= (s.r + SUPPORT) ** 2;
    if (inside && s.y1 <= feet + allow && s.y1 > g) g = s.y1;
  }
  return g;
}
function pushOut(pos, feet, allow) {
  for (let iter = 0; iter < 3; iter++) {
    let moved = false;
    for (const s of near(pos.x, pos.z)) {
      if (s.y1 <= feet + allow || s.y0 >= feet + HEIGHT) continue;   // 足場か頭上
      if (s.type === 'box') {
        const cx = Math.max(s.x0, Math.min(pos.x, s.x1)), cz = Math.max(s.z0, Math.min(pos.z, s.z1));
        const dx = pos.x - cx, dz = pos.z - cz;
        const d2 = dx * dx + dz * dz;
        if (d2 >= RADIUS * RADIUS) continue;
        if (d2 > 1e-10) {
          const d = Math.sqrt(d2), k = (RADIUS - d) / d;
          pos.x += dx * k; pos.z += dz * k;
        } else {   // 中心が箱の中：最短方向へ押し出す
          const pens = [[pos.x - s.x0 + RADIUS, -1, 0], [s.x1 - pos.x + RADIUS, 1, 0], [pos.z - s.z0 + RADIUS, 0, -1], [s.z1 - pos.z + RADIUS, 0, 1]];
          pens.sort((a, b) => a[0] - b[0]);
          pos.x += pens[0][1] * pens[0][0]; pos.z += pens[0][2] * pens[0][0];
        }
        moved = true;
      } else {
        const dx = pos.x - s.x, dz = pos.z - s.z, rr = RADIUS + s.r;
        const d2 = dx * dx + dz * dz;
        if (d2 >= rr * rr) continue;
        const d = Math.sqrt(d2) || 1e-5, k = (rr - d) / d;
        pos.x += dx * k; pos.z += dz * k; moved = true;
      }
    }
    if (!moved) break;
  }
}
const inPool = (x, z) => (x > ST.pool[0] && x < ST.pool[1] && z > ST.pool[2] && z < ST.pool[3]) || RT.grids.some((g) => g.poolAt(x, z));

function addRipple(x, z, strength) {
  ripples[rippleIdx].set(x, z, U.uTime.value, strength);
  rippleIdx = (rippleIdx + 1) % MAX_RIPPLES;
}

// 入力
const keys = new Set();
const touchMove = { x: 0, y: 0 };
let playing = false, ended = false, lockMode = 'none';   // 'lock' | 'drag' | 'touch'
let trans = null;   // ステージ間の移動 {t, phase}

function setSpeedLabel() { $('speed').textContent = P.fast ? '速歩' : '歩行'; }
setSpeedLabel();

function stepPlayer(dt) {
  let ix = 0, iz = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp')) iz += 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) iz -= 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) ix -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) ix += 1;
  ix += touchMove.x; iz += touchMove.y;
  const il = Math.hypot(ix, iz);
  if (il > 1) { ix /= il; iz /= il; }
  const wading = inPool(P.pos.x, P.pos.z) && P.pos.y < ST.water - 0.05;
  const spd = (P.fast ? SPEED_FAST : SPEED_WALK) * (wading ? 0.85 : 1);
  const sy = Math.sin(P.yaw), cy = Math.cos(P.yaw);
  const tx = (-sy * iz + cy * ix) * spd, tz = (-cy * iz - sy * ix) * spd;
  const a = 1 - Math.exp(-(P.onGround ? 10 : 2.5) * dt);
  P.vel.x += (tx - P.vel.x) * a; P.vel.y += (tz - P.vel.y) * a;

  const allow = P.onGround ? STEP : 0.25;   // 空中でも、すぐ足元の低い縁には乗れる
  P.pos.x += P.vel.x * dt; P.pos.z += P.vel.y * dt;
  pushOut(P.pos, P.pos.y, allow);

  const g = groundAt(P.pos.x, P.pos.z, P.pos.y, allow);
  if (P.onGround && g < P.pos.y - 0.001 && g > P.pos.y - 0.42) {
    P.pos.y = g;                                   // 小さな段差は下りる
  } else if (g >= P.pos.y - 0.001 && P.vy <= 0) {
    if (!P.onGround) onLand();
    P.pos.y = g; P.vy = 0; P.onGround = true;
  } else {
    P.onGround = false;
    P.vy -= GRAV * dt;
    P.pos.y += P.vy * dt;
    const g2 = groundAt(P.pos.x, P.pos.z, P.pos.y - P.vy * dt, 0.25);
    if (P.vy <= 0 && P.pos.y <= g2) { P.pos.y = g2; P.vy = 0; P.onGround = true; onLand(); }
  }
  if (!isFinite(P.pos.y) || P.pos.y < -6) resetPlayer();

  // 波紋
  const moving = Math.hypot(P.vel.x, P.vel.y);
  const nearWater = inPool(P.pos.x + Math.sign(P.vel.x) * 0.4, P.pos.z + Math.sign(P.vel.y) * 0.4);
  if (inPool(P.pos.x, P.pos.z) || nearWater) {
    P.rippleT -= dt;
    if (moving > 0.6 && P.rippleT <= 0 && P.onGround) {
      if (wading) { addRipple(P.pos.x, P.pos.z, 1.0); sfx.splash(0.5); }
      else if (P.pos.y < ST.water + 0.3) addRipple(P.pos.x + P.vel.x * 0.25, P.pos.z + P.vel.y * 0.25, 0.35);
      P.rippleT = wading ? 0.42 : 0.9;
    }
  }

  // カメラ（揺れはごく控えめ）
  const bobAmt = P.onGround ? Math.min(moving / SPEED_WALK, 1.4) : 0;
  P.bob += dt * moving * 2.0;
  const targetY = P.pos.y + EYE + Math.sin(P.bob * 2) * 0.011 * bobAmt;
  P.camY = P.onGround ? P.camY + (targetY - P.camY) * (1 - Math.exp(-16 * dt)) : targetY;
  updateCamera();

  checkLoops(dt);
  if (!ended && !trans && RT.exit && inBox(P.pos, RT.exit)) finish();
}
function updateCamera() {
  camera.position.set(P.pos.x, P.camY, P.pos.z);
  camera.rotation.set(P.pitch, P.yaw, 0);
}
function onLand() {
  if (inPool(P.pos.x, P.pos.z) && P.pos.y < ST.water + 0.3) {
    addRipple(P.pos.x, P.pos.z, P.pos.y < ST.water ? 1.6 : 0.6);
    if (P.pos.y < ST.water) sfx.splash(0.9);
  }
}
function resetPlayer() {
  const s = ST.spawn;
  P.pos.set(s.x, s.y, s.z); P.vy = 0; P.vel.set(0, 0); P.yaw = s.yaw; P.pitch = -0.02; P.onGround = true; P.camY = s.y + EYE;
  updateCamera();
}

// ------------------------------------------------------------------
// 環境音（WebAudio で生成）
// ------------------------------------------------------------------
const sfx = (() => {
  let ctx = null, master = null, verb = null, muted = false, dripTimer = 0, waterGain = null;
  function noiseBuf(sec) {
    const b = ctx.createBuffer(1, ctx.sampleRate * sec, ctx.sampleRate), d = b.getChannelData(0);
    let last = 0;
    for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
    return b;
  }
  function start() {
    if (ctx) { ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.85; master.connect(ctx.destination);
    verb = ctx.createConvolver();
    const ir = ctx.createBuffer(2, ctx.sampleRate * 3.2, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3.2); }
    verb.buffer = ir;
    const vg = ctx.createGain(); vg.gain.value = 0.5; verb.connect(vg).connect(master);
    const n = ctx.createBufferSource(); n.buffer = noiseBuf(4); n.loop = true;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
    const ng = ctx.createGain(); ng.gain.value = 0.11;
    n.connect(lp).connect(ng).connect(master); n.start();
    const w = ctx.createBufferSource(); w.buffer = noiseBuf(5); w.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.8;
    waterGain = ctx.createGain(); waterGain.gain.value = 0.035;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.13;
    const lg = ctx.createGain(); lg.gain.value = 0.02;
    lfo.connect(lg).connect(waterGain.gain); lfo.start();
    w.connect(bp).connect(waterGain).connect(master); waterGain.connect(verb); w.start();
  }
  function drip() {
    if (!ctx || muted) return;
    const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
    const f = 900 + Math.random() * 900;
    o.type = 'sine'; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 0.55, t + 0.12);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.03, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    o.connect(g); g.connect(verb); g.connect(master); o.start(t); o.stop(t + 0.3);
  }
  function splash(v) {
    if (!ctx || muted) return;
    const t = ctx.currentTime, s = ctx.createBufferSource(); s.buffer = noiseBuf(0.4);
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 700 + Math.random() * 500; bp.Q.value = 1.2;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.06 * v, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    s.connect(bp).connect(g); g.connect(master); g.connect(verb); s.start(t); s.stop(t + 0.4);
  }
  function update(dt) { dripTimer -= dt; if (dripTimer <= 0) { drip(); dripTimer = 2 + Math.random() * 5; } }
  function toggle() { muted = !muted; if (master) master.gain.setTargetAtTime(muted ? 0 : 0.85, ctx.currentTime, 0.1); return muted; }
  function waterLevel(v) { if (waterGain) waterGain.gain.setTargetAtTime(v, ctx.currentTime, 0.5); }
  return { start, splash, update, toggle, waterLevel };
})();

// ------------------------------------------------------------------
// UI・操作
// ------------------------------------------------------------------
const overlay = $('overlay'), startBtn = $('start'), canvas = renderer.domElement;
let hintTimer = null, areaShownFor = -1;

STAGES.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'chip'; b.textContent = s.jp;
  b.addEventListener('click', () => { if (i !== stageIndex) { loadStage(i); areaShownFor = -1; startBtn.textContent = 'はじめる'; } });
  $('stages').appendChild(b);
});

function showArea() {
  if (areaShownFor === stageIndex) return;
  areaShownFor = stageIndex;
  $('a1').textContent = ST.name; $('a2').textContent = ST.jp;
  $('area').style.opacity = 1; setTimeout(() => $('area').style.opacity = 0, 4200);
  showHint(isTouch ? '左で歩く・右をなぞって見回す — ' + ST.hint : ST.hint, 7000);
  sfx.waterLevel(stageIndex === 1 ? 0.06 : 0.035);
}
function begin() {
  sfx.start();
  if (isTouch) { lockMode = 'touch'; enterPlay(); $('touch').classList.add('on'); return; }
  let req;
  try { req = canvas.requestPointerLock(); } catch (e) { fallbackDrag(); return; }
  if (req && req.catch) req.catch(() => fallbackDrag());
}
function fallbackDrag() {
  if (playing) return;
  lockMode = 'drag'; enterPlay();
  showHint('マウスをドラッグして見回せます（この画面ではポインター固定が使えません）', 7000);
}
function enterPlay() {
  playing = true; overlay.classList.add('hidden');
  if (!trans) showArea();
}
function pausePlay() {
  playing = false; keys.clear(); touchMove.x = touchMove.y = 0;
  if (!ended) { startBtn.textContent = 'つづける'; overlay.classList.remove('hidden'); }
}
function showHint(text, ms) {
  const h = $('hint'); h.textContent = text; h.style.opacity = 1;
  clearTimeout(hintTimer); hintTimer = setTimeout(() => h.style.opacity = 0, ms);
}
startBtn.addEventListener('click', begin);
document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement === canvas) { lockMode = 'lock'; enterPlay(); }
  else if (lockMode === 'lock') { lockMode = 'none'; pausePlay(); }
});
document.addEventListener('pointerlockerror', () => fallbackDrag());

document.addEventListener('mousemove', (e) => {
  if (!playing) return;
  if (lockMode === 'lock' || (lockMode === 'drag' && (e.buttons & 1))) {
    P.yaw -= e.movementX * 0.0022; P.pitch -= e.movementY * 0.0022;
    P.pitch = Math.max(-1.5, Math.min(1.5, P.pitch));
  }
});
function jump() { if (P.onGround && !trans) { P.vy = JUMP_V; P.onGround = false; } }
function toggleSpeed() { P.fast = !P.fast; setSpeedLabel(); showHint(P.fast ? '速歩' : '歩行', 1200); }
addEventListener('keydown', (e) => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyM' && !e.repeat) { const m = sfx.toggle(); showHint(m ? '音：オフ' : '音：オン', 1500); }
  if (!playing) return;
  if (e.code === 'Escape' && lockMode === 'drag') { pausePlay(); return; }
  keys.add(e.code);
  if (e.code === 'Space' && !e.repeat) jump();
  if ((e.code === 'ShiftLeft' || e.code === 'ShiftRight') && !e.repeat) toggleSpeed();
});
addEventListener('keyup', (e) => keys.delete(e.code));
addEventListener('blur', () => keys.clear());

// タッチ操作
if (isTouch) {
  $('keys').innerHTML = '<b>左</b><span>スティックで歩く</span><b>右</b><span>なぞって見回す</span><b>跳ぶ</b><span>ジャンプ</span><b>速さ</b><span>歩く速さを切り替え</span>';
  const stick = $('stick'), knob = $('knob');
  let stickId = null, lookId = null, sx = 0, sy = 0, lx = 0, ly = 0;
  const layer = $('touch');
  layer.addEventListener('touchstart', (e) => {
    for (const t of e.changedTouches) {
      if (t.target.classList.contains('tbtn')) continue;
      if (t.clientX < innerWidth * 0.45 && stickId === null) {
        stickId = t.identifier; sx = t.clientX; sy = t.clientY;
        stick.style.left = (sx - 60) + 'px'; stick.style.top = (sy - 60) + 'px'; stick.style.bottom = 'auto';
      } else if (lookId === null) { lookId = t.identifier; lx = t.clientX; ly = t.clientY; }
    }
    e.preventDefault();
  }, { passive: false });
  layer.addEventListener('touchmove', (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === stickId) {
        let dx = t.clientX - sx, dy = t.clientY - sy; const l = Math.hypot(dx, dy), m = 46;
        if (l > m) { dx *= m / l; dy *= m / l; }
        knob.style.transform = `translate(${dx}px,${dy}px)`;
        touchMove.x = dx / m; touchMove.y = -dy / m;
      } else if (t.identifier === lookId) {
        P.yaw -= (t.clientX - lx) * 0.005; P.pitch -= (t.clientY - ly) * 0.005;
        P.pitch = Math.max(-1.5, Math.min(1.5, P.pitch)); lx = t.clientX; ly = t.clientY;
      }
    }
    e.preventDefault();
  }, { passive: false });
  const endTouch = (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === stickId) { stickId = null; touchMove.x = touchMove.y = 0; knob.style.transform = ''; stick.style.left = '28px'; stick.style.top = ''; stick.style.bottom = '34px'; }
      if (t.identifier === lookId) lookId = null;
    }
  };
  layer.addEventListener('touchend', endTouch); layer.addEventListener('touchcancel', endTouch);
  $('tjump').addEventListener('touchstart', (e) => { e.preventDefault(); jump(); }, { passive: false });
  $('tspeed').addEventListener('touchstart', (e) => { e.preventDefault(); toggleSpeed(); }, { passive: false });
  $('tpause').addEventListener('touchstart', (e) => { e.preventDefault(); $('touch').classList.remove('on'); pausePlay(); }, { passive: false });
}

// ゴール：次のステージへ、または終わり
function finish() {
  keys.clear(); touchMove.x = touchMove.y = 0;
  if (ST.next != null) { trans = { t: 0, phase: 'out' }; return; }
  ended = true; trans = { t: 0, phase: 'end' };
  if (document.pointerLockElement) document.exitPointerLock();
  playing = false;
  $('touch').classList.remove('on');
}
function closeEnd(i) {
  ended = false; trans = null;
  $('end').classList.remove('show'); $('fade').style.opacity = 0;
  loadStage(i); areaShownFor = -1;
  startBtn.textContent = 'はじめる'; overlay.classList.remove('hidden');
}
$('again').addEventListener('click', () => closeEnd(stageIndex));
$('fromTop').addEventListener('click', () => closeEnd(0));

function updateTransition(dt) {
  if (!trans) return;
  trans.t += dt;
  const f = $('fade');
  if (trans.phase === 'out') {
    f.style.opacity = Math.min(trans.t / 2.2, 1);
    if (trans.t > 2.5) {
      loadStage(ST.next);
      trans = { t: 0, phase: 'in' };
    }
  } else if (trans.phase === 'in') {
    f.style.opacity = Math.max(1 - trans.t / 2.2, 0);
    if (trans.t > 0.4 && areaShownFor !== stageIndex && playing) showArea();
    if (trans.t > 2.2) { f.style.opacity = 0; trans = null; if (playing) showArea(); }
  } else if (trans.phase === 'end') {
    f.style.opacity = Math.min(trans.t / 2.4, 1);
    if (trans.t > 2.6 && !$('end').classList.contains('show')) {
      $('endText').innerHTML = ST.endText;
      $('end').classList.add('show');
    }
  }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (composer) composer.setSize(innerWidth, innerHeight);
});
document.addEventListener('visibilitychange', () => { if (document.hidden && playing && lockMode !== 'lock') pausePlay(); });

// ------------------------------------------------------------------
// ループ
// ------------------------------------------------------------------
const clock = new THREE.Clock();
loadStage(0);

function render() {
  if (composer) composer.render(); else renderer.render(scene, camera);
}
function refreshEnvironment() {
  // 影は描画済み → 水面シェーダーへ渡す
  if (sun.shadow.map) for (const m of [waterMat, seaMat]) { m.uniforms.uShadowMap.value = sun.shadow.map.texture; m.uniforms.uShadowReady.value = 1; }
  // 建築の柔らかい反射：ステージごとに一度だけキューブマップへ（リアルタイム反射はしない）
  const ws = [water, ...RT.grids.map((g) => g.water)].filter(Boolean);
  ws.forEach((w) => { w.visible = false; });
  if (dust) dust.visible = false;
  sky.position.copy(cubeCam.position);
  cubeCam.update(renderer, scene);
  ws.forEach((w) => { w.visible = true; });
  if (dust) dust.visible = true;
  waterMat.uniforms.uEnvReady.value = 1;
}
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  U.uTime.value += dt;

  if (playing && !trans) {
    let t = dt;
    while (t > 1e-5) { const h = Math.min(t, 1 / 120); stepPlayer(h); t -= h; }
  } else if (!playing && !ended && !overlay.classList.contains('hidden')) {
    // タイトル画面：ゆっくり見回す
    camera.position.set(P.pos.x, P.camY, P.pos.z);
    camera.rotation.set(P.pitch, P.yaw + Math.sin(U.uTime.value * 0.08) * 0.12, 0);
  }
  if (playing) { sfx.update(dt); if (!trans) updatePhase(dt); }
  updateTransition(dt);
  sky.position.copy(camera.position);

  render();
  if (envPending) { envPending = false; refreshEnvironment(); }
}

// 起動
try {
  loop();
  window.__dsReady = true;
  window.__ds = { P, solids, step: stepPlayer, loadStage, get playing(){ return playing; }, get ended(){ return ended; },
    get stage(){ return stageIndex; }, get trans(){ return trans; }, tick: (dt) => updateTransition(dt),
    RT, PH, updatePhase, near };
  startBtn.disabled = false; startBtn.textContent = 'はじめる';
} catch (e) {
  console.error(e);
  $('msg').textContent = '起動できませんでした：' + e.message;
}
</script>
</body>
</html>
