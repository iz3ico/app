<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>夢のふち — Edge of Sleep</title>
<meta name="theme-color" content="#09120f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#dfe9e3; --dim:#8fa59a; --accent:#9dffd0; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#050807; overflow:hidden; color:var(--ink);
    font-family:"Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif; user-select:none; }
  #view { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:pointer; }
  body.ingame #view { cursor:none; }
  body.ingame.draglook #view { cursor:grab; }
  #draghint { position:fixed; right:24px; bottom:20px; font-size:11px; letter-spacing:.2em; color:#6d8279; opacity:0; transition:opacity 1s; }
  body.ingame.draglook #draghint { opacity:.8; }
  .layer { position:fixed; inset:0; pointer-events:none; }

  #crosshair { position:fixed; left:50%; top:50%; width:4px; height:4px; margin:-2px 0 0 -2px; border-radius:50%;
    background:rgba(230,255,240,.55); transition:all .2s; opacity:0; }
  body.ingame #crosshair { opacity:1; }
  #crosshair.active { width:10px; height:10px; margin:-5px 0 0 -5px; background:transparent; border:1px solid rgba(200,255,225,.85); }
  #prompt { position:fixed; left:50%; top:calc(50% + 26px); transform:translateX(-50%); font-size:14px; letter-spacing:.12em;
    color:#e6fff1; text-shadow:0 0 8px rgba(0,0,0,.9); opacity:0; transition:opacity .25s; white-space:nowrap; }
  #prompt.show { opacity:.92; }

  #subtitle { position:fixed; left:50%; bottom:11vh; transform:translateX(-50%); max-width:min(760px, 88vw); text-align:center;
    font-family:"Shippori Mincho", serif; font-size:clamp(16px, 2.1vw, 21px); line-height:1.7; letter-spacing:.06em;
    text-shadow:0 0 12px #000, 0 0 3px #000; opacity:0; transition:opacity .6s; }
  #subtitle.show { opacity:1; }
  #subtitle .speaker { display:block; font-family:"Zen Kaku Gothic New", sans-serif; font-size:11px; letter-spacing:.35em;
    color:var(--accent); opacity:.8; margin-bottom:4px; }
  #subtitle.phone .txt { color:#cfffe6; }
  #subtitle.thought .txt { color:#c9d4cf; font-style:italic; }

  #objective, #counter { position:fixed; left:28px; top:24px; font-size:12px; letter-spacing:.3em; color:var(--dim);
    opacity:0; transition:opacity 1.2s; text-shadow:0 0 6px #000; }
  #counter { top:46px; color:#bfe8d2; }
  #objective.show, #counter.show { opacity:.85; }

  #areacard { position:fixed; left:0; right:0; top:34vh; text-align:center; opacity:0; text-shadow:0 0 20px #000; }
  #areacard.show { animation: card 7s ease forwards; }
  #areacard .code { font-size:12px; letter-spacing:.8em; color:var(--accent); }
  #areacard .name { font-size:clamp(34px, 6vw, 64px); letter-spacing:.35em; font-weight:300; margin:8px 0; }
  #areacard .sub { font-family:"Shippori Mincho", serif; font-size:16px; letter-spacing:.5em; color:var(--dim); }
  @keyframes card { 0%{opacity:0; filter:blur(8px)} 18%{opacity:1; filter:blur(0)} 70%{opacity:1} 100%{opacity:0; filter:blur(4px)} }

  #note { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(2,5,4,.55);
    opacity:0; pointer-events:none; transition:opacity .35s; }
  #note.show { opacity:1; pointer-events:auto; }
  #note .sheet { width:min(460px, 86vw); padding:34px 38px 26px; background:#e3e1d6; color:#26292a;
    font-family:"Shippori Mincho", serif; line-height:1.95; letter-spacing:.05em; font-size:16px;
    box-shadow:0 30px 80px rgba(0,0,0,.6); transform:rotate(-1.2deg);
    background-image: radial-gradient(ellipse at 70% 80%, rgba(90,110,95,.25), transparent 60%), radial-gradient(ellipse at 20% 10%, rgba(120,120,100,.18), transparent 50%); }
  #note.poster .sheet { transform:rotate(.8deg); background-color:#e8e4d6; }
  #note .sheet h2 { margin:0 0 14px; font-size:12px; letter-spacing:.4em; color:#6b726e; font-family:"Zen Kaku Gothic New", sans-serif; font-weight:400; }
  #note p { margin:0 0 12px; }
  #note .big { font-size:22px; font-weight:600; letter-spacing:.2em; }
  #note .dim { color:#6a6f6b; font-size:14px; }
  #note .center { text-align:center; }
  #note .close { margin-top:18px; font-size:11px; letter-spacing:.3em; color:#7b817d; font-family:"Zen Kaku Gothic New", sans-serif; }
  /* XP-ish dialog style */
  #note.window .sheet { transform:none; padding:0; background:#ece9d8; font-family:Tahoma, "Zen Kaku Gothic New", sans-serif;
    border:1px solid #0831d9; border-radius:8px 8px 0 0; overflow:hidden; font-size:15px; }
  #note.window .sheet h2 { margin:0; padding:7px 10px; color:#fff; font-weight:700; letter-spacing:.05em; font-size:13px;
    background:linear-gradient(#0a5fd8, #2a7cf0 45%, #0848b8); font-family:Tahoma, sans-serif; }
  #note.window #note-body { padding:22px 26px 6px; }
  #note.window .close { padding:0 26px 16px; text-align:center; }

  .screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .8s; text-align:center; }
  .screen.show { opacity:1; pointer-events:auto; }
  #title { background: radial-gradient(ellipse at 50% 60%, rgba(5,12,9,.15), rgba(3,7,6,.85)); cursor:pointer; }
  #title .jp { font-family:"Shippori Mincho", serif; font-size:clamp(40px, 8vw, 92px); letter-spacing:.4em; font-weight:400;
    margin-left:.4em; text-shadow:0 0 40px rgba(120,255,190,.25); }
  #title .en { font-size:12px; letter-spacing:1.1em; color:var(--dim); margin:6px 0 60px; margin-left:1.1em; }
  #title .start { font-size:13px; letter-spacing:.5em; color:var(--accent); animation:breathe 3.5s ease-in-out infinite; }
  #title .hint { position:absolute; bottom:28px; font-size:11px; letter-spacing:.2em; color:#6d8279; line-height:2; }
  #title .chapters { margin-top:34px; display:flex; gap:12px; }
  #title .chapter { background:transparent; border:1px solid #2c3d35; color:#7f978b; font:inherit; font-size:11px;
    letter-spacing:.3em; padding:7px 16px; cursor:pointer; transition:all .25s; }
  #title .chapter:hover { border-color:#6fa3e8; color:#cfe2ff; }
  @keyframes breathe { 0%,100%{opacity:.35} 50%{opacity:1} }

  #pause { background:rgba(3,7,6,.78); backdrop-filter: blur(6px); }
  #pause h1 { font-weight:300; letter-spacing:.6em; font-size:22px; margin:0 0 30px; margin-left:.6em; }
  .panel { display:grid; grid-template-columns:auto 220px; gap:14px 22px; align-items:center; font-size:13px; letter-spacing:.12em; color:var(--dim); text-align:left; }
  .panel input[type=range] { width:100%; accent-color:#7fe3b2; }
  .panel select { background:#0d1512; color:var(--ink); border:1px solid #2c3d35; padding:5px 8px; font-family:inherit; }
  .btn { margin-top:26px; background:transparent; border:1px solid #3f5a4d; color:var(--ink); padding:11px 34px; font:inherit;
    letter-spacing:.4em; cursor:pointer; transition:all .25s; }
  .btn:hover { background:#13221b; border-color:var(--accent); color:#fff; }
  .btn.sub { border-color:#26332d; color:var(--dim); padding:8px 22px; font-size:12px; margin-top:12px; }
  .keys { margin-top:30px; font-size:11px; letter-spacing:.15em; color:#6d8279; line-height:2.1; }
  .keys b { display:inline-block; min-width:44px; padding:1px 6px; margin-right:6px; border:1px solid #2c3d35; color:#b9cdc3; font-weight:400; text-align:center; }

  #end { background:#f4f7fb; color:#1e3a5f; }
  #end .t { font-size:13px; letter-spacing:.6em; color:#5f86b8; }
  #end .big { font-family:"Shippori Mincho", serif; font-size:clamp(26px, 4vw, 40px); letter-spacing:.3em; margin:18px 0; }
  #end p { color:#4a6587; letter-spacing:.12em; line-height:2; font-size:14px; }
  #end .btn { border-color:#9db8da; color:#1e3a5f; }
  #end .btn:hover { background:#e2ecf8; }
  #end.night { background:#050b09; color:#cfe8dc; }
  #end.night .t { color:#5f9c80; }
  #end.night p { color:#8fb5a3; }
  #end.night #end-next { color:#7fe3b2; }
  #end.night .btn { border-color:#2f4a3e; color:#cfe8dc; }
  #end.night .btn:hover { background:#0f1d17; }
  #end-next { margin-top:14px; font-size:12px; letter-spacing:.5em; color:#2a7cf0; }

  #ghosts { position:fixed; inset:0; pointer-events:none; }
  #ghosts .ghostwin { position:absolute; mix-blend-mode:screen; filter:blur(0.4px) saturate(.6); animation: ghostdrift 40s linear infinite alternate; }
  @keyframes ghostdrift { from { translate: 0 0; } to { translate: 1.5vw -1vh; } }
  #flash { position:fixed; inset:0; opacity:0; pointer-events:none; }
  #fatal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:40px; text-align:center; color:#ffb9b9; }
  #fatal.show { display:flex; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="ghosts"></div>
<div id="crosshair"></div>
<div id="prompt"></div>
<div id="objective"></div>
<div id="counter"></div>
<div id="areacard"></div>
<div id="subtitle"></div>
<div id="note"><div class="sheet"><h2 id="note-title"></h2><div id="note-body"></div><div class="close">[E] / クリックで閉じる</div></div></div>

<div id="title" class="screen show">
  <div class="jp">夢のふち</div>
  <div class="en">EDGE OF SLEEP</div>
  <div class="start">クリックして はじめる</div>
  <div class="chapters"><button id="chapter2" class="chapter">AREA 02 — WINDOWCORE</button><button id="chapter3" class="chapter">AREA 03 — CLOUDCORE</button><button id="gallery" class="chapter">異常存在ギャラリー</button></div>
  <div class="hint">ヘッドホン推奨　／　WASD 移動・マウス 視点・Shift 走る・Ctrl(C) しゃがむ・E 調べる・ESC ポーズ</div>
</div>

<div id="pause" class="screen">
  <h1>PAUSE</h1>
  <div class="panel">
    <label for="sens">マウス感度</label><input id="sens" type="range" min="0.3" max="2.5" step="0.05" value="1">
    <label for="vol">音量</label><input id="vol" type="range" min="0" max="1" step="0.01" value="0.8">
    <label for="quality">描画解像度</label>
    <select id="quality"><option value="auto">自動 (60〜100%)</option><option value="0.6">低 (60%)</option><option value="0.8" selected>中 (80%)</option><option value="1">高 (100%)</option></select>
    <label for="fx">エフェクト品質</label>
    <select id="fx"><option value="0">低（AO・被写界深度・街灯の影なし）</option><option value="1">中</option><option value="2" selected>高</option></select>
    <label for="anom">異常演出の頻度</label>
    <select id="anom"><option value="off">オフ</option><option value="low">少なめ</option><option value="normal" selected>標準</option><option value="high">多め</option></select>
  </div>
  <button id="resume" class="btn">再開する</button>
  <button id="restart" class="btn sub">最初からやり直す</button>
  <div class="keys">
    <div><b>WASD</b>移動　<b>Mouse</b>視点　<b>Shift</b>走る</div>
    <div><b>Ctrl / C</b>しゃがむ　<b>E</b>調べる・拾う　<b>ESC</b>ポーズ</div>
  </div>
</div>

<div id="end" class="screen">
  <div class="t">AREA 01 — GLOOMCORE　CLEAR</div>
  <div class="big">画面の向こうは、晴れていた。</div>
  <p>霧の交差点はここで途切れています。<br>次のエリア「WINDOWCORE」は、開発の次の段階で制作します。</p>
  <div id="end-next"></div>
  <button id="end-restart" class="btn">もう一度、眠る</button>
</div>

<div id="draghint">ドラッグで視点を動かす</div>
<div id="flash"></div>
<div id="fatal"></div>

    vec2 uv = dir.xz/(dir.y+0.12)*1.3 + vec2(uCloudT*0.004,0.0);
    float n = fbm(uv*1.6)*0.65 + fbm(uv*5.0)*0.35;
    float cl = smoothstep(0.52-uCloud*0.25, 0.85, n) * smoothstep(0.0,0.25,dir.y);
    // lit tops, grey bellies, a silver lining towards the sun
    float bel = smoothstep(0.55,1.0,n);
    vec3 cc = mix(vec3(1.02), uSkyHorizon*0.75+0.12, bel*0.45) + uSunColor*pow(sun,6.0)*0.25*(1.0-bel);
    c = mix(c, cc, cl);
  }
  return c;
}

vec3 envColor(vec3 r){
  vec3 s = skyColor(normalize(vec3(r.x, max(r.y, 0.02), r.z)));
  float fogT = clamp(1.0 - exp(-uFogDensity*uFogDensity*90000.0), 0.0, 1.0);
  return mix(s, uFogColor, clamp(fogT*uSkyFog + (1.0-smoothstep(-0.03,0.28,r.y))*uHorizonFog, 0.0, 1.0));
}

float scatterIntegral(vec3 ro, vec3 rd, float t, vec3 lp){
  vec3 q = ro - lp;
  float b = dot(rd,q);
  float c = dot(q,q);
  float h2 = max(c - b*b, 0.36);
  float h = sqrt(h2);
  return (atan((t+b)/h) - atan(b/h)) / h;
}

// ---------------------------------------------------------------- materials
// Every material returns albedo and fills: rough (0 mirror .. 1 matte), height (for bump mapping),
// refl (how much environment it mirrors), wet (puddle mask for light streaks), bumpK (bump strength)
float gCurv; // surface curvature (rad/m), computed in main() in uniform control flow
vec2 wallUV(vec3 wp, vec3 n){
  // Flat walls: run u along the wall itself (exact for any yaw).
  // Curved surfaces (poles, pipes, trunks, tanks): that construction swings u by the object's
  // distance from the world origin as the normal turns, squeezing tens of metres of pattern
  // around a 10 cm pole. There, project along the dominant horizontal axis instead.
  if(gCurv > 0.6) return abs(n.x) > abs(n.z) ? vec2(wp.z*sign(n.x), wp.y) : vec2(-wp.x*sign(n.z), wp.y);
  vec2 t = normalize(vec2(-n.z, n.x) + 1e-5);
  return vec2(dot(wp.xz, t), wp.y);
}

// MATERIAL SET v7 \u2014 detail that matches the geometry.
// Each material layers:  base colour \u2192 structure (panels, bricks, planks, courses) \u2192
// mid-scale wear (2\u201330 cm: chips, pocks, cracks, rust, peeling, grime, rain streaks) \u2192
// a fine layer that fades out with distance (LOD) so it never shimmers.
// Three channels are driven separately: albedo, roughness and a height map for the
// normal (bump). Geometry-aware masks tie the wear to the real model:
//   gEdge  \u2013 curvature from the chamfered edges (paint chips, scuffs, exposed core)
//   n.y    \u2013 dust and moss settle on top faces, grime collects under overhangs
float gEdge;
float soft(vec2 p){ return vnoise(p)*0.7 + vnoise(p*2.03+5.0)*0.3; }
float soft3(vec3 p, vec3 n){ vec3 b = abs(n); b /= (b.x+b.y+b.z); return soft(p.zy)*b.x + soft(p.xz)*b.y + soft(p.xy)*b.z; }
float tri3(vec3 p, vec3 n){ vec3 b = abs(n); b /= (b.x+b.y+b.z); return vnoise(p.zy)*b.x + vnoise(p.xz)*b.y + vnoise(p.xy)*b.z; }
// thin line around fract()==0, anti-aliased by its own screen footprint: when the line is
// narrower than a pixel it widens to the pixel and fades by its true coverage, so seams,
// mortar and plank gaps neither break up nor form moir\xE9 at a distance
float seamLine(float f, float w){
  float d = min(f, 1.0-f);
  float fw = max(fwidth(f), 1e-6);
  float line = 1.0 - smoothstep(max(w - fw, 0.0), w + fw, d);
  return line * clamp(2.0*w/fw, 0.0, 1.0);
}
// voronoi: x = distance to nearest feature, y = its id
vec2 cells(vec2 p){
  vec2 i=floor(p), f=fract(p); float d1=8.0, id=0.0;
  for(int y=-1;y<=1;y++) for(int x=-1;x<=1;x++){
    vec2 g=vec2(x,y); vec2 o=vec2(hash(i+g), hash(i+g+19.17));
    vec2 r=g+o-f; float d=dot(r,r);
    if(d<d1){ d1=d; id=hash(i+g+7.7); }
  }
  return vec2(sqrt(d1), id);
}
// crack network: 1 on the crack line, with a mask so it only appears in places
float cracks(vec2 p, float w, float cover, float seed){
  // real cracks wander and zig-zag: two scales of warp, the fine one makes the line jagged
  vec2 pw2 = p + vec2(soft(p*0.7+seed), soft(p*0.7+seed+4.0))*0.6;
  pw2 += (vec2(vnoise(p*7.0+seed), vnoise(p*7.0+seed+9.0)) - 0.5)*0.07;
  float ce = cellEdge(pw2);
  // a thin dark core with a faint chipped shoulder \u2014 real cracks are millimetres, not brush strokes;
  // anti-aliased by footprint so distant cracks fade instead of breaking into dotted lines
  float fwc = max(fwidth(ce), 1e-6);
  float core = (1.0 - smoothstep(w*0.06, w*0.22 + fwc, ce)) * clamp(w*0.32/fwc, 0.0, 1.0);
  float rim = (1.0 - smoothstep(w*0.22, w*0.6 + fwc, ce)) * 0.25 * clamp(w*0.8/fwc, 0.0, 1.0);
  return max(core, rim) * smoothstep(1.0-cover, 1.0-cover+0.12, soft(p*0.23+seed*3.0));
}
// vertical rain / rust streaks hanging from upper edges
float streaks(vec2 wuv, float density){
  float col = vnoise(vec2(wuv.x*6.0, 3.0));
  float len = vnoise(vec2(wuv.x*2.3, wuv.y*0.35));
  return smoothstep(1.0-density, 1.0, col) * smoothstep(0.25, 0.75, len);
}


// ---------------------------------------------------------------- weathering (v8)
// Ageing is not painted on top of a wall: it *modulates* the wall that is already there.
// Every effect multiplies or tints the existing colour (so its grain, panels and bump stay
// visible through it), every boundary is domain-warped and soft, and every mask carries its
// own internal variation, so there are no flat, evenly-coloured, outlined shapes.
float fbm3o(vec2 p){ return vnoise(p)*0.5 + vnoise(p*2.13+1.7)*0.3 + vnoise(p*4.41+3.1)*0.2; }
float lum3(vec3 c){ return dot(c, vec3(0.3,0.55,0.15)); }

// peeling paint: small, clustered flakes with ragged edges; underneath is a mottled old coat /
// render, never a flat fill. Returns the flake mask; writes the colour and height change.
float paintPeel(vec2 wuv, float amount, float pw, inout vec3 c, inout float hgt){
  vec2 q = wuv*0.9 + vec2(fbm3o(wuv*1.3), fbm3o(wuv*1.3+7.0))*0.55;           // ragged, wandering edges
  float cluster = smoothstep(0.62, 0.86, fbm3o(q*0.35 + 11.0)) * amount;     // only in a few places
  float flakes = fbm3o(q*2.2) * 0.75 + fbm3o(q*7.0 + 3.0) * 0.25;           // big shapes, frayed borders
  float thr = 0.74 - cluster*0.2;
  float fw = max(fwidth(flakes), 1e-4);
  float on = step(0.001, cluster);
  float m = smoothstep(thr - fw*1.5, thr + fw*1.5, flakes) * on;
  // around a flake the paint has already gone chalky and stained: a wide, soft halo
  float halo = smoothstep(thr - 0.16, thr, flakes) * on;
  // underneath: the older, greyer coat \u2014 mottled, never a flat fill
  vec3 old = mix(c*vec3(0.8, 0.8, 0.76), vec3(lum3(c))*0.85, 0.35) * (0.88 + 0.22*fbm3o(q*6.0));
  c = mix(c, c*vec3(0.93, 0.92, 0.88), halo*0.6);
  c = mix(c, old, m*0.85);
  hgt += -m*0.06;                     // paint is thin: a whisper of relief, no dark outlines
  return m;
}

// the slow history of a wall: sun-bleached and chalky high up, dust on ledges, rain-washed
// runs from the top, a damp, wandering tide-line at the foot, grime under overhangs
vec3 weather(vec3 c, vec3 wp, vec2 wuv, vec3 n, bool wall, float top, float under, float pw, float amt, inout float rough, inout float hgt){
  float L = lum3(c);
  // age mottling: very low contrast, two scales, value and slight hue
  float m1 = fbm3o(wuv*0.55 + 3.0), m2 = fbm3o(wuv*2.6 + 9.0);
  c *= 0.95 + m1*0.08 + (m2 - 0.5)*0.05*(1.0 - smoothstep(0.3, 0.9, pw*3.0));
  c = mix(c, c*vec3(1.03, 1.0, 0.95), smoothstep(0.4, 0.8, m1)*0.4);          // faint yellowing
  if(wall){
    // sun bleaching + chalking: higher up, lighter and less saturated, unevenly
    float bleach = smoothstep(1.5, 7.0, wp.y) * smoothstep(0.3, 0.75, fbm3o(wuv*0.2 + 5.0)) * amt;
    c = mix(c, mix(vec3(lum3(c)), c, 0.7)*1.07 + 0.01, bleach*0.45);
    rough = mix(rough, min(1.0, rough + 0.06), bleach);
    // rain runs: long, thin, wandering, vertically stretched noise; they appear, thicken and die out
    float xr = wuv.x + (vnoise(vec2(wuv.y*0.55, wuv.x*0.4)) - 0.5)*0.16;
    float region = smoothstep(0.42, 0.78, vnoise(vec2(xr*0.7, 4.0)));                     // where water runs at all
    float span = smoothstep(0.28, 0.62, vnoise(vec2(xr*1.1 + 2.0, wuv.y*0.16)));           // how far down each run reaches
    float cols = fbm3o(vec2(xr*11.0, wuv.y*0.3));
    float runs = smoothstep(0.48, 0.82, cols) * region * span * amt;
    runs *= 0.65 + 0.35*vnoise(vec2(xr*45.0, wuv.y*2.5))*(1.0 - smoothstep(0.3, 0.9, pw*20.0));  // breakup inside each run
    float washed = smoothstep(0.78, 0.95, fbm3o(vec2(xr*15.0 + 5.0, wuv.y*0.35))) * region * span * amt;
    vec3 grime = c*mix(vec3(0.74, 0.73, 0.69), vec3(0.82, 0.83, 0.76), vnoise(wuv*1.7));    // brown-grey or green-grey
    c = mix(c, grime, runs*0.6);
    c = mix(c, c*1.06 + 0.008, washed*0.35);                                                 // cleaner lines where water ran fastest
    rough = mix(rough, rough - 0.05, runs*0.5);
    // rising damp: a wandering tide-line, darker and cooler below, a faint broken salt line on it
    float edgeH = 0.3 + fbm3o(vec2(wuv.x*0.7, 1.3))*1.1 * (0.6 + 0.4*vnoise(vec2(wuv.x*0.15, 8.0)));
    float d = edgeH - wp.y + (fbm3o(wuv*vec2(3.0, 2.0)) - 0.5)*0.12;
    float damp = smoothstep(-0.08, 0.45, d) * (0.65 + 0.35*fbm3o(wuv*1.4 + 2.0)) * amt;
    float tide = (1.0 - smoothstep(0.0, 0.05, abs(d - 0.03))) * smoothstep(0.45, 0.7, vnoise(wuv*vec2(5.0, 2.0))) * amt
                 * (1.0 - smoothstep(0.3, 0.9, pw*15.0));
    c = mix(c, c*vec3(0.72, 0.75, 0.71), damp*0.55);
    c = mix(c, c*1.07 + vec3(0.018, 0.018, 0.015), tide*0.3);
    rough = mix(rough, rough - 0.08, damp*0.4);
  }
  // grime collects under overhangs, dust settles on anything facing up
  float uG = under * (0.55 + 0.45*fbm3o(wuv*1.5 + 4.0));
  c = mix(c, c*0.78, uG*0.6*amt);
  float dust = top * smoothstep(0.3, 0.75, fbm3o(wp.xz*1.6 + 2.0)) * amt;
  c = mix(c, mix(c, vec3(0.5, 0.48, 0.44)*(0.5 + L), 0.5), dust*0.45);
  rough = mix(rough, 1.0, dust*0.4);
  return c;
}

vec3 material(int pat, vec3 col, vec3 wp, vec3 n, out float rough, out float hgt, out float refl, out float wet, out float bumpK){
  rough = 0.85; hgt = 0.0; refl = 0.0; wet = 0.0; bumpK = 0.0;
  vec2 pxz = wp.xz;
  float pw = length(fwidth(wp));
  #define LOD(f) (1.0 - smoothstep(0.3, 0.9, pw*(f)))
  bool wall = abs(n.y) < 0.6;
  vec2 wuv = wall ? wallUV(wp, n) : pxz;
  float top = smoothstep(0.6, 0.95, n.y), under = smoothstep(-0.3, -0.8, n.y);
  if(pat==1){ // asphalt: plain and quiet \u2014 a soft tone drift, faint sealed joints, a few large puddles
    float t = soft(pxz*0.09);
    float fine = vnoise(pxz*2.5)*LOD(2.5);
    float seal = cracks(pxz*0.22, 0.025, 0.15, 2.0) * LOD(1.5);
    float puddle = smoothstep(0.6, 0.64, soft(pxz*0.035+7.0) + (uWetness-0.5)*0.2);
    wet = puddle * uWetness;
    vec3 c = col*(0.78 + t*0.16 + (fine-0.5)*0.05);
    c = mix(c, col*0.55, seal*0.4);
    c *= mix(1.0, 0.62, wet) * mix(1.0, 0.9, uWetness*0.5);
    rough = mix(mix(0.88, 0.5, seal), 0.22, wet);
    refl = wet*0.35 + seal*0.03;
    hgt = (t*0.1 - seal*0.1)*(1.0-wet); bumpK = 0.008;
    return c;
  } else if(pat==2){ // concrete: formwork panels, cracks, chipped edges, moss
    vec2 q = wuv*vec2(0.5,0.34);
    // formwork rows are staggered and every panel was its own pour: own tone, own tie holes
    float row = floor(q.y);
    q.x += hash(vec2(row, 3.7))*0.5;
    vec2 pid = floor(q);
    vec2 t = fract(q);
    float seam = max(seamLine(t.x, 0.012), seamLine(t.y, 0.016)) * LOD(2.0);
    float pTone = (hash(pid + 1.3) - 0.5)*0.09;
    // (form-tie holes and pocks removed: rows/clusters of small dots)
    float tie = 0.0, grout = 0.0;
    float g = soft(wuv*0.35);
    float pock = 0.0;
    float crack = cracks(wuv*0.6, 0.03, 0.3, 4.0) * LOD(3.0);
    float foot = wall ? smoothstep(1.0, 0.0, wp.y) : 0.0;
    // moss only where water sits (tops, the damp foot), feathered and patchy, never a flat green blob
    float mossN = fbm3o(wp.xz*0.9 + wp.y*0.5);
    float moss = (top*0.8 + foot*0.45) * smoothstep(0.5, 0.82, mossN) * (0.6 + 0.4*vnoise(wuv*6.0));
    wet = wall ? 0.0 : smoothstep(0.62,0.66,soft(pxz*0.04+2.0))*uWetness*0.6;
    vec3 c = col*(0.9 + g*0.16 + pTone)*(1.0 - seam*0.3)*(1.0 - tie*0.6)*(1.0 - pock*0.35)*(1.0 - crack*0.38);
    c = mix(c, c*1.07, grout*0.6);          // grout plugs: only slightly paler than the wall they sit in
    rough = 0.9;
    float hw = 0.0;
    c = weather(c, wp, wuv, n, wall, top, under, pw, 1.0, rough, hw);
    c = mix(c, c*1.15 + 0.03, gEdge*0.45);                 // chipped arrises show fresh concrete
    c = mix(c, c*vec3(0.62, 0.82, 0.55)*(0.85 + 0.3*mossN), moss*0.5);   // moss tints the concrete it grows on
    rough = mix(mix(rough, 0.97, moss), 0.35, wet); refl = wet*0.4;
    hgt = -seam - tie*1.2 - pock*0.4 - crack*0.35 + moss*0.3; bumpK = 0.009;
    return c*mix(1.0, 0.7, wet);
  } else if(pat==3){ // grass: painterly swathes + clumps of blades, clover, bare spots
    float g = soft(pxz*0.05), g2 = soft(pxz*0.16+4.0);
    float k = smoothstep(0.3, 0.72, g*0.65 + g2*0.35);
    vec3 c = col * mix(vec3(0.6,0.8,0.72), vec3(1.12,1.06,0.68), k);
    // short turf: fine, slightly combed blade strokes (colour first, very little height),
    // darker gaps between strokes, a few clover patches and worn bare spots
    float comb = 0.6 + soft(pxz*0.08)*0.5;
    vec2 rp = vec2(cos(comb), sin(comb));
    vec2 sp = vec2(dot(pxz, rp), dot(pxz, vec2(-rp.y, rp.x)));
    float strokes = vnoise(sp*vec2(70.0, 14.0)) * LOD(70.0) + 0.5*(1.0 - LOD(70.0));
    float strokes2 = vnoise(sp*vec2(28.0, 6.0)+3.0) * LOD(28.0) + 0.5*(1.0 - LOD(28.0));
    float clover = smoothstep(0.7, 0.76, soft(pxz*0.9+8.0));
    float bare = smoothstep(0.74,0.8,soft(pxz*0.3+6.0));
    c *= 0.9 + strokes*0.1 + strokes2*0.06;
    c = mix(c, c*vec3(0.82,0.95,0.9), clover*0.4);
    c = mix(c, c*vec3(1.2,1.0,0.7)*0.85, bare*0.45);
    rough = 0.95;
    hgt = strokes2*0.3 + strokes*0.15; bumpK = 0.0015;
    return c;
  } else if(pat==4){ // bark: deep ridges, fissures, lichen
    float a = atan(n.x,n.z);
    vec2 bp = vec2(a*1.6, wp.y*1.2);
    float rid = smoothstep(0.2, 0.9, abs(sin(a*6.0 + wp.y*0.3 + vnoise(vec2(wp.y*0.8, a))*1.6)));
    float fis = cracks(bp*2.0, 0.08, 0.8, 1.0) * LOD(6.0);
    float lich = 0.0;   // (lichen spots removed)
    float moss = smoothstep(2.5,0.0,wp.y)*smoothstep(0.4,0.7,vnoise(vec2(a*1.5, wp.y*0.6)+3.0));
    vec3 c = col*(0.66 + rid*0.4)*(1.0 - fis*0.5);
    c = mix(c, vec3(0.55,0.6,0.5), lich*0.4);
    hgt = rid - fis; bumpK = 0.02; rough = 0.95;
    return mix(c, col*vec3(0.75,1.15,0.7)+vec3(0.02,0.04,0.02), moss*0.5);
  } else if(pat==5){ // brick: chipped bricks, crumbling mortar, soot
    vec2 uv = wuv*vec2(4.0,7.5);
    uv.x += step(1.0,mod(uv.y,2.0))*0.5;
    vec2 f = fract(uv);
    float mortar = max(seamLine(f.y, 0.09), seamLine(f.x, 0.05)) * LOD(7.5);
    float var = (hash(floor(uv))-0.5)*0.18;
    float chip = (1.0 - smoothstep(0.0, 0.12, min(min(f.x,1.0-f.x)*0.5, min(f.y,1.0-f.y)))) * step(0.6, hash(floor(uv)+3.0)) * LOD(10.0);
    vec3 c = mix(col*(0.95+var), col*0.55+0.16, mortar);
    c *= 1.0 - chip*0.2;
    hgt = -mortar - chip*0.4 + vnoise(uv*3.0)*0.2*LOD(25.0); bumpK = 0.016;
    rough = 0.9;
    c = weather(c, wp, wuv, n, wall, top, under, pw, 0.9, rough, hgt);
    return c;
  } else if(pat==6){ // stone: tri-planar grain, chisel facets, lichen, moss on top
    float g = soft3(wp*0.45, n);
    float grain = tri3(wp*8.0, n) * LOD(8.0);
    float lich = 0.0;   // (lichen spots removed)
    float crack = 0.0;
    { vec3 b = abs(n); vec2 cp = b.y > max(b.x,b.z) ? wp.xz : (b.x > b.z ? wp.zy : wp.xy); crack = cracks(cp*0.9, 0.035, 0.35, 6.0) * LOD(3.0); }
    float moss = top * smoothstep(0.45,0.7,soft(wp.xz*0.5+wp.y*0.3));
    vec3 c = col*(0.84 + g*0.26)*(0.94 + grain*0.12)*(1.0 - crack*0.45);
    c = mix(c, c*1.12, gEdge*0.4);
    c = mix(c, c*vec3(1.08,1.1,0.95)+0.02, lich*0.35);
    hgt = g*0.6 + grain*0.4 - crack; bumpK = 0.012;
    rough = 0.9;
    c = weather(c, wp, wallUV(wp, n), n, wall, top, under, pw, 0.8, rough, hgt);
    return mix(c, c*vec3(0.62,0.82,0.55)*(0.8 + 0.4*vnoise(wp.xz*3.0)), moss*0.5);
  } else if(pat==7){ // painted metal: chipped paint at edges and in patches, rust in the chips, rust runs
    vec3 bw = abs(n); bw /= (bw.x+bw.y+bw.z);
    vec2 mp = bw.y > 0.5 ? wp.xz : (bw.x > bw.z ? wp.zy : wp.xy);
    // where paint fails: corners, undersides and a few wear zones; inside those, ragged chips
    vec2 mq = mp + vec2(fbm3o(mp*2.0), fbm3o(mp*2.0+5.0))*0.25;
    float zone = smoothstep(0.55, 0.85, fbm3o(mq*0.9 + 2.0)) + gEdge*0.8 + under*0.25;
    float chipN = fbm3o(mq*7.0)*0.8 + vnoise(mp*26.0)*0.2*LOD(26.0);
    float thr = 0.78 - clamp(zone, 0.0, 1.0)*0.24;
    float fwc = max(fwidth(chipN), 1e-4);
    float chip = smoothstep(thr - fwc*1.5, thr + fwc*1.5, chipN) * step(0.05, zone);
    float bleed = smoothstep(thr - 0.12, thr, chipN) * step(0.05, zone) - chip;      // orange stain soaking out of each chip
    float runs = wall ? streaks(wuv*vec2(2.0,1.0), 0.28) * (0.5 + 0.5*vnoise(wuv*vec2(9.0, 0.6))) : 0.0;
    float dent = soft3(wp*3.0, n);
    vec3 paint = col*(0.94 + dent*0.1)*(0.95 + 0.08*fbm3o(mp*1.5));
    // rust is never one colour: dark brown pits, orange bloom, a little black
    float rv = fbm3o(mp*12.0);
    vec3 rustC = mix(vec3(0.2,0.11,0.06), vec3(0.42,0.22,0.09), rv) * (0.85 + 0.3*vnoise(mp*30.0)*LOD(30.0));
    vec3 c = mix(paint, rustC, chip);
    c = mix(c, c*vec3(0.86,0.72,0.58), bleed*0.5);
    c = mix(c, c*mix(vec3(0.8,0.62,0.48), vec3(0.7,0.66,0.6), vnoise(wuv*3.0)), runs*0.45*(1.0-chip));
    c = mix(c, c*0.75, under*0.35);
    rough = mix(0.45, 0.92, clamp(chip + runs*0.3, 0.0, 1.0));
    refl = 0.06*(1.0-chip);
    hgt = -chip*0.15 + dent*0.3; bumpK = 0.01;
    return c;
  } else if(pat==8){ // dirt: soft tone, damp hollows
    float g = soft(pxz*0.25), g2 = soft(pxz*0.8+3.0);
    float peb = 0.0;   // (pebble dots removed)
    wet = smoothstep(0.62,0.66,soft(pxz*0.1))*uWetness*0.5; rough = mix(0.95,0.4,wet); refl = wet*0.3;
    vec3 c = col*(0.8 + g*0.22 + g2*0.08);
    hgt = g2*0.4 + peb*0.8; bumpK = 0.014;
    return c*mix(1.0,0.7,wet);
  } else if(pat==10){ // foliage: soft leaf clumps, lit tops, dark cores
    vec3 b = abs(n); b /= (b.x+b.y+b.z);
    vec2 lp = b.y > 0.5 ? wp.xz : (b.x > b.z ? wp.zy : wp.xy);
    // soft clumps instead of a cell grid of round leaves (which read as a cluster of dots)
    float lv = vnoise(lp*4.0);
    vec2 lf = vec2(0.0, lv);
    float leaf = smoothstep(0.35, 0.75, lv) * LOD(4.0);
    float clump = (vnoise(wp.xy*1.2)+vnoise(wp.zy*1.2+5.0)+vnoise(wp.xz*1.2+9.0))/3.0;
    float tp = smoothstep(-0.3, 0.9, n.y);

    c *= 0.88 + leaf*0.18*(0.6+lf.y*0.8);

  } else if(pat==11){ // plaster/render: trowel texture, hairline cracks \u2014 and the wall's own history
    float g = soft(wuv*0.4);
    float trowel = soft(wuv*vec2(5.0,5.0)) * LOD(10.0);
    float crack = cracks(wuv*0.9, 0.025, 0.35, 3.0) * LOD(4.0);
    vec3 c = col*(0.92 + g*0.1 + trowel*0.04)*(1.0 - crack*0.32);
    hgt = trowel*0.12 - crack*0.35; bumpK = 0.008;
    rough = 0.9;

  } else if(pat==14){ // cloud
    hgt = soft(wp.xz*0.12 + wp.y*0.2)*1.4 + vnoise(wp.xz*0.6+wp.y*0.5)*0.3; bumpK = 0.05; rough = 1.0;

    float cy = wp.y*3.2;
    float course = fract(cy);
    float tileX = (wp.x+wp.z)*1.6 + floor(cy)*0.5;
    float edge = seamLine(course, 0.1);
    float side = seamLine(fract(tileX), 0.04) * LOD(4.0);

  } else if(pat==12){ // paper: fibres, creases, foxing
    float crease = (1.0 - smoothstep(0.0, 0.02, abs(fract(vUv.x*2.0+vUv.y*0.3)-0.5))) * 0.5;

  } else if(pat==15){ // glass: dust towards the bottom, smudges
    float dust = (wall ? smoothstep(0.6, 0.0, fract(wuv.y*0.36)) : 0.3) * 0.5 + soft(wuv*2.0)*0.3;

    vec2 g2 = wall ? wuv : pxz;

    // grain: soft, sparse figure along the plank (painted boards show only a hint of it)
    float gl = g2.y*12.0 + soft(vec2(g2.x*0.6, g2.y*2.0)+pid*7.0)*2.2;
    float gfade = 1.0 - smoothstep(0.2, 0.45, fwidth(gl)); // fade once a grain line is under ~2 px
    float grain = (sin(gl*6.2831)*0.5+0.5) * gfade + 0.5*(1.0-gfade);
    float streak = (vnoise(vec2(g2.x*0.7, g2.y*24.0)) - 0.5) * (1.0 - smoothstep(0.2, 0.5, fwidth(g2.y*24.0)));
    // lap siding: each board sits proud at its lower edge and casts a thin shadow on the one below
    float lap = wall ? plank : 0.0;
    float underShadow = wall ? smoothstep(0.82, 1.0, plank) * LOD(8.0) : 0.0;
    vec2 kn = cells(g2*vec2(1.5,4.0)+pid*3.0);
    float knot = (1.0 - smoothstep(0.03, 0.09, kn.x)) * step(0.82, kn.y);
    float nail = (1.0 - smoothstep(0.006, 0.012, length(vec2(fract(g2.x*1.25)-0.5, plank-0.5)*vec2(0.8,0.25)))) * LOD(20.0);
    float weather = smoothstep(0.3,0.9,soft(g2*0.6)) * 0.5 + top*0.3 + gEdge*0.3;
    vec3 c = col*(0.86 + grain*0.06 + streak*0.08 + (pid-0.5)*0.1)*(1.0 - gap*0.5)*(1.0 - knot*0.4)*(1.0 - underShadow*0.16);
    c = mix(c, vec3(0.46,0.45,0.43)*dot(c,vec3(0.45)), weather*0.45);
    c = mix(c, vec3(0.2,0.18,0.17), nail*0.8);
    hgt = grain*0.08 + streak*0.2 + lap*0.55 - gap - knot*0.3; bumpK = 0.012; rough = 0.82 - gEdge*0.12;

  } else if(pat==17){ // water
    vec2 q = pxz;
    hgt = sin(q.x*0.8+q.y*0.3+uTime*0.6)*0.4 + sin(q.y*0.7-uTime*0.5)*0.4 + vnoise(q*3.0+uTime*0.3)*0.2;
    bumpK = 0.006; rough = 0.15; refl = 0.75; wet = 1.0;
    return col*0.35;
  } else if(pat==18){ // wallpaper: printed motif, stripes, water stains, peeling seams
    float stripe = smoothstep(0.45,0.55, fract(wuv.x*4.0))*LOD(4.0);
    vec2 mf = fract(wuv*vec2(4.0,6.0)) - 0.5;
    float motif = (1.0 - smoothstep(0.05, 0.08, abs(length(mf) - 0.12))) * LOD(16.0);
    float seam = seamLine(fract(wuv.x*1.9), 0.01) * LOD(3.0);

    float stain = smoothstep(0.5, 0.78, sv) * (0.6 + 0.4*vnoise(wuv*3.0));

  } else if(pat==21){ // wet organic: sclera veins, satin
    vec3 q = vLocal*3.0;
    float vein = (1.0 - smoothstep(0.0, 0.06, abs(vnoise(q.xy*2.0+q.z)-0.5))) * smoothstep(-0.2, -0.9, vLocal.z) * LOD(30.0);

    return mix(col, col*vec3(1.0,0.55,0.55), vein*0.4);
  } else if(pat==22){ // petal: veins along the length, a darker base
    float vein = (1.0 - smoothstep(0.0, 0.3, abs(sin(vUv.x*14.0 + vUv.y*1.5)))) * smoothstep(0.05,0.4,vUv.y) * LOD(60.0);
    float tip = smoothstep(0.55,1.0,vUv.y);

  } else if(pat==23){ // fabric: twill weave, soft folds, dust and fraying at the hem
    float weave = vnoise(vLocal.xy*55.0 + vLocal.z*31.0) * LOD(200.0);
    float fold = soft(vLocal.xy*4.0 + vLocal.z*2.0);
    float dust = smoothstep(0.6, 0.0, wp.y - 0.0) * 0.4 + smoothstep(0.6,0.8,soft(vLocal.xz*10.0))*0.3;
    rough = 1.0;
    hgt = weave*0.15 + fold*0.5; bumpK = 0.003;

    return mix(c, c*vec3(0.85,0.8,0.75), dust);
  } else if(pat==24){ // porcelain: bisque with a few crazing cracks and grime in them
    vec3 q = vLocal*8.0;
    float ce = cellEdge(q.xy*1.1 + q.z*0.6);
    float craze = (1.0 - smoothstep(0.0, 0.03, ce)) * smoothstep(0.45, 0.6, soft(q.xz*0.4+3.0)) * LOD(25.0);
    rough = 0.42; refl = 0.03; hgt = -craze; bumpK = 0.002;

  } else if(pat==25){ // dark soft tissue: folds and pores

    float pore = 0.0;   // (pores removed)

  } else if(pat==26){ // old photograph figure: matte, mottled emulsion that boils slowly

    return col*(0.85 + g*0.3);
  } else if(pat==19){ // marble: veins, polish worn dull where walked, chipped arrises
    vec2 m = wall ? wuv : pxz;
    float v = abs(sin((m.x+m.y*0.6 + soft(m*0.3)*3.0)*1.4));
    float vein = (1.0-smoothstep(0.0,0.12,v))*LOD(3.0);
    float fine = (1.0-smoothstep(0.0,0.05,abs(sin((m.x*1.7-m.y + soft(m*0.9)*2.0)*5.0))))*LOD(15.0);

    rough = mix(0.32, 0.6, dull + gEdge*0.5); refl = 0.08*(1.0 - dull);
    // veins are drawn relative to the stone: dark marble gets pale veins, pale marble darker ones

    float lum = dot(col, vec3(0.333));
    vec3 veinC = lum < 0.3 ? col*1.7 + 0.025 : col*0.72;
    vec3 c = col*(0.96+soft(m*0.5)*0.06);
    c = mix(c, veinC, vein*0.55);
    return mix(c, veinC, fine*0.25);
  }
  // plain / anything else: still picks up wear on its edges and grime underneath
  return mix(col, col*1.1 + 0.02, gEdge*0.3) * (1.0 - under*0.15);
}

void main(){
  if(uFade < 0.999){

  vec3 rd = V / max(dist,1e-4);
  int pat = int(vMat.x+0.5);

    for(int i=0;i<16;i++){ if(i>=uLightCount) break;
      sc += uLightCol[i].rgb * uLightCol[i].a * scatterIntegral(uCam, rd, 200.0, uLightPos[i].xyz) * exp(-length(uLightPos[i].xyz-uCam)*uFogDensity*1.1);
    }

    float hz = 1.0 - smoothstep(-0.03, 0.28, rd.y);
    c = mix(c, uFogColor, clamp(fogT*uSkyFog + hz*uHorizonFog, 0.0, 1.0));

  vec3 n = normalize(vNor);
  if(!gl_FrontFacing) n = -n;

  // texture space: world for static scenery (no tiling repeats), object space for moving things
  vec3 tp = uLocalTex == 1 ? vLocal : vRaw;
  vec3 tn = n;
  if(uLocalTex == 1){ tn = normalize(vNorL); if(!gl_FrontFacing) tn = -tn; }
  { float pwv = max(length(fwidth(tp)), 1e-5);
    float curv = length(fwidth(tn)) / pwv;
    gCurv = curv;
    // only tight bevels count as worn edges \u2014 not every smoothly curved pipe or pole
    gEdge = smoothstep(16.0, 40.0, curv) * (1.0 - smoothstep(8.0, 26.0, dist)); }
  float rough, hgt, refl, wet, bumpK;
  vec3 albedo = material(pat, vCol, tp, tn, rough, hgt, refl, wet, bumpK);
  if(uUseTex==1){ vec4 tx = texture(uTex, vec2(vUv.x, 1.0-vUv.y)); if(tx.a < 0.5) discard; albedo = tx.rgb; rough = 0.3; refl = 0.08; bumpK = 0.0; }
  if(uUseTex==2){ albedo = texture(uTex, vec2(vUv.x, vUv.y)).rgb; rough = 0.35; refl = 0.05; bumpK = 0.0; }

    float k = bumpK * 22.0 * (1.0 - smoothstep(12.0, 45.0, dist));

  bool cloud = pat==14;
  float ao = mix(0.6, 1.0, clamp(vWorld.y*0.8+0.3,0.0,1.0));
  ao = (pat==1||pat==2||pat==3||pat==8||pat==17||cloud) ? 1.0 : ao;

  // stylized diffuse: a soft, slightly wrapped terminator instead of a hard physical falloff
  float ndl = smoothstep(-0.12, 0.85, dot(n,uSunDir));

  vec3 spec = vec3(0.0);
  if(cloud){

    if(wet > 0.01){
      vec3 m = vec3(lp.x, 2.0*vWorld.y - lp.y, lp.z);
      vec3 dm = normalize(m - uCam);
      vec3 df = rd - dm;
      // a thin streak (narrow across, long towards you), broken up by the puddle's ripples and
      // absent right under your feet \u2014 the old wide lobe read as a glowing blob on the road
      float s = exp(-(df.x*df.x + df.z*df.z)*650.0 - df.y*df.y*26.0);
      float rip = 0.3 + 0.7*vnoise(vWorld.xz*vec2(2.0, 7.0) + vec2(0.0, uTime*0.2));
      float nearFade = smoothstep(2.5, 8.0, dist);
      streak += uLightCol[i].rgb * s * rip * nearFade * wet * 0.22 / (1.0 + length(m-uCam)*0.06);
    }
    scatter += uLightCol[i].rgb * uLightCol[i].a * scatterIntegral(uCam, rd, dist, lp) * exp(-length(lp-uCam)*uFogDensity*1.1);
  }

  // environment reflection with Fresnel
  float NdV = max(dot(n, -rd), 0.0);
  float F = 0.04 + 0.96*pow(1.0-NdV, 5.0);
  vec3 envR = envColor(reflect(rd, n));
  float rk = refl * mix(F, 1.0, 0.2) * (1.0 - rough*0.7);

  col += mix(uAmbSky, uFogColor, 0.5) * pow(1.0 - NdV, 3.0) * 0.1 * (cloud ? 0.0 : 1.0);

    float hz = 1.0 - exp(-max(dist - 6.0, 0.0) * uHaze * uFogScale);
    col = mix(col, envColor(rd), hz * 0.85);
