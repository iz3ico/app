<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">

<title>THE LAST TICK</title>
<style>

#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}

</style></head><body>
<div id="wrap"><canvas id="c" width="432" height="216"></canvas></div>
<div id="rotate"><span>横向きにすると大きく遊べます</span></div>
<script>
'use strict';
// ===== THE LAST TICK — core =====
const W = 432, H = 216, TAU = Math.PI * 2;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ---- fit to window ----

  if (s >= 2) { const f = Math.floor(s); if (f / s > 0.86) s = f; }
  SCALE = s;
  // backing store at device resolution: pixel art is scaled up crisply, text is drawn sharp
  const S = clamp(Math.ceil(s * (window.devicePixelRatio || 1)), 1, 8);
  if (S !== RS) { RS = S; cv.width = W * S; cv.height = H * S; ctx.imageSmoothingEnabled = false; }

  cv.style.height = Math.round(H * s) + 'px';

window.addEventListener('resize', fit);

// ---- save ----
const SAVE_KEY = 'lasttick_v1';
let SAVE = { cleared: {}, progress: {}, bgm: 6, se: 8, seen: false };

defMat('steel', ['#343846', '#727c8e', '#b2bac8', '#eef2f8'], 3);

defMat('moon', ['#86743a', '#d6c474', '#f4e8a6', '#fffce2'], 3);

// Shade a material grid into a canvas: pixel-art auto shading (light from top-left)

// rasterize a shape function fn(lx,ly)->material code into grid

// ---- sprite cache ----
const SPR = new Map();

}
function sprShadow(e) { return e._sh || (e._sh = maskCanvas(e.g, e.w, e.h, [20, 10, 6], 110, true)); }

}
function drawCanv(c, x, y, a = 1) { if (a < 1) ctx.globalAlpha = a; ctx.drawImage(c, Math.round(x), Math.round(y)); if (a < 1) ctx.globalAlpha = 1; }

// ---- fonts ----
// 5x7 pixel font (caps, digits, symbols)

  G: '0e1110171111 0f', H: '1111111f111111', I: '0e04040404040e', J: '07020202 02120c', K: '11121418141211', L: '1010101010101f',
  M: '111b1515111111', N: '11111915131111', O: '0e11111111110e', P: '1e11111e101010', Q: '0e111111151 20d', R: '1e11111e141211',
  S: '0f10100e01011e', T: '1f040404040404', U: '1111111111110e', V: '11111111110a04', W: '1111111515150a', X: '11110a040a1111',
  Y: '1111110a040404', Z: '1f01020408101f', '0': '0e11131519110e', '1': '040c040404040e', '2': '0e110102040 81f', '3': '1f020402 01110e',
  '4': '02060a121f0202', '5': '1f101e0101110e', '6': '0608101e11110e', '7': '1f010204080808', '8': '0e11110e11110e', '9': '0e11110f01020c',
  '.': '000000000000 04', ',': '00000000000408', ':': '00000400000400', '!': '04040404000004', '?': '0e110102040004', '-': '0000001f000000',
  '/': '01010204081010', '%': '18190204081303', "'": '04040800000000', '(': '02040808080402', ')': '08040202020408', '+': '0004041f040400',
  '&': '0c12140815120d', '#': '0a0a1f0a1f0a0a', '<': '02040810080402', '>': '08040201020408', '*': '00150e1f0e1500', '=': '00001f001f0000', ' ': '00000000000000',
  '·': '00000004000000'

const F57G = {};
for (const k in F57) { const s = F57[k].replace(/ /g, ''); const rows = []; for (let i = 0; i < 7; i++) rows.push(parseInt(s.substr(i * 2, 2), 16) || 0); F57G[k] = rows; }

const PFC = new Map();
// pixel text canvas: scale (1|2), color, shadow color, spacing
function ptext(str, col = '#f2dca0', sh = '#1c100a', sc = 1, sp = 1) {
  const key = str + '|' + col + '|' + sh + '|' + sc + '|' + sp; let c = PFC.get(key); if (c) return c;

// tiny 3x5 digits
const F35 = { '0': '75557', '1': '26227', '2': '71747', '3': '71717', '4': '55711', '5': '74717', '6': '74757', '7': '71122', '8': '75757', '9': '75717', 'x': '00525', '%': '41241', '/': '11244', '+': '02720', '-': '00700', ':': '02020' };

  str = String(str); c = mkCanvas(str.length * 4 + 1, 7); const x = c.getContext('2d');

// Japanese text: system font, hard-thresholded to pixels
const JFONT = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif';
const JTC = new Map();
const _jm = mkCanvas(8, 8).getContext('2d');

function jtext(str, col, sh, size, ts) {

// wrap Japanese into lines of max width
const NOSTART = '、。」』）！？ー…・ぁぃぅぇぉっゃゅょァィゥェォッャュョ';
function jwrap(str, maxW, size = 10) {

// big shaded title text (serif), rendered as a material sprite
const BIGC = new Map();

// ===== parts: procedural pixel shapes =====
const KIND = {};
function defKind(id, o) { o.id = id; o.z = o.z == null ? 4 : o.z; o.key = id; KIND[id] = o; return o; }

// polar helpers
function polar(x, y) { return [Math.hypot(x, y), Math.atan2(y, x)]; }
function ph(a, n) { let p = (a / TAU) * n % 1; if (p < 0) p += 1; return p; }
function segDist(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, l = dx * dx + dy * dy; let t = l ? ((px - x1) * dx + (py - y1) * dy) / l : 0; t = clamp(t, 0, 1);
  return Math.hypot(px - x1 - dx * t, py - y1 - dy * t);
}

// gear: r outer radius, n teeth, spokes, material, opts
function gearFn(o) {
  const r = o.r, n = o.n, root = r - (o.th || 2), rim = o.rim || 2, mat = o.mat, mat2 = o.mat2 || mat + 1;
  const sp = o.spokes || 0, hub = o.hub || 3, curve = o.curve || 0;
  return (x, y) => {
    const d = Math.hypot(x, y); if (d > r + 0.35) return 0;
    const a = Math.atan2(y, x);
    if (d > root) {
      const p = ph(a, n), t = (d - root) / (r - root);
      if (o.club) return (p > 0.12 + t * 0.32 && p < 0.62 - t * 0.12) ? mat : 0;
      if (o.ratchet) return (p < 0.7 - t * 0.55) ? mat : 0;
      return Math.abs(p - 0.5) < 0.30 - 0.12 * t ? mat : 0;
    }
    if (d < 1.2) return o.jewel ? M.ruby : M.steel2;
    if (o.sqhole && Math.abs(x) < 2 && Math.abs(y) < 2) return 0;
    if (d < hub) return mat2;
    if (d > root - rim) return mat;
    if (sp) {
      const inner = root - rim;
      for (let k = 0; k < sp; k++) {
        const sa = k / sp * TAU + (curve ? curve * (d / inner) : 0);
        const c = Math.cos(sa), s = Math.sin(sa);
        if (x * c + y * s > 0 && Math.abs(-x * s + y * c) < (o.sw || 1.15)) return mat;
      }
      return 0;
    }
    if (o.holes) { // round lightening holes
      const hr = (hub + root - rim) / 2, rr = (root - rim - hub) * 0.32;
      for (let k = 0; k < o.holes; k++) { const sa = k / o.holes * TAU + 0.4; if (Math.hypot(x - Math.cos(sa) * hr, y - Math.sin(sa) * hr) < rr) return 0; }
    }
    if (d > root - rim - 1) return mat | FD;
    return mat;
  };
}

// hands
function handFn(L, ringAt, ringR, w) {
  return (x, y) => {
    if (Math.hypot(x, y) < 2.4) return Math.hypot(x, y) < 1 ? M.steel2 : M.blue;
    if (y > 0) { if (y < 5 && Math.abs(x) < 0.8) return M.blue; if (Math.hypot(x, y - 5) < 1.7) return M.blue; return 0; }
    const yy = -y; if (yy > L) return 0;
    const rd = Math.hypot(x, y + ringAt);
    if (rd < ringR) return rd < ringR - 1.4 ? 0 : M.blue;
    const tw = yy > ringAt ? w * (1 - (yy - ringAt) / (L - ringAt)) + 0.45 : w;
    return Math.abs(x) < tw ? M.blue : 0;
  };
}

// dial ring (skeleton chapter ring). unrotated: XII at top
function dialFn(mat, tick, rev) {
  return (x, y) => {
    const d = Math.hypot(x, y); if (d > 63.6 || d < 53.4) return 0;
    if (d > 62.4 || d < 54.6) return M.gold;
    let a = Math.atan2(x, -y); if (a < 0) a += TAU; // 0 at top, clockwise
    const hr = a / TAU * 12, hi = Math.round(hr) % 12, dh = Math.abs(hr - Math.round(hr)) * (TAU / 12) * d;
    if (hi === 0) {
      if (d > 56.6 && d < 61.6 && (Math.abs(dh - 1.7) < 0.75)) return M.ruby;
      if (d < 56.6 && d > 55.2 && dh < 2.2) return M.ruby;
    } else if (d > 56.2 && d < 61.4) {
      if (hi % 3 === 0 ? dh < 1.25 : dh < 0.62) return tick;
    }
    const mi = a / TAU * 60, dm = Math.abs(mi - Math.round(mi)) * (TAU / 60) * d;
    if (d > 60.8 && d < 61.8 && dm < 0.55 && Math.round(mi) % 5) return tick;
    if (rev && d > 55 && d < 56.4 && hi === 11 && dh < 3) return M.ruby;
    return mat;
  };
}

function cylFn(phase) {
  return (x, y) => {
    if (Math.abs(y) > 5 || Math.abs(x) > 15) return 0;
    if (Math.abs(x) > 13) return Math.abs(y) < 2 ? M.steel : (Math.abs(x) > 14 ? 0 : M.brass2);
    if (Math.abs(y) > 4.2) return M.brass2;
    const yy = Math.round(y) + phase, xx = Math.round(x);
    if (hash(xx + 40, ((yy % 9) + 9) % 9) < 0.16 && Math.abs(y) < 3.8) return M.steel2;
    return M.brass;
  };
}

// bridges (dynamic per stage). spec: {segs:[[x1,y1,x2,y2,w]], discs:[[x,y,r]], jewels:[[x,y]], screws:[[x,y]], mat, stripes}
function bridgeFn(sp) {
  const mat = sp.mat || M.steel;
  return (x, y) => {
    for (const [jx, jy] of (sp.jewels || [])) { const d = Math.hypot(x - jx, y - jy); if (d < 3.2) return d < 0.9 ? M.steel2 : d < 2 ? M.ruby : M.gold; }
    for (const [sx, sy] of (sp.screws || [])) { const d = Math.hypot(x - sx, y - sy); if (d < 2.6) return M.dark; }
    let inside = false;
    for (const s of (sp.segs || [])) if (segDist(x, y, s[0], s[1], s[2], s[3]) < s[4]) { inside = true; break; }
    if (!inside) for (const s of (sp.discs || [])) if (Math.hypot(x - s[0], y - s[1]) < s[2]) { inside = true; break; }
    if (!inside) return 0;
    if (sp.stripes) { const v = Math.floor((x * 0.7 + y * 0.7 + 200) / 3.2) & 1; return v ? mat : (mat | FL); }

}
function bridgeR(sp) { let r = 4; for (const s of sp.segs || []) r = Math.max(r, Math.hypot(s[0], s[1]) + s[4], Math.hypot(s[2], s[3]) + s[4]); for (const s of sp.discs || []) r = Math.max(r, Math.hypot(s[0], s[1]) + s[2]); for (const j of (sp.jewels || []).concat(sp.screws || [])) r = Math.max(r, Math.hypot(j[0], j[1]) + 3.5); return Math.ceil(r); }

const D2R = Math.PI / 180;
const pr = k => KIND[k].pr || (KIND[k].R - 1.5);
function Builder() {
  const L = [];
  const api = {
    L,
    get: id => L.find(s => s.id === id),
    add(id, kind, x, y, o = {}) { const s = Object.assign({ id, kind, x, y, rot: 0, req: [] }, o); L.push(s); return s; },
    mesh(id, kind, from, deg, o = {}) {
      const f = api.get(from), d = pr(f.kind) + pr(kind) + (o.gap || 0);
      return api.add(id, kind, f.x + Math.cos(deg * D2R) * d, f.y + Math.sin(deg * D2R) * d, Object.assign({ mesh: from }, o));
    },
    on(id, kind, base, o = {}) { const f = api.get(base); return api.add(id, kind, f.x, f.y, Object.assign({ on: base }, o)); },
    // bridge from absolute points
    bridge(id, o) {
      const pts = [].concat(o.jewels || [], o.screws || []).map(p => typeof p === 'string' ? api.get(p) : { x: p[0], y: p[1] });
      let cx = o.cx, cy = o.cy;
      if (cx == null) { cx = pts.reduce((a, p) => a + p.x, 0) / pts.length; cy = pts.reduce((a, p) => a + p.y, 0) / pts.length; }
      const loc = p => { const q = typeof p === 'string' ? api.get(p) : { x: p[0], y: p[1] }; return [q.x - cx, q.y - cy]; };
      const sp = { jewels: (o.jewels || []).map(loc), screws: (o.screws || []).map(loc), segs: [], discs: [], mat: o.mat, stripes: o.stripes, engrave: o.engrave };
      for (const s of o.segs || []) { const a = loc(s[0]), b = loc(s[1]); sp.segs.push([a[0], a[1], b[0], b[1], s[2]]); }
      for (const d of o.discs || []) { const a = loc(d[0]); sp.discs.push([a[0], a[1], d[1]]); }
      const kid = 'br_' + id + '_' + (o.stage || 0);
      defKind(kid, { name: o.name || '受け', desc: o.desc || '歯車の軸を上から支える板。宝石の穴を軸に合わせる。', R: bridgeR(sp), z: o.z || 9, oriented: 1, fn: bridgeFn(sp), bridge: 1 });

const AUDIO = {
  ac: null, ok: false, duck: 1,
  init() {

    this.bgm.connect(this.duckG); this.duckG.connect(this.master); this.se_.connect(this.master);

    this.revB = ac.createGain(); this.revB.gain.value = 0.9; this.revB.connect(this.rev);
    this.revS = ac.createGain(); this.revS.gain.value = 0.35; this.revS.connect(this.rev);
    this.bgm.connect(this.revB); this.se_.connect(this.revS);
    const nb = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), nd = nb.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1; this.noiseB = nb;
    this.setVol(); this.ok = true;
    if (ac.state === 'suspended') ac.resume();
    this.startBGM();
  },
  setVol() { if (!this.ok && !this.ac) return; const b = SAVE.bgm / 10, s = SAVE.se / 10; this.bgm.gain.value = b * b * 0.55; this.se_.gain.value = s * s * 0.9; },
  t() { return this.ac.currentTime; },
  env(g, t, a, peak, dec) { g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec); },
  osc(type, f, t, dur, peak, dest, a = 0.004, detune = 0) {

    this.env(g, t, a, peak, dur); o.connect(g); g.connect(dest); o.start(t); o.stop(t + a + dur + 0.05); return o;
  },
  noise(t, dur, peak, dest, type = 'bandpass', f = 3000, q = 1) {
    const ac = this.ac, s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = this.noiseB; fl.type = type; fl.frequency.value = f; fl.Q.value = q; this.env(g, t, 0.001, peak, dur);
    s.connect(fl); fl.connect(g); g.connect(dest); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  },
  // instruments
  mbox(t, m, v, dest) { const f = mtof(m); this.osc('sine', f, t, 1.6, v, dest, 0.002); this.osc('sine', f * 2.01, t, 0.5, v * 0.28, dest, 0.002); this.osc('sine', f * 4.2, t, 0.12, v * 0.12, dest, 0.001); },
  celesta(t, m, v, dest) { const f = mtof(m); this.osc('sine', f, t, 1.1, v, dest, 0.003); this.osc('triangle', f * 4, t, 0.25, v * 0.15, dest, 0.002); },
  piano(t, m, v, dest, dur = 1.6) {
    const ac = this.ac, f = mtof(m), fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.setValueAtTime(Math.min(5000, f * 6), t); fl.frequency.exponentialRampToValueAtTime(Math.max(300, f * 1.5), t + dur); fl.connect(dest);

  },
  pad(t, ms, dur, v, dest) {

  },
  // ---- BGM: "THE CLOCKMAKER'S ROOM" (F major waltz) ----
  CH: [[41, [57, 60, 64, 65]], [38, [57, 60, 62, 65]], [34, [57, 62, 65, 58]], [36, [58, 60, 64, 67]], [33, [57, 60, 64, 67]], [38, [57, 60, 62, 65]], [31, [58, 62, 65, 67]], [36, [58, 60, 64, 67]],
  [41, [57, 60, 64, 65]], [33, [57, 60, 64, 67]], [38, [57, 60, 62, 65]], [34, [57, 62, 65, 58]], [31, [58, 62, 65, 67]], [36, [58, 60, 64, 67]], [41, [57, 60, 64, 65]], [36, [58, 60, 65, 67]]],
  MEL: [[[69, 2], [72, 1]], [[77, 2], [76, 1]], [[74, 2], [72, 1]], [[70, 1], [69, 1], [67, 1]], [[69, 2], [76, 1]], [[74, 2], [72, 1]], [[70, 1], [74, 1], [77, 1]], [[76, 3]],
  [[81, 2], [79, 1]], [[76, 2], [72, 1]], [[74, 1], [77, 1], [81, 1]], [[79, 2], [77, 1]], [[74, 2], [70, 1]], [[72, 1], [76, 1], [79, 1]], [[77, 3]], [[0, 1], [67, 1], [70, 1]]],

  playBar(t, i, loop) {

        x.fillStyle = 'rgba(255,255,255,0.45)'; for (let j = 6; j < 40; j++) { const k = j < 20 ? Math.round(20 - 18 * Math.sqrt(1 - Math.pow((j - 20) / 20, 2))) + 3 : 5; x.fillRect(k, j, 1, 1); }
        x.fillStyle = 'rgba(255,255,255,0.7)'; x.fillRect(14, 3, 4, 1); x.fillRect(12, 4, 2, 1);
      }), c.x - 20, c.y - 18);
    }
    for (const b of this.btns) b.draw();
    if (!n) jdraw('修理した時計が、ここに飾られます。', 216, 192, COL.creamD, COL.ink, 10, 'c');
    ctx.drawImage(vignette(W, H, 0.4), 0, 0);
    if (this.zoom) this.drawZoom();
  },
  drawZoom() {
    const { i, v } = this.zoom, st = STAGES[i];
    shade(0.78);
    ctx.drawImage(glowOverlay(W, H, 112, 110, 110, [255, 210, 140], 0.12, 5), 0, 0);
    v.draw(112, 114);
    ctx.drawImage(framePanel(196, 204, { paper: 1 }), 230, 6);
    pdraw(st.name, 328, 14, '#6a3a14', null, 1, 'c');
    jdraw(st.jp, 328, 24, COL.paperInk, null, 10, 'c');
    ctx.fillStyle = '#b8a070'; ctx.fillRect(244, 37, 168, 1);
    const rows = [['製造年代', st.era], ['素材', st.mat], ['機構', st.mech], ['修理状態', '修理済み（' + String(SAVE.cleared[i]).replace(/-/g, '.') + '）']];
    let y = 42; for (const [a, b] of rows) { jdraw(a, 240, y, '#8a4a20', null, 10); const nn = jpara(b, 290, y, 128, COL.paperInk, null, 10, 12); y += nn * 12 + 1; }
    ctx.fillStyle = '#b8a070'; ctx.fillRect(244, y + 2, 168, 1);
    jpara(st.story, 240, y + 6, 178, COL.paperInkL, null, 10, 12);
    jdraw('◀ ▶ で切りかえ・タップで閉じる', 328, 197, '#9a7a50', null, 10, 'c');
  },
  step(d) { if (!this.zoom) return; const ids = STAGES.map((s, i) => i).filter(i => SAVE.cleared[i]); const k = ids.indexOf(this.zoom.i); this.open(ids[(k + d + ids.length) % ids.length]); },
  down(p) {
    if (this.zoom) { if (p.x > 230) { if (p.y > 180) { if (p.x < 300) this.step(-1); else if (p.x > 356) this.step(1); else this.zoom = null; } else this.zoom = null; } else this.zoom = null; return; }
    for (const b of this.btns) if (b.hit(p)) { b.down = true; return; }
    for (let i = 0; i < STAGES.length; i++) { const c = this.cell(i); if (Math.abs(p.x - c.x) < 22 && p.y > c.y - 18 && p.y < c.y + 46 && SAVE.cleared[i]) { this.open(i); return; } }
  },
  move(p) { for (const b of this.btns) b.hover = b.hit(p); },
  up(p) { for (const b of this.btns) { if (b.down && b.hit(p)) { AUDIO.se('select'); b.cb(); } b.down = false; } },
  key(e) { if (e.key === 'Escape') { if (this.zoom) this.zoom = null; else go(Title); } if (e.key === 'ArrowRight') this.step(1); if (e.key === 'ArrowLeft') this.step(-1); }
};

const Settings = {
  enter() {
    this.confirm = 0;
    const mk = (y, key) => [new Btn(214, y, 16, 13, { icon: 'minus', cb: () => { SAVE[key] = clamp(SAVE[key] - 1, 0, 10); save(); AUDIO.setVol(); if (key === 'se') AUDIO.se('click'); } }), new Btn(318, y, 16, 13, { icon: 'plus', cb: () => { SAVE[key] = clamp(SAVE[key] + 1, 0, 10); save(); AUDIO.setVol(); if (key === 'se') AUDIO.se('click'); } })];
    this.btns = [...mk(52, 'bgm'), ...mk(72, 'se'),
      new Btn(158, 182, 116, 16, { jp: 'もどる', cb: () => go(Title) }),
      new Btn(214, 96, 120, 15, { jp: 'セーブデータを消去', cb: () => { if (this.confirm) { SAVE.cleared = {}; SAVE.progress = {}; save(); this.confirm = 0; this.erased = 2; } else this.confirm = 1; } })];
  },
  update(dt) { if (this.erased) this.erased = Math.max(0, this.erased - dt); },
  draw() {
    ctx.drawImage(wallBG(), 0, 0);
    ctx.drawImage(framePanel(300, 196), 66, 10);
    ctx.drawImage(nameplate('SETTINGS', 70), 181, 14);
    const bar = (y, v) => { ctx.fillStyle = COL.ink; ctx.fillRect(235, y + 2, 78, 9); for (let i = 0; i < 10; i++) { ctx.fillStyle = i < v ? (i < 7 ? '#d6a446' : '#f0c860') : '#2a1a10'; ctx.fillRect(236 + i * 7 + 1, y + 3, 5, 7); } };
    jdraw('BGM 音量', 92, 53, COL.cream, COL.ink, 10); bar(52, SAVE.bgm); pdraw(String(SAVE.bgm), 346, 55, COL.gold, COL.ink);
    jdraw('効果音 音量', 92, 73, COL.cream, COL.ink, 10); bar(72, SAVE.se); pdraw(String(SAVE.se), 346, 75, COL.gold, COL.ink);
    jdraw('データ', 92, 98, COL.cream, COL.ink, 10);
    this.btns[5].jp = this.confirm ? 'もう一度押すと消去' : this.erased ? '消去しました' : 'セーブデータを消去';
    ctx.fillStyle = '#6a4220'; ctx.fillRect(82, 118, 268, 1);
    jdraw('操作', 92, 124, COL.gold, COL.ink, 10);
    jpara('部品をドラッグして図面の位置へ。部品を選んでから場所をタップしてもOK。', 130, 124, 222, COL.creamD, COL.ink, 10, 12);
    jpara('回転：INFO の回転ボタン　ヒント：H　メニュー：Esc', 130, 150, 222, COL.creamD, COL.ink, 10, 12);
    for (const b of this.btns) b.draw();
  },
  down(p) { for (const b of this.btns) if (b.hit(p)) { b.down = true; return; } },
  move(p) { for (const b of this.btns) b.hover = b.hit(p); },
  up(p) { for (const b of this.btns) { if (b.down && b.hit(p)) { if (b !== this.btns[5]) this.confirm = 0; AUDIO.se('select'); b.cb(); } b.down = false; } },
  key(e) { if (e.key === 'Escape') go(Title); }
};

    const sub = '最後の一秒を、もう一度。', sw = jwidth(sub, 10);
    jdraw(sub, 316, 97, '#f2dca0', '#1c100a', 10, 'c');
    ctx.fillStyle = '#c8945a'; ctx.fillRect(Math.round(316 - sw / 2 - 16), 102, 10, 2); ctx.fillRect(Math.round(316 + sw / 2 + 6), 102, 10, 2);
    pdraw('START', 330, 136, '#f6e2a8', '#1c100a', 1, 'c', 2);
    ctx.fillStyle = '#1c100a'; for (let k = 0; k < 4; k++) ctx.fillRect(305 + k, 137 + k, 1, 7 - k * 2);
    ctx.fillStyle = '#f6e2a8'; for (let k = 0; k < 4; k++) ctx.fillRect(304 + k, 136 + k, 1, 7 - k * 2);
    pdraw('COLLECTION', 324, 162, '#e8d2a0', '#1c100a', 1, 'c');
    pdraw('SETTINGS', 324, 184, '#e8d2a0', '#1c100a', 1, 'c');
    this.btns.forEach((b, i) => {
      if (!(b.hover || this.sel === i)) return;
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.3 + 0.1 * Math.sin(this.t * 6);
      ctx.fillStyle = '#c08a40'; ctx.fillRect(b.x + 4, b.y + 4, b.w - 8, b.h - 8);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#ffe9a8'; ctx.fillRect(b.x + 4, b.y + 3, b.w - 8, 1); ctx.fillRect(b.x + 4, b.y + b.h - 4, b.w - 8, 1);
      drawGearCursor(b.x - (i ? 8 : 12), b.y + b.h / 2);
    });
  },
  down(p) { for (const b of this.btns) if (b.hit(p)) b.down = true; },
  move(p) { for (const b of this.btns) b.hover = b.hit(p); if (this.btns.some(b => b.hover)) this.sel = -1; },
  up(p) { for (const b of this.btns) { if (b.down && b.hit(p)) { AUDIO.se('select'); b.cb(); } b.down = false; } },
  key(e) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { this.sel = this.sel < 0 ? 0 : (this.sel + (e.key === 'ArrowDown' ? 1 : -1) + 3) % 3; AUDIO.se('select'); }
    if (e.key === 'Enter' || e.key === ' ') { (this.btns[this.sel] || this.btns[0]).cb(); AUDIO.se('select'); }
  }
};

// ===== main loop, scenes, input =====
let NOW = 0, SCENE = null, NEXT = null, FADE = 0, FADE_DIR = 0;
function go(scene, arg) { if (NEXT) return; NEXT = [scene, arg]; FADE_DIR = 1; }
function toGame(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H, touch: e.pointerType === 'touch' || e.pointerType === 'pen' }; }
let firstGesture = true;
function gesture() { AUDIO.init(); if (firstGesture) { firstGesture = false; } }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); gesture(); try { cv.setPointerCapture(e.pointerId); } catch (_) { }
  if (FADE_DIR) return; const p = toGame(e);
  if (e.button === 2) return;
  SCENE.down && SCENE.down(p);
});
cv.addEventListener('pointermove', e => { const p = toGame(e); SCENE && SCENE.move && SCENE.move(p); });
cv.addEventListener('pointerup', e => { if (e.button === 2) return; const p = toGame(e); if (!FADE_DIR) SCENE.up && SCENE.up(p); });
cv.addEventListener('pointercancel', e => { const p = toGame(e); SCENE.up && SCENE.up({ x: -99, y: -99 }); });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('wheel', e => e.preventDefault(), { passive: false });
window.addEventListener('keydown', e => { gesture(); if (!FADE_DIR && SCENE.key) SCENE.key(e); if (['ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault(); });
document.addEventListener('visibilitychange', () => { if (!AUDIO.ac) return; if (document.hidden) AUDIO.ac.suspend(); else AUDIO.ac.resume(); });

let last = performance.now();
function frame(t) {
  let dt = Math.min(0.05, (t - last) / 1000); last = t; NOW += dt;
  if (FADE_DIR > 0) { FADE += dt * 4; if (FADE >= 1) { FADE = 1; PARTS.length = 0; SCENE = NEXT[0]; SCENE.enter(NEXT[1]); NEXT = null; FADE_DIR = -1; AUDIO.se('page'); } }
  else if (FADE_DIR < 0) { FADE -= dt * 4; if (FADE <= 0) { FADE = 0; FADE_DIR = 0; } }
  SCENE.update(dt);
  ctx.setTransform(RS, 0, 0, RS, 0, 0); ctx.imageSmoothingEnabled = false;
  SCENE.draw();
  if (FADE > 0) ditherFill(FADE);
  requestAnimationFrame(frame);
}
fit();
SCENE = Title; Title.enter();
requestAnimationFrame(frame);
// dev hooks


</script></body></html>
