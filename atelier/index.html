<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ひだまりのアトリエ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f2e8; --paper2:#efe6d6; --ink:#3a3029; --ink2:#6b5a4c; --muted:#8f7f70;
  --wood:#8a6747; --woodD:#5e4430; --sage:#7f8f78; --rust:#a8664c; --line:rgba(90,70,50,.18);
  --shadow:0 18px 50px rgba(40,25,10,.28),0 2px 8px rgba(40,25,10,.12);
  --serif:"Cormorant Garamond",Georgia,serif; --sans:"Zen Kaku Gothic New",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1d1712;color:var(--ink);font-family:var(--sans);-webkit-user-select:none;user-select:none;touch-action:none}
button{font-family:inherit;font-size:13px;color:var(--ink);background:#fffaf1;border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;transition:background .15s,transform .1s,box-shadow .15s}
button:hover{background:#fff;box-shadow:0 2px 8px rgba(60,40,20,.12)}
button:active{transform:translateY(1px)}
button.primary{background:var(--woodD);color:#fbf4e6;border-color:var(--woodD)}
button.primary:hover{background:#6e5038}
button.danger{color:#8a3a2a;border-color:rgba(138,58,42,.35)}
button:disabled{opacity:.5;cursor:default}
.hidden{display:none!important}
.muted{color:var(--muted)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;background:linear-gradient(90deg,#c9b49a,#8a6747);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fffaf1;border:2px solid var(--woodD);cursor:pointer}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fffaf1;border:2px solid var(--woodD);cursor:pointer}
input[type=text]{font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fffdf8;width:100%;color:var(--ink);-webkit-user-select:text;user-select:text}
kbd{display:inline-block;min-width:20px;padding:1px 6px;margin-right:6px;border-radius:5px;background:#fffaf1;color:var(--ink);font:600 11px/18px var(--sans);text-align:center;box-shadow:0 1px 0 rgba(0,0,0,.25)}

#game{position:fixed;inset:0;width:100%;height:100%;display:block}
/* ---------- タイトル ---------- */
#title{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 35%,rgba(247,242,232,.55),rgba(60,40,25,.75)),linear-gradient(180deg,rgba(40,28,18,.2),rgba(30,20,12,.7));backdrop-filter:blur(3px)}
.tcard{width:min(560px,92vw);background:var(--paper);border-radius:22px;box-shadow:var(--shadow);padding:42px 40px 30px;text-align:center;position:relative;overflow:hidden}
.tcard:before{content:"";position:absolute;inset:10px;border:1px solid var(--line);border-radius:16px;pointer-events:none}
.tcard h1{font:700 44px/1.2 "Zen Old Mincho",var(--serif);letter-spacing:.16em;margin:6px 0 6px;color:var(--woodD)}
.tcard .sub{font:500 15px "Zen Old Mincho",var(--serif);letter-spacing:.12em;color:var(--ink2);margin:0 0 22px}
.tcard p{font-size:13.5px;line-height:1.8;color:var(--ink2);margin:0 0 18px}
.arch{width:64px;height:84px;margin:0 auto 8px;border:2px solid var(--wood);border-radius:32px 32px 4px 4px;position:relative;background:linear-gradient(#e6eef0,#f6efe0)}
.arch:before,.arch:after{content:"";position:absolute;background:var(--wood)}
.arch:before{left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%)}
.arch:after{left:0;right:0;top:44px;height:2px}
#titleStart{font-size:15px;padding:12px 34px;margin:4px 0 18px}
.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 18px;text-align:left;font-size:12px;color:var(--ink2);border-top:1px solid var(--line);padding-top:16px}
.controls span{white-space:nowrap}
#loadWrap{height:3px;background:var(--paper2);border-radius:3px;overflow:hidden;margin:0 0 6px}
#loadBar{height:100%;width:0;background:var(--wood);transition:width .3s}
#loadMsg{font-size:12px;color:var(--muted);min-height:16px;margin-bottom:10px}
#loadWrap.done{opacity:0}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,250,240,.75);box-shadow:0 0 0 1px rgba(40,30,20,.35);transition:all .15s}
#cross.on{width:14px;height:14px;margin:-7px 0 0 -7px;background:transparent;border:2px solid rgba(255,250,240,.9)}
#prompt{position:absolute;left:50%;bottom:13%;transform:translate(-50%,8px);opacity:0;transition:all .2s;display:flex;gap:14px;align-items:center;
  background:rgba(40,30,22,.55);color:#fbf4e6;padding:8px 16px;border-radius:999px;font-size:13px;backdrop-filter:blur(6px);white-space:nowrap}
#prompt.show{opacity:1;transform:translate(-50%,0)}
#prompt b{font-weight:500;opacity:.8;padding-right:4px;border-right:1px solid rgba(255,255,255,.25);margin-right:2px}
#prompt span{display:inline-flex;align-items:center}
#hudTime{position:absolute;left:18px;top:16px;font:500 15px var(--serif);letter-spacing:.08em;color:#fbf4e6;background:rgba(40,30,22,.35);padding:4px 12px;border-radius:999px;backdrop-filter:blur(4px)}
#clickHint{position:absolute;left:50%;top:58%;transform:translateX(-50%);pointer-events:auto;background:rgba(40,30,22,.6);color:#fbf4e6;border:none}
#toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-20px);opacity:0;transition:all .3s;z-index:90;background:var(--paper);color:var(--ink);padding:9px 18px;border-radius:999px;box-shadow:var(--shadow);font-size:13px;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* ---------- タッチ ---------- */
#touchLayer{position:fixed;inset:0;z-index:5;pointer-events:none}
body.touch #touchLayer{pointer-events:auto}
#touchUI{position:fixed;inset:0;z-index:12;pointer-events:none}
#stick{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,250,240,.35);background:rgba(40,30,22,.15);opacity:0;transition:opacity .2s}
#stick.on{opacity:1}
#stickKnob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,250,240,.6)}
.tbtns{position:absolute;right:18px;bottom:24px;display:flex;flex-direction:column;gap:10px;pointer-events:auto}
.tbtns button{width:58px;height:58px;border-radius:50%;padding:0;font-size:15px;background:rgba(255,250,240,.82)}
#tMenu{position:absolute;right:16px;top:14px;pointer-events:auto;background:rgba(255,250,240,.8)}
/* ---------- パネル ---------- */
#panelWrap{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(30,20,12,.35);backdrop-filter:blur(2px)}
.panel{width:min(560px,94vw);max-height:90vh;overflow:auto;background:var(--paper);border-radius:20px;box-shadow:var(--shadow);padding:26px 28px 22px}
.panel.wide{width:min(920px,95vw)}
.panel h2{font:600 26px var(--serif);letter-spacing:.06em;color:var(--woodD);margin:0 0 6px}
.panel h3{font:600 15px var(--sans);margin:18px 0 8px;color:var(--ink2)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.row.end{justify-content:flex-end}.row.between{justify-content:space-between}
.seg{display:inline-flex;background:var(--paper2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;padding:6px 14px}
.seg button.on{background:#fffaf1;box-shadow:0 1px 4px rgba(60,40,20,.15)}
.set{display:grid;grid-template-columns:110px 1fr 56px;align-items:center;gap:10px;margin:10px 0;font-size:13px}
.set .v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.pz-menu{display:flex;flex-direction:column;gap:8px;margin:14px 0 4px}
.pz-menu button{border-radius:12px;text-align:left;padding:11px 16px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:14px}
.card{background:#fffdf8;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#eee5d5}
.card .meta{padding:8px 12px 4px}.card .meta b{display:block;font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta small{color:var(--muted);font-size:11px}
.card .acts{display:flex;flex-wrap:wrap;gap:5px;padding:6px 10px 10px}
.card .acts button{padding:5px 10px;font-size:12px}
.easelpick{display:flex;gap:14px;align-items:center;margin-top:12px;padding:12px;border-radius:14px;background:#fffdf8;border:1px solid var(--line)}
.easelpick img{width:160px;aspect-ratio:4/3;object-fit:cover;border-radius:8px;flex:none}
.easelpick b{display:block;font-weight:500}.easelpick small{color:var(--muted);font-size:12px}
.easelpick .row{margin-top:8px}
@media (max-width:600px){.easelpick{flex-direction:column;align-items:stretch}.easelpick img{width:100%}}
.empty{text-align:center;color:var(--muted);padding:40px 0;line-height:1.9;grid-column:1/-1}
.supplies{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.supply{border-radius:14px;text-align:left;padding:14px;display:grid;grid-template-columns:42px 1fr;gap:2px 10px;align-items:start;white-space:normal}
.supply .sicon{grid-row:span 2;width:42px;height:42px}
.supply b{font-size:15px;font-weight:600}.supply small{color:var(--ink2);font-size:12px;line-height:1.6}
.shelf{display:flex;gap:14px;justify-content:center;padding:26px 0 14px;border-bottom:8px solid var(--woodD);margin-top:10px}
.bookbtn{width:64px;height:200px;border-radius:4px;background:var(--bc);color:#f5ead6;writing-mode:vertical-rl;font:600 16px var(--serif);letter-spacing:.2em;border:none;box-shadow:inset -6px 0 0 rgba(0,0,0,.18),inset 0 18px 0 rgba(255,230,180,.12),0 4px 10px rgba(0,0,0,.2)}
.bookbtn:hover{background:var(--bc);transform:translateY(-6px)}
.bookpanel{background:#f3ead8}
.bookpage{min-height:240px;padding:20px 26px;background:#fbf6ea;border-radius:6px;box-shadow:inset 0 0 30px rgba(140,110,70,.12)}
.bookpage small{font:italic 14px var(--serif);color:var(--muted)}
.bookpage h3{font:600 22px var(--serif);color:var(--woodD);margin:8px 0 12px}
.bookpage p{font-size:14.5px;line-height:2;color:var(--ink)}
.booknav{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--muted);font-size:13px}
.help-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px;font-size:13px;line-height:1.9}
/* ---------- ダイアログ ---------- */
#dialogWrap{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(30,20,12,.4)}
#dialog{width:min(420px,92vw);background:var(--paper);border-radius:18px;box-shadow:var(--shadow);padding:22px 24px 18px}
#dialog h3{font:600 22px var(--serif);margin:0 0 10px;color:var(--woodD)}
#dialog p{font-size:14px;line-height:1.8;margin:0 0 10px}
#dlgBtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:14px}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.paper-choice{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 10px}
.paper-choice label{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fffdf8;cursor:pointer}
.pc{width:26px;height:20px;border-radius:3px;border:1px solid var(--line)}
.pc-sketch{background:#f7f3e9}.pc-watercolor{background:#f9f6ee;background-image:radial-gradient(#e6dfcf 1px,transparent 1.5px);background-size:5px 5px}
.pc-canvas{background:#efe8da;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 3px)}
.pc-pastel{background:#e8e1d2}
/* ---------- 描画画面 ---------- */
#paint{position:fixed;inset:0;z-index:40;display:grid;grid-template-columns:74px 1fr 250px;grid-template-rows:56px 1fr;
  background:linear-gradient(180deg,#e9dfcd,#dccdb4);}
.p-top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 14px;background:#f8f2e6;border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(60,40,20,.06);z-index:2}
.p-title{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;overflow:hidden}
.p-title span{font:600 20px var(--serif);letter-spacing:.04em;color:var(--woodD);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-title small{font-size:11.5px;color:var(--muted);white-space:nowrap}
.p-actions{display:flex;gap:6px}
.p-actions button,.p-top>button{padding:7px 13px}
.p-tools{background:linear-gradient(90deg,#7a5a3e,#8c6a4b);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;box-shadow:inset -4px 0 10px rgba(0,0,0,.15);overflow-y:auto}
.p-tool{width:56px;height:56px;border-radius:14px;padding:4px 0 0;background:rgba(255,250,240,.12);border:1px solid transparent;color:#f5ead6;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px}
.p-tool .ic{width:28px;height:28px}
.p-tool:hover{background:rgba(255,250,240,.24);box-shadow:none}
.p-tool.on{background:#f8f2e6;color:var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.25)}
.p-sep{width:40px;height:1px;background:rgba(255,250,240,.25);margin:4px 0}
.p-tools .small{width:56px;height:36px;border-radius:10px;padding:0;background:rgba(255,250,240,.12);color:#f5ead6;border:none;font-size:18px}
.p-stage{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#d9ccb6,#bfae92)}
#pView{position:absolute;inset:0;touch-action:none}
#pCursor{position:absolute;left:0;top:0;border-radius:50%;border:1px solid rgba(40,30,20,.75);box-shadow:0 0 0 1px rgba(255,255,255,.7);pointer-events:none;display:none}
.p-zoom{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:2px;background:rgba(248,242,230,.92);border-radius:999px;padding:3px;box-shadow:0 2px 10px rgba(60,40,20,.15)}
.p-zoom button{border:none;background:transparent;padding:5px 10px;font-size:15px}
#pZoomVal{font-size:12px;min-width:44px;text-align:center;color:var(--ink2);font-variant-numeric:tabular-nums}
.p-side{background:#f8f2e6;border-left:1px solid var(--line);padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.p-side h4{margin:0 0 8px;font:600 11px var(--sans);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.cur{display:flex;align-items:center;gap:10px}
#pCurColor{width:42px;height:42px;border-radius:50%;box-shadow:inset 0 0 0 3px #fffaf1,0 0 0 1px var(--line),0 2px 6px rgba(0,0,0,.15)}
#pHex{width:88px;font-size:13px;padding:6px 10px;font-variant-numeric:tabular-nums}
#pToolName{margin-left:auto;font:600 15px var(--serif);color:var(--woodD);white-space:nowrap}
#pPalette{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:12px;border-radius:40% 55% 50% 45%/50% 45% 55% 50%;background:linear-gradient(135deg,#c9a77c,#b28a5d);box-shadow:inset 0 2px 6px rgba(0,0,0,.18)}
.swatch{width:100%;aspect-ratio:1;border-radius:50%;padding:0;border:2px solid rgba(255,250,240,.6);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.swatch:hover{transform:scale(1.12);background-color:inherit}
.swatch.on{border-color:#fff;box-shadow:0 0 0 2px var(--woodD)}
.swatch.sm{width:22px;height:22px;flex:none}
#pRecent{display:flex;gap:5px;flex-wrap:wrap;min-height:22px;margin-top:8px}
.picker{position:relative}
#pSV{width:100%;height:120px;border-radius:10px;display:block;cursor:crosshair;touch-action:none}
.huewrap{position:relative;margin-top:8px}
#pHue{width:100%;height:14px;border-radius:7px;display:block;cursor:pointer;touch-action:none}
#pHueMark{position:absolute;top:-2px;width:6px;height:18px;margin-left:-3px;border-radius:3px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3);pointer-events:none}
#pSliders .sl{display:grid;grid-template-columns:52px 1fr 44px;gap:8px;align-items:center;font-size:12px;margin:8px 0}
#pSliders .sl .v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
#pSliders.disabled{opacity:.4;pointer-events:none}
.sizeprev{height:44px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#fffdf8;border:1px solid var(--line)}
#pSizeDot{border-radius:50%;background:var(--ink)}
#pSideToggle{display:none}
.hint{font-size:11px;color:var(--muted);line-height:1.7}
/* 狭い画面 */
@media (max-width:820px){
  #paint{grid-template-columns:62px 1fr;grid-template-rows:auto 1fr}
  .p-top{flex-wrap:wrap;padding:6px 10px;gap:6px}
  .p-title{order:-1;flex-basis:100%}
  .p-actions button,.p-top>button{padding:6px 10px;font-size:12px}
  .p-tool{width:50px;height:50px}
  .p-side{position:fixed;right:0;top:0;bottom:0;width:min(280px,86vw);z-index:45;transform:translateX(100%);transition:transform .25s;box-shadow:var(--shadow)}
  #paint.side-open .p-side{transform:none}
  #pSideToggle{display:block;position:absolute;right:12px;bottom:12px;width:48px;height:48px;border-radius:50%;padding:0;background:var(--cur,#333);box-shadow:inset 0 0 0 4px #fffaf1,0 3px 10px rgba(0,0,0,.25);z-index:3}
  .controls{grid-template-columns:1fr}
  .supplies{grid-template-columns:1fr}
  .tcard{padding:30px 22px 22px}.tcard h1{font-size:34px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="touchLayer"></div>

<div id="hud" class="hidden">
  <div id="cross"></div>
  <div id="prompt"></div>
  <div id="hudTime">--:--</div>
  <button id="clickHint" class="hidden">クリックして視点操作を再開</button>
</div>
<div id="touchUI" class="hidden">
  <div id="stick"><div id="stickKnob"></div></div>
  <button id="tMenu">メニュー</button>
  <div class="tbtns"><button id="tF" class="hidden">F</button><button id="tE" class="primary">E</button></div>
</div>

<div id="title">
  <div class="tcard">
    <div class="arch"></div>
    <h1>ひだまりのアトリエ</h1>
    <p class="sub">― 絵を描くための、しずかな部屋 ―</p>
    <p>レンガの壁とアーチ窓のアトリエで、<br>好きな画材で、好きな絵を。描いた絵は壁に飾れます。</p>
    <div id="loadWrap"><div id="loadBar"></div></div>
    <div id="loadMsg">読み込み中…</div>
    <button id="titleStart" class="primary" disabled>準備中…</button>
    <div class="controls">
      <span><kbd>W A S D</kbd>歩く（Shift で速く）</span>
      <span><kbd>マウス</kbd>見回す</span>
      <span><kbd>E</kbd>調べる・使う</span>
      <span><kbd>F</kbd>向きを変える</span>
      <span><kbd>Esc</kbd>メニュー</span>
      <span><kbd>描画</kbd>Ctrl+Z / Ctrl+Y</span>
    </div>
  </div>
</div>

<div id="paint" class="hidden">
  <header class="p-top">
    <button id="pBack">‹ アトリエに戻る</button>
    <div class="p-title"><span id="pName">無題</span><small id="pPaper"></small></div>
    <div class="p-actions">
      <button id="pNew">新規</button>
      <button id="pOpen">開く</button>
      <button id="pClear">全消去</button>
      <button id="pHang">壁に飾る</button>
      <button id="pSave" class="primary">保存</button>
    </div>
  </header>
  <aside class="p-tools">
    <button class="p-tool" data-tool="pencil" title="鉛筆 (1)"><span class="ic"></span>鉛筆</button>
    <button class="p-tool" data-tool="watercolor" title="水彩 (2)"><span class="ic"></span>水彩</button>
    <button class="p-tool" data-tool="oil" title="油絵 (3)"><span class="ic"></span>油絵</button>
    <button class="p-tool" data-tool="pastel" title="パステル (4)"><span class="ic"></span>パステル</button>
    <div class="p-sep"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ============ 基本ユーティリティ ============ */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
let _seed = 12345;
const srand = () => { _seed = (_seed * 16807) % 2147483647; return (_seed - 1) / 2147483646; };
const sr = (a = 0, b = 1) => a + srand() * (b - a);
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

function mkCanvas(w, h, opts) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c._ctx = c.getContext('2d', opts || undefined); return c;
}
function ctxOf(c) { return c._ctx || c.getContext('2d'); }

function hexToRgb(hex) {
  hex = hex.replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const n = parseInt(hex, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
}
function rgbToHsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d) {
    if (mx === r) h = ((g - b) / d) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  return [h, mx ? d / mx : 0, mx];
}
function hsvToRgb(h, s, v) {
  const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
  let r, g, b;
  if (h < 60) [r, g, b] = [c, x, 0]; else if (h < 120) [r, g, b] = [x, c, 0];
  else if (h < 180) [r, g, b] = [0, c, x]; else if (h < 240) [r, g, b] = [0, x, c];
  else if (h < 300) [r, g, b] = [x, 0, c]; else [r, g, b] = [c, 0, x];
  return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
}
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

/* ---- 高速なタイル可能バリューノイズ（キャンバスの拡大補間を利用） ---- */
function noiseLayer(size, cells, rnd = Math.random) {
  const s = mkCanvas(cells + 2, cells + 2), sx = ctxOf(s);
  const id = sx.createImageData(cells + 2, cells + 2);
  const vals = new Float32Array(cells * cells);
  for (let i = 0; i < vals.length; i++) vals[i] = rnd();
  for (let y = 0; y < cells + 2; y++) for (let x = 0; x < cells + 2; x++) {
    const v = vals[((y - 1 + cells) % cells) * cells + ((x - 1 + cells) % cells)] * 255;
    const o = (y * (cells + 2) + x) * 4; id.data[o] = id.data[o + 1] = id.data[o + 2] = v; id.data[o + 3] = 255;
  }
  sx.putImageData(id, 0, 0);
  const c = mkCanvas(size, size), cx = ctxOf(c);
  cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = 'high';
  const k = size / cells;
  cx.drawImage(s, 0.5, 0.5, cells + 1, cells + 1, -k * 0.5, -k * 0.5, size + k, size + k);
  return c;
}
// fbm: 返り値 Float32Array (0..1) と canvas
function fbm(size, baseCells, octaves = 4, gain = 0.5, rnd = Math.random) {
  const out = new Float32Array(size * size);
  let amp = 1, tot = 0, cells = baseCells;
  for (let o = 0; o < octaves; o++) {
    const c = noiseLayer(size, Math.min(cells, size), rnd);
    const d = ctxOf(c).getImageData(0, 0, size, size).data;
    for (let i = 0; i < out.length; i++) out[i] += d[i * 4] / 255 * amp;
    tot += amp; amp *= gain; cells *= 2;
  }
  let mn = 1e9, mx = -1e9;
  for (let i = 0; i < out.length; i++) { out[i] /= tot; if (out[i] < mn) mn = out[i]; if (out[i] > mx) mx = out[i]; }
  const r = mx - mn || 1;
  for (let i = 0; i < out.length; i++) out[i] = (out[i] - mn) / r;
  return out;
}

/* ============ 保存（IndexedDB + クラウドDB同期） ============ */
const Store = {
  db: null, mem: { works: new Map(), kv: new Map() },
  cloud: null, uid: null, cloudReady: false, writeChains: {},
  async init() {
    try {
      this.db = await new Promise((res, rej) => {
        const rq = indexedDB.open('my-little-atelier', 1);
        rq.onupgradeneeded = () => {
          const d = rq.result;
          if (!d.objectStoreNames.contains('works')) d.createObjectStore('works', { keyPath: 'id' });
          if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
        };
        rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
        setTimeout(() => rej(new Error('idb timeout')), 4000);
      });
    } catch (e) { console.warn('IndexedDB unavailable', e); this.db = null; }
  },
  _tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const tx = this.db.transaction(store, mode), st = tx.objectStore(store);
      const r = fn(st); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error);
    });
  },
  async listWorks() {
    if (!this.db) return [...this.mem.works.values()];
    try { return await this._tx('works', 'readonly', s => s.getAll()); } catch (e) { return [...this.mem.works.values()]; }
  },
  async putWorkLocal(w) {
    this.mem.works.set(w.id, w);
    if (this.db) try { await this._tx('works', 'readwrite', s => s.put(w)); } catch (e) { console.warn(e); }
  },
  async deleteWorkLocal(id) {
    this.mem.works.delete(id);
    if (this.db) try { await this._tx('works', 'readwrite', s => s.delete(id)); } catch (e) { }
  },
  async getKV(k) {
    if (!this.db) return this.mem.kv.get(k);
    try { return await this._tx('kv', 'readonly', s => s.get(k)); } catch (e) { return this.mem.kv.get(k); }
  },
  async setKV(k, v) {
    this.mem.kv.set(k, v);
    if (this.db) try { await this._tx('kv', 'readwrite', s => s.put(v, k)); } catch (e) { }
  },
  /* --- クラウド --- */
  async initCloud() {
    try {
      if (!window.claude || !window.claude.use) return false;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return false;
      const uid = await user.id();
      if (!uid) return false;
      this.cloud = db; this.uid = uid; this.cloudReady = true;
      return true;
    } catch (e) { console.warn('cloud unavailable', e); return false; }
  },
  _col() { return this.cloud.collection('data/users/' + this.uid); },
  _queue(key, fn) {
    const prev = this.writeChains[key] || Promise.resolve();
    const next = prev.catch(() => { }).then(fn);
    this.writeChains[key] = next; return next;
  },
  async cloudList() {
    if (!this.cloudReady) return null;
    return await Promise.race([
      this._col().get().then(s => s.docs.map(d => ({ id: d.id, data: d.data() }))),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000))
    ]);
  },
  cloudSet(key, data) {
    if (!this.cloudReady) return Promise.resolve(false);
    return this._queue(key, async () => {
      try { await this._col().doc(key).set(data); return true; }
      catch (e) {
        if (e && e.code === 'unavailable') {
          await new Promise(r => setTimeout(r, 800 + Math.random() * 800));
          try { await this._col().doc(key).set(data); return true; } catch (e2) { }
        }
        console.warn('cloud write failed', key, e); return false;
      }
    });
  },
  cloudDelete(key) {
    if (!this.cloudReady) return Promise.resolve();
    return this._queue(key, () => this._col().doc(key).delete().catch(() => { }));
  }
};

// 画像をクラウド用に圧縮（JSON 256KiB 制限内）
function compressForCloud(src, maxChars = 230000) {
  const sizes = [1200, 1024, 880, 720, 560];
  const qs = [0.86, 0.76, 0.66];
  for (const w of sizes) {
    const h = Math.round(w * 0.75);
    const c = mkCanvas(w, h); ctxOf(c).drawImage(src, 0, 0, w, h);
    for (const q of qs) {
      const d = c.toDataURL('image/jpeg', q);
      if (d.length < maxChars) return d;
    }
  }
  return null;
}
function makeThumb(src, w = 240) {
  const h = Math.round(w * 0.75);
  const c = mkCanvas(w, h); ctxOf(c).drawImage(src, 0, 0, w, h);
  return c.toDataURL('image/jpeg', 0.8);
}
function loadImage(url) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
}

'use strict';
/* =====================================================================
   手続き的テクスチャ（すべて同じ解像度感・同じ筆致で統一）
   ===================================================================== */
const Tex = {
  renderer: null, cache: {},
  t(canvas, opts = {}) {
    const tx = new THREE.CanvasTexture(canvas);
    tx.wrapS = tx.wrapT = THREE.RepeatWrapping;
    if (opts.color !== false) tx.encoding = THREE.sRGBEncoding;
    tx.anisotropy = this.renderer ? Math.min(8, this.renderer.capabilities.getMaxAnisotropy()) : 1;
    return tx;
  },
  grime(c, cells = 48, alpha = 0.22, mode = 'multiply') {
    const n = noiseLayer(c.width, cells), x = ctxOf(c);
    x.globalCompositeOperation = mode; x.globalAlpha = alpha; x.drawImage(n, 0, 0);
    x.globalCompositeOperation = 'source-over'; x.globalAlpha = 1;
  },
  /* レンガ：不規則な茶・赤茶 */
  brick() {
    if (this.cache.brick) return this.cache.brick;
    _seed = 4242;
    const S = 1024, c = mkCanvas(S, S), x = ctxOf(c), b = mkCanvas(S, S), bx = ctxOf(b);
    x.fillStyle = '#b5a68e'; x.fillRect(0, 0, S, S);
    bx.fillStyle = '#404040'; bx.fillRect(0, 0, S, S);
    // モルタルのざらつき
    for (let i = 0; i < 9000; i++) { x.fillStyle = `rgba(${sr(90, 140)},${sr(80, 120)},${sr(60, 100)},${sr(0.05, 0.2)})`; x.fillRect(sr(0, S), sr(0, S), sr(1, 3), sr(1, 3)); }
    const rows = 30, rh = S / rows;
    for (let r = 0; r < rows; r++) {
      let px = -sr(0, 90);
      while (px < S) {
        const w = sr(78, 108), gap = sr(5, 8), y0 = r * rh + sr(2.5, 4), h = rh - sr(5, 7);
        const hue = sr(8, 26), sat = sr(28, 48), lig = sr(24, 40) + (srand() < 0.12 ? sr(6, 12) : 0) - (srand() < 0.1 ? 8 : 0);
        const draw = (ox) => {
          const X = px + ox;
          x.fillStyle = `hsl(${hue},${sat}%,${lig}%)`;
          // 欠けた角
          const k = () => sr(0, 4);
          x.beginPath(); x.moveTo(X + k(), y0 + k()); x.lineTo(X + w - k(), y0 + k()); x.lineTo(X + w - k(), y0 + h - k()); x.lineTo(X + k(), y0 + h - k()); x.closePath(); x.fill();
          // 色むら
          const g = x.createLinearGradient(X, y0, X + w, y0 + h);
          g.addColorStop(0, `hsla(${hue + 6},${sat}%,${lig + 6}%,0.35)`); g.addColorStop(1, `hsla(${hue - 4},${sat}%,${lig - 8}%,0.35)`);
          x.fillStyle = g; x.fillRect(X + 2, y0 + 2, w - 4, h - 4);
          for (let i = 0; i < 40; i++) {
            const l = lig + sr(-10, 10);
            x.fillStyle = `hsla(${hue + sr(-5, 5)},${sat}%,${l}%,${sr(0.15, 0.5)})`;
            x.fillRect(X + sr(2, w - 4), y0 + sr(2, h - 4), sr(1, 5), sr(1, 3));
          }
          // 上端のハイライト・下端の影
          x.fillStyle = 'rgba(255,230,200,0.10)'; x.fillRect(X + 3, y0 + 2, w - 6, 2);
          x.fillStyle = 'rgba(0,0,0,0.18)'; x.fillRect(X + 3, y0 + h - 4, w - 6, 3);
          bx.fillStyle = `rgb(${sr(170, 215)},${sr(170, 215)},${sr(170, 215)})`; bx.fillRect(X + 2, y0 + 2, w - 4, h - 4);
        };
        draw(0); if (px + w > S) draw(-S);
        px += w + gap;
      }
    }
    this.grime(c, 40, 0.25); this.grime(c, 9, 0.18);
    const n = noiseLayer(S, 200); bx.globalCompositeOperation = 'multiply'; bx.globalAlpha = 0.4; bx.drawImage(n, 0, 0);
    this.cache.brick = { map: this.t(c), bump: this.t(b, { color: false }) };
    return this.cache.brick;
  },
  /* 床板 */
  floor() {
    if (this.cache.floor) return this.cache.floor;
    _seed = 99;
    const S = 1024, c = mkCanvas(S, S), x = ctxOf(c);
    const n = 10, pw = S / n;
    for (let i = 0; i < n; i++) {
      let y = -sr(0, 400);
      while (y < S) {
        const len = sr(380, 700);
        const base = [sr(118, 140), sr(82, 98), sr(52, 64)].map(v => v * sr(0.88, 1.08));
        const seg = (oy) => {
          const X = i * pw, Y = y + oy;
          x.fillStyle = rgba(base, 1); x.fillRect(X, Y, pw, len);
          for (let k = 0; k < 34; k++) {
            const gx = X + sr(2, pw - 2), amp = sr(1, 5), f = sr(0.004, 0.012), ph = sr(0, 6);
            x.strokeStyle = `rgba(${base[0] * 0.55},${base[1] * 0.5},${base[2] * 0.45},${sr(0.06, 0.22)})`;
            x.lineWidth = sr(0.6, 2.2); x.beginPath();
            for (let t = 0; t <= len; t += 8) { const xx = gx + Math.sin((Y + t) * f + ph) * amp; t ? x.lineTo(xx, Y + t) : x.moveTo(xx, Y + t); }
            x.stroke();
          }
          if (srand() < 0.35) { // 節
            const kx = X + sr(10, pw - 10), ky = Y + sr(40, len - 40);
            for (let r = 9; r > 1; r -= 2) { x.strokeStyle = `rgba(60,35,20,${0.12 + (9 - r) * 0.03})`; x.beginPath(); x.ellipse(kx, ky, r * 0.7, r * 1.8, 0, 0, 7); x.stroke(); }
          }
          const g = x.createLinearGradient(X, 0, X + pw, 0);
          g.addColorStop(0, 'rgba(0,0,0,0.10)'); g.addColorStop(0.15, 'rgba(255,240,220,0.05)'); g.addColorStop(0.85, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.16)');
          x.fillStyle = g; x.fillRect(X, Y, pw, len);
          x.fillStyle = 'rgba(30,18,10,0.7)'; x.fillRect(X, Y, pw, 2);
        };
        seg(0); if (y + len > S) seg(-S);
        y += len;
      }
      x.fillStyle = 'rgba(28,16,8,0.75)'; x.fillRect(i * pw, 0, 2, S);
    }
    this.grime(c, 24, 0.18);
    this.cache.floor = { map: this.t(c) };
    return this.cache.floor;
  },
  /* 家具用の木目（色指定） */
  wood(key, base = [120, 82, 52], ringy = 1) {
    if (this.cache['w' + key]) return this.cache['w' + key];

function boxBlur(src, w, h, r) {
  if (r < 1) return src.slice();
  const tmp = new Float32Array(w * h), out = new Float32Array(w * h), k = 1 / (2 * r + 1);
  for (let y = 0; y < h; y++) {
    const row = y * w; let acc = 0;
    for (let x = -r; x <= r; x++) acc += src[row + clamp(x, 0, w - 1)];
    for (let x = 0; x < w; x++) {
      tmp[row + x] = acc * k;
      acc += src[row + Math.min(x + r + 1, w - 1)] - src[row + Math.max(x - r, 0)];
    }
  }
  for (let x = 0; x < w; x++) {
    let acc = 0;
    for (let y = -r; y <= r; y++) acc += tmp[clamp(y, 0, h - 1) * w + x];
    for (let y = 0; y < h; y++) {
      out[y * w + x] = acc * k;
      acc += tmp[Math.min(y + r + 1, h - 1) * w + x] - tmp[Math.max(y - r, 0) * w + x];
    }
  }
  return out;
}

  /* ---------------- アイビー ---------------- */
  buildIvy() {
    const walls = [
      { o: new THREE.Vector3(-RX, 0, -RZ), u: new THREE.Vector3(1, 0, 0), n: new THREE.Vector3(0, 0, 1), L: RX * 2, back: true },
      { o: new THREE.Vector3(-RX, 0, RZ), u: new THREE.Vector3(0, 0, -1), n: new THREE.Vector3(1, 0, 0), L: RZ * 2 },
      { o: new THREE.Vector3(RX, 0, -RZ), u: new THREE.Vector3(0, 0, 1), n: new THREE.Vector3(-1, 0, 0), L: RZ * 2, door: true },
      { o: new THREE.Vector3(RX, 0, RZ), u: new THREE.Vector3(-1, 0, 0), n: new THREE.Vector3(0, 0, -1), L: RX * 2 }
    ];
    const inArch = (x, y) => WIN.xs.some(cx => {
      const r = WIN.w / 2 + 0.12; if (Math.abs(x - cx) > r || y < WIN.y0 - 0.1) return false;
      if (y <= WIN.ys) return true; return Math.hypot(x - cx, y - WIN.ys) < r;
    });
    const leaves = [];
    const strand = (w, s, y, len, dir) => {
      let ds = 0;
      for (let i = 0; i < len; i++) {
        const p = w.o.clone().addScaledVector(w.u, s); p.y = y;
        if (w.back && inArch(p.x, y)) break;
        if (w.door && p.z > DOOR.z0 - 0.15 && p.z < DOOR.z1 + 0.15 && y < DOOR.h + 0.25) break;
        if (y < 0.4) break;
        leaves.push({ p: p.addScaledVector(w.n, rand(0.015, 0.06)), n: w.n, s: rand(0.07, 0.12) });
        y -= rand(0.04, 0.075); ds = clamp(ds + rand(-0.02, 0.02), -0.03, 0.03); s += ds + dir * 0.01;
      }
    };
    walls.forEach(w => {
      // 天井付近の横這い
      let s = 0;
      while (s < w.L) {
        const dense = Math.sin(s * 0.9 + w.L) > -0.2;
        if (dense) {
          for (let k = 0; k < 4; k++) leaves.push({ p: w.o.clone().addScaledVector(w.u, s + rand(-0.05, 0.05)).setY(RH - 0.08 - rand(0, 0.25)).addScaledVector(w.n, rand(0.015, 0.06)), n: w.n, s: rand(0.07, 0.12) });
          if (Math.random() < 0.45) strand(w, s, RH - 0.2, (rand(6, 34)) | 0, rand(-1, 1));
        }
        s += rand(0.12, 0.2);
      }
    });
    // 窓のアーチ周り
    WIN.xs.forEach((cx, wi) => {
      if (wi === 1) return;
      const r = WIN.w / 2 + 0.16;
      for (let a = 0.15; a < Math.PI * 0.85; a += 0.06) {
        if (Math.random() < 0.3) continue;
        const x = cx + Math.cos(a) * r, y = WIN.ys + Math.sin(a) * r;
        leaves.push({ p: new THREE.Vector3(x, y, -RZ + rand(0.02, 0.07)), n: new THREE.Vector3(0, 0, 1), s: rand(0.07, 0.11) });
      }
    });
    const im = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1).translate(0, 0.5, 0), this.mats.ivy, leaves.length);
    const d = new THREE.Object3D(), c = new THREE.Color(), tgt = new THREE.Vector3();
    leaves.forEach((l, i) => {
      d.position.copy(l.p); d.scale.set(l.s, l.s, l.s);
      tgt.copy(l.p).add(l.n); d.lookAt(tgt);
      d.rotateZ(rand(-0.7, 0.7)); d.rotateX(rand(-0.6, 0.2));
      d.updateMatrix(); im.setMatrixAt(i, d.matrix);
      c.setHSL(rand(0.22, 0.3), rand(0.2, 0.35), rand(0.22, 0.38)); im.setColorAt(i, c);
    });
    im.castShadow = true; im.receiveShadow = true; im.frustumCulled = false;
    // 揺れ（頂点シェーダ）
    const U = this.uniforms;
    this.mats.ivy.onBeforeCompile = sh => {
      sh.uniforms.uTime = U.time;
      sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace('#include <begin_vertex>',
        `#include <begin_vertex>
        #ifdef USE_INSTANCING
          vec3 ip = instanceMatrix[3].xyz; float ph = ip.x*3.1 + ip.y*2.3 + ip.z*1.7;
          float k = clamp(position.y*1.6, 0.0, 1.0);
          transformed.z += sin(uTime*1.4 + ph)*0.10*k + sin(uTime*2.7 + ph*1.3)*0.04*k;
          transformed.x += sin(uTime*1.1 + ph*0.7)*0.05*k;
        #endif`);
    };
    this.scene.add(im);
  },
  buildAtmosphere() {
    // 光の中を漂うほこり
    const N = 260, p = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) p.set([rand(-RX + 0.5, RX - 0.5), rand(0.3, 3.6), rand(-RZ + 0.3, 1.5)], i * 3);
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
    const dc = mkCanvas(32, 32), dx = ctxOf(dc), gr = dx.createRadialGradient(16, 16, 0, 16, 16, 16); gr.addColorStop(0, 'rgba(255,248,230,1)'); gr.addColorStop(1, 'rgba(255,248,230,0)'); dx.fillStyle = gr; dx.fillRect(0, 0, 32, 32);

  computeColliders() {
    this.colliders = [];
    const b = new THREE.Box3();
    for (const o of this.colliderObjs) {
      o.updateMatrixWorld(true); b.setFromObject(o);
      const pad = 0.02;
      this.colliders.push({ o, x0: b.min.x - pad, x1: b.max.x + pad, z0: b.min.z - pad, z1: b.max.z + pad, top: b.max.y });
    }
  },
  /* ---------------- 時間・天候 ---------------- */
  env: { hour: 10, rain: 0, rainT: 0, day: 1 },
  setEnvironment(hour, rainTarget, dt) {
    const E = this.env; E.hour = hour;
    E.rain = lerp(E.rain, rainTarget, Math.min(1, dt * 0.5));
    const ang = (hour - 6) / 12 * Math.PI;
    const el = Math.sin(ang), cx = Math.cos(ang);
    const day = smooth(-0.06, 0.22, el); E.day = day;
    const rain = E.rain;
    // 太陽/月の向き
    let toLight;
    if (el > -0.05) toLight = new THREE.Vector3(cx * 0.95, Math.max(el, 0.08) * 1.05, -0.75).normalize();
    else toLight = new THREE.Vector3(-cx * 0.4, 0.6, -0.8).normalize();
    this.sun.position.copy(toLight).multiplyScalar(20); this.sun.target.position.set(0, 0, 0);
    const warm = smooth(0.0, 0.45, el);
    const sunCol = new THREE.Color(0xff9a5a).lerp(new THREE.Color(0xfff3e0), warm);
    const moonCol = new THREE.Color(0x8ea6d8);
    this.sun.color.copy(day > 0.02 ? sunCol : moonCol);
    this.sun.intensity = (day > 0.02 ? day * 2.5 : 0.22) * (1 - rain * 0.75);
    this.hemi.intensity = (0.16 + 0.5 * day) * (1 - rain * 0.25);
    this.hemi.color.set(0x1b2440).lerp(new THREE.Color(0xdfe8f0), day);
    this.fills.forEach(f => { f.intensity = day * 0.55 * (1 - rain * 0.35); f.color.set(rain > 0.5 ? 0xbfcad6 : 0xd6e4f0); });
    // 空
    const nightTop = new THREE.Color(0x0b1328), nightHor = new THREE.Color(0x1f2d4c);
    const dawnTop = new THREE.Color(0x6f8fc0), dawnHor = new THREE.Color(0xf0b07a);
    const dayTop = new THREE.Color(0x86acd8), dayHor = new THREE.Color(0xdde8ee);
    const rainTop = new THREE.Color(0x7f8996), rainHor = new THREE.Color(0xaab2b8);
    const top = nightTop.clone().lerp(dawnTop, day).lerp(dayTop, warm);
    const hor = nightHor.clone().lerp(dawnHor, day).lerp(dayHor, warm);
    top.lerp(rainTop.clone().multiplyScalar(0.25 + 0.75 * day), rain); hor.lerp(rainHor.clone().multiplyScalar(0.25 + 0.75 * day), rain);
    this.skyU.top.value.copy(top); this.skyU.hor.value.copy(hor);
    this.skyU.sunDir.value.copy(toLight); this.skyU.sunCol.value.copy(sunCol).multiplyScalar(day * (1 - rain));
    this.skyU.stars.value = (1 - day) * (1 - rain);
    // 光の筋
    this.updateShafts(toLight.clone().negate());
    this.shaftMat.uniforms.op.value = day > 0.02 ? 0.05 * day * (1 - rain) * smooth(0.0, 0.25, el) : 0.012 * (1 - rain);
    this.shaftMat.uniforms.col.value.copy(day > 0.02 ? sunCol : moonCol);
    this.dust.material.opacity = 0.15 + 0.45 * day * (1 - rain);
    // ランプ
    for (const L of this.lamps) {
      const k = L.on ? L.base * (0.55 + 0.45 * (1 - day)) : 0;
      L.light.intensity = k; L.light.visible = L.on;
      L.mats.forEach(m => m.emissiveIntensity = L.on ? (m.color.getHex() === 0xefe3cc ? 0.7 : 1.2) : 0);
    }
    this.houseWins.forEach((w, i) => w.material.emissiveIntensity = (1 - day) * ((i * 7) % 3 ? 0.9 : 0.1));
    if (this.vestWin) this.vestWin.material.color.copy(hor).multiplyScalar(0.35 + 0.65 * day);
    // 雨
    this.rainMeshes.forEach(m => m.material.opacity = rain);
    this.rainLines.material.opacity = rain * 0.35;
    return { day, rain, el };
  },
  update(dt, t) {
    this.uniforms.time.value = t;
    this.updateDoor(dt);
    const wind = 0.6 + this.env.rain * 0.8;
    for (const s of this.swayers) {
      const a = s.a * (s.indoor ? 1 : wind);
      s.o.rotation.z = Math.sin(t * 0.9 + s.ph) * a + Math.sin(t * 2.1 + s.ph * 2) * a * 0.3;
      s.o.rotation.x = Math.sin(t * 0.7 + s.ph * 1.3) * a * 0.6;
    }
    if (this.env.rain > 0.02) {
      this._rainAcc = (this._rainAcc || 0) + dt;
      if (this._rainAcc > 1 / 30) { this.rainTex.update(this._rainAcc); this._rainAcc = 0; }
      const p = this.rainLines.geometry.attributes.position, a = p.array;
      for (let i = 0; i < a.length; i += 6) {
        a[i + 1] -= dt * 9; a[i + 4] -= dt * 9;
        if (a[i + 4] < -0.6) { const y = rand(7, 9); a[i + 1] = y; a[i + 4] = y - 0.35; }
      }
      p.needsUpdate = true;
    }
    // ほこり
    const dp = this.dust.geometry.attributes.position, da = dp.array;
    for (let i = 0; i < da.length; i += 3) {
      da[i] += Math.sin(t * 0.3 + i) * dt * 0.02; da[i + 1] += Math.sin(t * 0.2 + i * 0.7) * dt * 0.015; da[i + 2] += Math.cos(t * 0.25 + i) * dt * 0.02;
    }
    dp.needsUpdate = true;
  },
  setClock(hour) {
    const h = hour % 12, m = (hour % 1) * 60, s = (m % 1) * 60;
    this.hourHand.rotation.z = -h / 12 * Math.PI * 2;
    this.minHand.rotation.z = -m / 60 * Math.PI * 2;
    this.secHand.rotation.z = -Math.floor(s) / 60 * Math.PI * 2;
  },
  setShadowQuality(high) {
    const s = high ? 2048 : 1024;
    if (this.sun.shadow.mapSize.x !== s) {
      this.sun.shadow.mapSize.set(s, s);
      if (this.sun.shadow.map) { this.sun.shadow.map.dispose(); this.sun.shadow.map = null; }
    }
  }
};

'use strict';
/* =====================================================================
   ダイアログ
   ===================================================================== */
const Dialog = {
  resolve: null,
  open({ title, html, buttons, wide }) {
    const d = $('#dialog');
    $('#dlgTitle').textContent = title;
    $('#dlgBody').innerHTML = html;
    const bb = $('#dlgBtns'); bb.innerHTML = '';
    d.classList.toggle('wide', !!wide);
    return new Promise(res => {
      this.resolve = res;
      buttons.forEach(b => {
        const e = document.createElement('button'); e.textContent = b.label;
        if (b.primary) e.className = 'primary'; if (b.danger) e.className = 'danger';
        e.addEventListener('click', () => this.close(b.value));
        bb.appendChild(e);
      });
      $('#dialogWrap').classList.remove('hidden');
      const inp = $('input[type=text]', d); if (inp) setTimeout(() => { inp.focus(); inp.select(); }, 30);
    });
  },
  close(v) {
    $('#dialogWrap').classList.add('hidden');
    const r = this.resolve; this.resolve = null; if (r) r(v);
  },
  isOpen() { return !$('#dialogWrap').classList.contains('hidden'); },
  async confirm(title, msg, ok = 'OK') {
    return (await this.open({ title, html: `<p>${msg}</p>`, buttons: [{ label: 'やめる', value: false }, { label: ok, value: true, danger: true }] })) === true;
  },
  async saveDialog(name, hasId) {
    const html = `<label class="field"><span>タイトル</span><input type="text" id="dlgName" maxlength="40" value="${escapeHtml(name)}" placeholder="無題"></label>`;
    const buttons = [{ label: 'やめる', value: null }];
    if (hasId) buttons.push({ label: '別の作品として保存', value: 'new' });
    buttons.push({ label: hasId ? '上書き保存' : '保存', value: 'save', primary: true });
    const p = this.open({ title: '作品を保存', html, buttons });
    const inp = $('#dlgName');
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); this.close('save'); } });
    const r = await p;
    if (!r) return null;
    return { name: inp.value.trim(), asNew: r === 'new' };

          const img = await loadImage(cw.img);

  /* ---------- 作品 ---------- */

  /* ---------- 描画モード ---------- */

    const wip = { img, paper: this.engine.paperType, workId: PaintUI.workId, workName: PaintUI.workName, changed: this.engine.changed, updated: Date.now() };

  },
  /* ---------- 入力 ---------- */
  bindInput() {
    const cv = $('#game');
    cv.addEventListener('click', () => { if (this.mode === 'play' && !this.locked && !this.dragLook) this.requestLock(); });
    document.addEventListener('pointerlockchange', () => {
      const was = this.locked;
      this.locked = document.pointerLockElement === cv;

    document.addEventListener('mousemove', e => {
      if (this.mode !== 'play' || this.panel) return;
      if (this.locked) this.look(e.movementX, e.movementY);
    });

    window.addEventListener('keydown', e => {
      if (Dialog.isOpen()) { if (e.key === 'Escape') Dialog.close(null); return; }
      if (this.mode === 'paint' && !this.panel) return;
      if (this.panel) {
        if (e.key === 'Escape' || (this.panel === 'book' && e.key.toLowerCase() === 'e')) { this.closePanel(); e.preventDefault(); }
        if (this.panel === 'book') { if (e.key === 'ArrowRight') this.bookPage(1); if (e.key === 'ArrowLeft') this.bookPage(-1); }
        return;
      }
      if (this.mode !== 'play') return;
      if (e.target && e.target.tagName === 'INPUT') return;
      this.keys[e.code] = true;
      if (e.code === 'KeyE') this.doAction('E');
      if (e.code === 'KeyF') this.doAction('F');
      if (e.code === 'Escape' || e.code === 'KeyP') { if (!this.locked) this.openPause(); }
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();

  bindTouch() {

        mv = { id: e.pointerId, x: e.clientX, y: e.clientY };

  requestLock() {

  lockFailed() {

  look(dx, dy) {

  },
  /* ---------- プレイヤー ---------- */
  updatePlayer(dt) {
    const P = this.player, k = this.keys;
    let f = (k.KeyW || k.ArrowUp ? 1 : 0) - (k.KeyS || k.ArrowDown ? 1 : 0);
    let s = (k.KeyD || k.ArrowRight ? 1 : 0) - (k.KeyA || k.ArrowLeft ? 1 : 0);
    if (this.touchMove) { f = -this.touchMove.y; s = this.touchMove.x; }
    if (P.sit) { if (Math.abs(f) + Math.abs(s) > 0.3) this.standUp(); else return; }

    if (P.x > RX - 0.02) {
      // 扉の開口部・玄関の中
      nx = clamp(nx, RX - 1, VEST.x1 - r);
      if (nx < RX + 0.3 + r) nz = clamp(nz, DOOR.z0 + r * 0.7, DOOR.z1 - r * 0.7);
      else nz = clamp(nz, VEST.z0 + r, VEST.z1 - r);
      if (!open && P.x >= RX + 0.12 + r && nx < RX + 0.12 + r) nx = RX + 0.12 + r;
      for (const o of World.vestColliders || []) {
        const b = new THREE.Box3().setFromObject(o);
        const cx = clamp(nx, b.min.x, b.max.x), cz = clamp(nz, b.min.z, b.max.z), dx = nx - cx, dz = nz - cz, d = Math.hypot(dx, dz);

      nz = clamp(nz, -RZ + r + 0.15, RZ - r);

  sit() {

    const cd = World.clockPos ? Math.hypot(P.x - World.clockPos.x, P.z - World.clockPos.z) : 5;
    return {
      nearWindow: inWorld ? clamp(1 - (P.z + RZ) / 7, 0.2, 1) : 0.3, wind: 0.5 + World.env.rain * 0.6,
      rain: World.env.rain, day: World.env.day, clockTick: tick && this.mode !== 'title', clockDist: inWorld ? cd : 6
    };
  }
};
function fmtTime(h) { h = ((h % 24) + 24) % 24; const H = Math.floor(h), M = Math.floor((h - H) * 60); return `${String(H).padStart(2, '0')}:${String(M).padStart(2, '0')}`; }
function setLoad(msg, p) {
  $('#loadMsg').textContent = msg;
  $('#loadBar').style.width = (p * 100) + '%';
  if (p >= 1) $('#loadWrap').classList.add('done');
}
