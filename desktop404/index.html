/* =========================================================
   MEND repair tool + dedicated repair puzzles
   ========================================================= */
const ANOM = {
  diary: { file: 'd1122', kind: 'テキスト／セクタ破損', puzzle: 'sector', ch: 1, scan: true, ico: 'doc' },
  photo: { file: 'photo', kind: '画像／タイル破損', puzzle: 'tiles', ch: 2, scan: false, ico: 'img' },
  voice: { file: 'voice', kind: '音声／波形破損', puzzle: 'wave', ch: 3, scan: true, ico: 'snd', need: () => G.flags.secretOpen },
  user: { file: 'userdat', kind: 'システム／レコード破損', puzzle: 'bits', ch: 4, scan: true, ico: 'sys' },
  path: { file: null, name: '復元ポイント 2004/11/23 04:03', where: 'ユーザー領域 \\\\mio', kind: 'ユーザー領域／経路断絶', puzzle: 'pipes', ch: 5, scan: true, ico: 'restore' },
};
const AST = id => (G.anom[id] = G.anom[id] || { found: 0, done: 0, perfect: 0 });

const MEND = {
  win() { return WM.get('mend'); },
  open() {
    const w = WM.open({
      id: 'mend', app: 'mend', title: 'MEND 修復ツール', icon: 'mend', w: 720, h: 500, minW: 600, minH: 400,
      refresh: ww => ww.render(),
      acceptFile: fid => MEND.inspect(fid),
      build: ww => {
        ww.body.innerHTML = `<div class="mend"><div class="hdr">${icon('mend')}<div><div class="t1">MEND</div><div class="t2">データ修復ツール Ver 4.1　｜　湊データ復旧サービス</div></div></div>
          <div class="toolbar" style="margin:0"><button class="btn b-scan">ディスクをスキャン</button><button class="btn b-go">修復を開始</button><span style="flex:1"></span><span style="font-size:12px;color:#58626d">ファイルをここへドラッグすると検査します</span></div>
          <div class="scanbox" style="display:flex;flex-direction:column;gap:3px;padding:0 2px"><div class="bar"><i style="width:0%"></i></div><div class="scanl">待機中</div></div>
          <div class="grid"><div class="lst sunk pane"></div><div class="side"><div class="obj sunk"></div>
            <div style="font-size:12px">ディスク侵食率</div><div class="bar red cbar"><i></i></div>
            <div style="font-size:12px">ユーザー領域の復元</div><div class="bar mbar"><i></i></div></div></div></div>`;
        ww.sel = null;
        $('.b-scan', ww.body).onclick = () => MEND.scan();
        $('.b-go', ww.body).onclick = () => { if (ww.sel) MEND.start(ww.sel); };
        ww.render = () => {
          const L = $('.lst', ww.body); L.innerHTML = '';
          const found = Object.keys(ANOM).filter(k => AST(k).found);
          if (!found.length) L.appendChild(el('div', 'empty', '登録された異常はありません。\n「ディスクをスキャン」を押してください。'));
          for (const k of found) {
            const a = ANOM[k], s = AST(k), f = a.file && FS.get(a.file);
            const st = s.done ? (s.perfect ? '<span class="st ok">完全修復</span>' : '<span class="st part">不完全</span>') : '<span class="st bad">未修復</span>';
            const r = el('div', 'arow' + (ww.sel === k ? ' sel' : ''), `${icon(a.ico, !s.done)}<div><div class="a1"></div><div class="a2"></div></div>${st}`);
            $('.a1', r).textContent = f ? STORY.displayName(f) : a.name;
            $('.a2', r).textContent = (f ? FS.path(f.p) : a.where) + '　—　' + a.kind;
            r.onclick = () => { ww.sel = k; ww.render(); };
            r.addEventListener('dblclick', () => { if (!s.done) MEND.start(k); });
            L.appendChild(r);
          }
          if (HAUNT.phantomRow()) {
            const r = el('div', 'arow', `${icon('userx', true)}<div><div class="a1">あなた</div><div class="a2">C:\\Users\\あなた　—　ユーザー／未登録</div></div><span class="st bad">未修復</span>`);
            r.onclick = () => HAUNT.phantomClick(); L.appendChild(r);
          }
          $('.b-go', ww.body).disabled = !ww.sel || AST(ww.sel).done || !ANOM[ww.sel];
          const O = $('.obj', ww.body); O.innerHTML = '<b>作業メモ</b>'; O.appendChild(document.createTextNode(STORY.objective()));
          $('.cbar i', ww.body).style.width = clamp(G.corrupt, 0, 100) + '%';
          $('.mbar i', ww.body).style.width = (G.mem / 4 * 100) + '%';
        };
        ww.render();
      },
    });
    return w;
  },
  async scan() {
    const w = this.open(); if (w.scanning) return; w.scanning = true;
    const B = $('.scanbox .bar i', w.body), S = $('.scanl', w.body); $('.b-scan', w.body).disabled = true;
    const files = Object.values(G.fs).filter(f => !f.del && !(f.hidden && !G.flags.secretShown) && f.t !== 'dir');
    const n = 40;
    for (let i = 0; i <= n; i++) {
      if (!this.win()) return;
      B.style.width = (i / n * 100) + '%';
      const f = pick(files); S.textContent = HAUNT.scanLine() || ('検査中: ' + FS.path(f.p) + '\\' + STORY.displayName(f));
      if (i % 4 === 0) AU.hdd(2, .1);
      await sleep(45);
    }
    const hits = Object.keys(ANOM).filter(k => { const a = ANOM[k]; return a.scan && a.ch <= G.ch && (!a.need || a.need()) && !AST(k).found && !(a.file && FS.get(a.file).del); });
    hits.forEach(k => AST(k).found = 1);
    w.scanning = false; $('.b-scan', w.body).disabled = false;
    const unsig = G.ch === 2 && !AST('photo').found;
    S.textContent = hits.length ? `スキャン完了：新しい異常 ${hits.length} 件` : unsig ? 'スキャン完了：署名のない異常の可能性 1 件（特定できません）' : 'スキャン完了：新しい異常はありません';
    if (hits.length) { AU.ding(); w.sel = hits[0]; STORY.onFound(hits[0]); }
    else if (unsig) { AU.err(); dialog({ title: 'MEND', ico: 'warn', msg: '署名のない異常の痕跡があります。\nスキャンでは場所を特定できませんでした。\n\nあやしいファイルを見つけたら、右クリック →「MEND で検査」で調べてください。' }); }
    w.render();
  },
  async inspect(fid) {
    const f = FS.get(fid); if (!f) return;
    this.open();
    if (f.del) { dialog({ title: 'MEND', ico: 'warn', msg: `「${f.name}」はごみ箱の中にあります。\nごみ箱内のファイルは検査できません。\n元に戻してから検査してください。` }); return; }
    if (f.t === 'dir' || f.t === 'drive') { dialog({ title: 'MEND', ico: 'info', msg: 'フォルダは検査できません。ファイルを指定してください。' }); return; }
    const w = this.win(); const S = $('.scanl', w.body), B = $('.scanbox .bar i', w.body);
    for (let i = 0; i <= 12; i++) { B.style.width = (i / 12 * 100) + '%'; S.textContent = '検査中: ' + STORY.displayName(f); if (i % 3 === 0) AU.hdd(2, .1); await sleep(40); }
    const a = f.anom && ANOM[f.anom];
    if (a && FS.isBad(f)) {
      if (a.ch > G.ch) { S.textContent = '検査完了：ファイルがロックされています'; dialog({ title: 'MEND', ico: 'warn', msg: `「${STORY.displayName(f)}」は、別のプロセスが使用中です。\nいまは検査できません。` }); return; }
      const s = AST(f.anom);
      if (!s.found) { s.found = 1; S.textContent = '検査完了：異常を検出しました'; AU.ding(); w.sel = f.anom; w.render(); STORY.onFound(f.anom); dialog({ title: 'MEND', ico: 'warn', msg: `「${STORY.displayName(f)}」に破損を検出しました。\n種類：${a.kind}\n\n修復一覧に登録しました。` }); }
      else { w.sel = f.anom; w.render(); S.textContent = '登録済みの異常です'; }
      return;
    }
    S.textContent = '検査完了：異常は見つかりませんでした';
    dialog({ title: 'MEND', ico: 'info', msg: `「${STORY.displayName(f)}」に異常は見つかりませんでした。`, sound: false });
  },
  start(k) {
    const a = ANOM[k], s = AST(k); if (s.done) return;
    if (STORY.busy) { dialog({ ico: 'warn', msg: 'ほかの処理が実行中です。少し待ってください。' }); return; }
    if (WM.get('pz')) { WM.focus(WM.get('pz')); return; }
    PZ[a.puzzle](k);
  },
  finish(k, perfect) {
    const s = AST(k); s.done = 1; s.perfect = perfect ? 1 : 0;
    if (perfect) G.mem = Math.min(4, G.mem + (k === 'path' ? 0 : 1));
    else G.corrupt = Math.min(100, G.corrupt + 15);
    const w = this.win(); if (w) w.render();
    REFRESH(); TRAY.tick();
    STORY.afterRepair(k, perfect);
  },
};

/* ---------- puzzle frame ---------- */
function pzFrame(k, { title, help, w = 720, h = 600, build, auto }) {
  let done = false;
  const win = WM.open({
    id: 'pz', app: 'mend', title: 'MEND - ' + title, icon: 'mend', w, h, resizable: false, center: true,
    onClose: ww => { if (done) return; dialog({ title: 'MEND', ico: 'ask', msg: '修復を中断しますか？\n（進み具合は失われます。あとでやり直せます）', buttons: ['中断する', '続ける'] }).then(r => { if (r.btn === 0) { done = true; ww.cleanup && ww.cleanup(); WM.close(ww, true); } }); return false; },
    build: ww => {
      ww.body.innerHTML = `<div class="pz"><div class="help"></div><div class="ph"><span class="lab">整合性</span><div class="bar"><i style="width:100%"></i></div><span class="iv" style="width:40px;text-align:right">100</span></div><div class="pzb" style="flex:1;display:flex;flex-direction:column;min-height:0"></div><div class="foot"><span class="msg"></span><button class="btn b-auto">自動補完（不完全）</button><button class="btn b-q">中断</button></div></div>`;
      $('.help', ww.body).textContent = help;
      ww.integ = 100;
      ww.msg = (t, bad) => { const m = $('.foot .msg', ww.body); m.textContent = t; m.style.color = bad ? '#9b2c2c' : '#2d4c70'; };
      ww.hurt = (n, why) => {
        if (done) return;
        ww.integ = Math.max(0, ww.integ - n);
        $('.ph .bar i', ww.body).style.width = ww.integ + '%'; $('.ph .iv', ww.body).textContent = Math.round(ww.integ);
        $('.ph .bar', ww.body).classList.toggle('red', ww.integ < 35);
        if (why) ww.msg(why, true);
        if (n >= 8) { FX.glitch(160, .35, false); }
        if (ww.integ <= 0) ww.complete(false, '整合性が失われました。不完全なまま確定します。');
      };
      ww.complete = async (perfect, note) => {
        if (done) return; done = true;
        ww.cleanup && ww.cleanup();
        $$('button', ww.body).forEach(b => b.disabled = true);
        if (!perfect && auto) await auto(ww);
        ww.msg(note || (perfect ? '修復が完了しました。' : '修復は完了しましたが、一部のデータが欠損しています。'), !perfect);
        perfect ? AU.success() : AU.fail();
        await sleep(1400);
        WM.close(ww, true);
        MEND.finish(k, perfect);
      };
      $('.b-auto', ww.body).onclick = async () => {
        const r = await dialog({ title: 'MEND', ico: 'warn', msg: '自動補完を実行しますか？\n修復は確実に終わりますが、推測できない部分は欠損のまま確定します。', buttons: ['実行する', 'やめる'] });
        if (r.btn === 0) ww.complete(false, '自動補完で確定しました（欠損あり）。');
      };
      $('.b-q', ww.body).onclick = () => WM.close(ww);
      build(ww, $('.pzb', ww.body));
      HAUNT.attachPuzzle(ww);
    },
  });
  return win;
}

const PZ = {
  /* ===== 1. sector chain (text) ===== */
  sector(k) {
    const S = STORY.diarySectors();
    const hex = () => ri(16, 255).toString(16).toUpperCase().padStart(2, '0');
    const codes = ['SOF']; const used = new Set(['SOF', 'EOF']);
    for (let i = 1; i < S.real.length; i++) { let c; do c = hex(); while (used.has(c)); used.add(c); codes.push(c); }
    codes.push('EOF');
    const cards = S.real.map((t, i) => ({ t, in: codes[i], out: codes[i + 1], real: 1 }));
    S.decoy.forEach((t, j) => { let c; do c = hex(); while (used.has(c)); used.add(c); cards.push({ t, in: codes[[2, 4, 6][j % 3]], out: c, real: 0 }); });
    shuffle(cards);
    pzFrame(k, {
      title: 'セクタ再構成', w: 820, h: 620,
      help: '壊れたテキストを、セクタの順番どおりに並べ直します。\n右の一覧から、左の「次に必要なヘッダ」と同じ番号で始まるセクタを選んでください。\n同じ番号のセクタが複数ある場合は、文章の流れから本物を見分けてください。',
      auto: async ww => { for (const c of cards.filter(c => c.real && !c.placed)) { c.placed = 1; } ww.lost = true; ww.draw(); await sleep(300); },
      build: (ww, B) => {
        B.innerHTML = `<div class="sec"><div class="col sunk a" style="background:#f4f6f8"></div><div class="col sunk b" style="background:#e9edf1"></div></div>`;
        const A = $('.a', B), P = $('.b', B);
        let need = 'SOF'; const placed = [];
        ww.draw = () => {
          A.innerHTML = '<div style="font-size:12px;color:#58626d">再構成中のファイル：2004-11-22.txt</div>';
          const order = ww.lost ? cards.filter(c => c.real).sort((a, b) => codes.indexOf(a.in) - codes.indexOf(b.in)) : placed;
          for (const c of order) { const d = el('div', 'card placed', `<span class="c1">◀${c.in}</span><span class="tx"></span><span class="c2">${c.out}▶</span>`); $('.tx', d).textContent = c.t; A.appendChild(d); }
          if (!ww.lost && need !== 'EOF') A.appendChild(el('div', 'slotx', `次に必要なヘッダ：◀ ${need}`));
          P.innerHTML = '<div style="font-size:12px;color:#58626d">未配置のセクタ</div>';
          for (const c of cards) {
            if (c.placed) continue;
            const d = el('div', 'card pool' + (c.dead ? ' dead' : '') + (c.real ? '' : ' decoy'), `<span class="c1">◀${c.in}</span><span class="tx"></span><span class="c2">${c.out}▶</span>`);
            $('.tx', d).textContent = c.dead ? '（破棄されたセクタ）' : c.t;
            d.onclick = () => {
              if (c.in !== need) { d.classList.add('wrong'); AU.err(); ww.hurt(10, `ヘッダが一致しません（必要：◀${need}）`); setTimeout(() => d.classList.remove('wrong'), 320); return; }
              if (!c.real) { c.dead = 1; AU.err(1); ww.hurt(25, '不正なセクタでした。破棄します。'); ww.draw(); STORY.onDecoy(c.t); return; }
              c.placed = 1; placed.push(c); need = c.out; AU.click(); AU.hdd(2, .1); ww.msg('セクタを配置しました。');
              ww.draw();
              if (need === 'EOF') ww.complete(true);
            };
            P.appendChild(d);
          }
        };
        ww.draw();
        PZ._solve = () => { cards.filter(c => c.real).sort((a, b) => codes.indexOf(a.in) - codes.indexOf(b.in)).forEach(c => { if (!c.placed) { c.placed = 1; placed.push(c); } }); need = 'EOF'; ww.draw(); ww.complete(true); };
      },
    });
  },

  /* ===== 2. tile rotation / swap (image) ===== */
  tiles(k) {
    const src = STORY.photoSource();
    const C = 4, R = 3, TS = 150;
    const tiles = []; for (let i = 0; i < C * R; i++) tiles.push({ home: i, rot: 0 });
    // scramble: rotations + swaps (never trivially solved)
    const rotN = 8; shuffle([...tiles.keys()]).slice(0, rotN).forEach(i => tiles[i].rot = ri(1, 3));
    for (let s = 0; s < 3; s++) { const a = ri(0, 11); let b; do b = ri(0, 11); while (b === a);[tiles[a], tiles[b]] = [tiles[b], tiles[a]]; }
    const cut = i => { const c = IMG.canvas(160, 160), x = c.getContext('2d'); x.drawImage(src, (i % C) * 160, Math.floor(i / C) * 160, 160, 160, 0, 0, 160, 160); return c; };
    const crops = tiles.map((_, i) => cut(i));
    pzFrame(k, {
      title: 'タイル再配置', w: 760, h: 700,

  /* ===== 3. waveform alignment (audio) ===== */
  wave(k) {
    const segs = [0, 1, 2].map(() => ({ f: +rnd(1.6, 6.5).toFixed(2), p: +rnd(0, 6.2).toFixed(2), a: +rnd(.35, .95).toFixed(2) }));

        const score = () => {

          let s = 0; for (let i = 0; i <= 60; i++) { const x = i / 60; s += Math.abs(t.a * Math.sin(x * t.f * 6.283 + t.p) - a * Math.sin(x * f * 6.283 + p)); }

  /* ===== 4. bit record (lights-out) ===== */
  bits(k) {
    const N = 5;

    const cur = target.slice(); const presses = new Set();

            d.onclick = () => { press(cur, i); need.has(i) ? need.delete(i) : need.add(i); hint = -1; AU.click(); ww.hurt(3); ww.draw(); if (cur.every((v2, j) => v2 === target[j])) ww.complete(true); };

  /* ===== 5. path reconnection (pipes) ===== */
  pipes(k) {
    const W = 7, H = 5;
    const r0 = ri(0, H - 1), r1 = ri(0, H - 1);
    // random self-avoiding walk from (0,r0) to (W-1,r1)
    let path = null;
    for (let tries = 0; tries < 400 && !path; tries++) {
      const vis = new Set(), p = [[0, r0]]; vis.add(`0,${r0}`);
      let ok = false;
      for (let st = 0; st < 60; st++) {
        const [x, y] = p[p.length - 1];
        if (x === W - 1 && y === r1) { ok = true; break; }
        const opts = [[1, 0], [0, 1], [0, -1], [-1, 0]].map(([dx, dy]) => [x + dx, y + dy]).filter(([a, b]) => a >= 0 && a < W && b >= 0 && b < H && !vis.has(`${a},${b}`));
        if (!opts.length) break;
        const w8 = opts.map(([a]) => a > x ? 2.2 : a < x ? .35 : 1); let s = Math.random() * w8.reduce((a, b) => a + b), pi = 0; while ((s -= w8[pi]) > 0) pi++;
        const nx = opts[pi]; vis.add(`${nx[0]},${nx[1]}`); p.push(nx);
      }
      if (ok && p.length >= 11) path = p;
    }
    const D = { N: 1, E: 2, S: 4, W: 8 };
    const dirTo = (a, b) => b[0] > a[0] ? D.E : b[0] < a[0] ? D.W : b[1] > a[1] ? D.S : D.N;
    const grid = []; for (let i = 0; i < W * H; i++) grid.push({ m: pick([5, 10, 3, 6, 12, 9, 7, 14]), node: 0 });
    path.forEach((c, i) => {
      const m = (i === 0 ? D.W : dirTo(c, path[i - 1])) | (i === path.length - 1 ? D.E : dirTo(c, path[i + 1]));
      grid[c[1] * W + c[0]].m = m; grid[c[1] * W + c[0]].sol = m;
    });
    // memory nodes along the path (count = recovered fragments, rest are "missing")
    const nodeIdx = [2, 4, 6, 8].map(n => Math.min(path.length - 2, Math.floor(path.length * n / 10)));
    nodeIdx.forEach((pi, j) => { const c = path[pi]; grid[c[1] * W + c[0]].node = j < G.mem ? 1 : 2; });
    const rot = m => ((m << 1) | (m >> 3)) & 15;
    grid.forEach(g => { const n = ri(1, 3); for (let i = 0; i < n; i++) g.m = rot(g.m); });
    pzFrame(k, {
      title: '経路復元', w: 760, h: 620,
      help: 'ユーザー「mio」から復元ポイントまでの経路が途切れています。\nタイルをクリックして回転させ、左の端から右の端までをつないでください。\n経路の上の光る点は、これまでに復元できた記憶の断片です。',
      auto: async ww => { grid.forEach(g => { if (g.sol) g.m = g.sol; }); ww.draw(); await sleep(300); },
      build: (ww, B) => {
        B.innerHTML = `<div class="pipes"><div class="end" style="transform:translateY(${(r0 - (H - 1) / 2) * 66}px)">${icon('user')}<br>mio ▶</div><div class="pg" style="grid-template-columns:repeat(${W},64px)"></div><div class="end" style="transform:translateY(${(r1 - (H - 1) / 2) * 66}px)">${icon('restore')}<br>▶ 04:03</div></div>`;
        const PG = $('.pg', B);
        const flow = () => {
          const lit = new Set(); const st = [[0, r0, D.W]];
          while (st.length) {
            const [x, y, from] = st.pop(); if (x < 0 || x >= W || y < 0 || y >= H) continue;
            const i = y * W + x; const g = grid[i]; if (!(g.m & from) || lit.has(i)) continue; lit.add(i);
            if (g.m & D.N) st.push([x, y - 1, D.S]); if (g.m & D.S) st.push([x, y + 1, D.N]); if (g.m & D.E) st.push([x + 1, y, D.W]); if (g.m & D.W) st.push([x - 1, y, D.E]);
          }
          const end = lit.has(r1 * W + W - 1) && (grid[r1 * W + W - 1].m & D.E);
          return { lit, end };
        };
        ww.draw = () => {
          const { lit, end } = flow(); PG.innerHTML = '';
          grid.forEach((g, i) => {
            const on = lit.has(i), col = on ? '#9fd0ff' : '#5c6b7a';
            const seg = [[D.N, '32,32 32,0'], [D.E, '32,32 64,32'], [D.S, '32,32 32,64'], [D.W, '32,32 0,32']].filter(([b]) => g.m & b).map(([, pts]) => `<polyline points="${pts}" stroke="${col}" stroke-width="10" stroke-linecap="square"/>`).join('');
            const node = g.node === 1 ? `<circle cx="32" cy="32" r="11" fill="${on ? '#e8f4ff' : '#9fb4c8'}" stroke="#0b0f14" stroke-width="2"/><circle cx="32" cy="32" r="5" fill="${on ? '#5fa8e8' : '#3b4652'}"/>` : g.node === 2 ? `<rect x="22" y="22" width="20" height="20" fill="#2a1a1a" stroke="#7a3a3a" stroke-width="2"/><text x="32" y="37" font-size="9" fill="#c86a6a" text-anchor="middle" font-family="monospace">404</text>` : `<circle cx="32" cy="32" r="6" fill="${col}"/>`;
            const d = el('div', 'p', `<svg viewBox="0 0 64 64">${seg}${node}</svg>`);
            d.onclick = () => { g.m = rot(g.m); AU.click(); ww.hurt(1.4); ww.draw(); };
            PG.appendChild(d);
          });
          const L = $$('.end', B);
          L[0].style.opacity = 1; L[1].style.opacity = end ? 1 : .45;
          if (end) ww.complete(true);
        };
        ww.draw();
        PZ._solve = () => { grid.forEach(g => { if (g.sol) g.m = g.sol; }); ww.draw(); };
      },
    });
  },
};

const MOJI = '縺繧繝譁蟄繹鬮荳蜑謾ｮ■□▓▒░\uFFFD';
function garble(text, k = .5, seed = 404) {
  const R = seeded(seed);
  return [...text].map(c => (c === '\n' ? c : R() < k ? MOJI[Math.floor(R() * MOJI.length)] : c)).join('');
}

const GHOST = {
  x: 640, y: 400,
  show(x, y) { this.x = x; this.y = y; const g = $('#ghostcur'); g.style.display = 'block'; g.style.left = x + 'px'; g.style.top = y + 'px'; },
  hide() { $('#ghostcur').style.display = 'none'; },
  move(x, y, ms = 900) {
    const sx = this.x, sy = this.y, t0 = performance.now(), g = $('#ghostcur');
    return new Promise(res => {
      const f = now => {
        const k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 3);
        // slightly hesitant, human-like path
        this.x = sx + (x - sx) * e + Math.sin(k * 9) * 3 * (1 - k); this.y = sy + (y - sy) * e;
        g.style.left = this.x + 'px'; g.style.top = this.y + 'px';
        if (k < 1) requestAnimationFrame(f); else res();
      };
      requestAnimationFrame(f);
    });

/* =========================================================
   HAUNT — the anomaly director
   Every effect here points at the same three truths the ending needs:
     1. Mio gave her name at 04:04 and is being erased everywhere.
     2. "404" is not an error code. It is a name — the thing's own name.
     3. It has noticed the person at the keyboard. You are next.
   Frequency, scale and kind of anomaly are set by chapter (G.ch 1..5).
   ========================================================= */
const HAUNT = {
  iv: 0, next: 0, lastInput: 0, idle: false, ptr: { x: 640, y: 400 }, trail: [], mirrorUntil: 0,
  clockOv: null, eyeRaf: 0, recent: [], lastCh: -1, lastReply: 0, phantomHide: 0, sessionT0: 0,

  st() { return !G || G.flags.ending ? 0 : G.ch; },
  now() { return performance.now(); },
  real() { const d = new Date(); return { hh: String(d.getHours()).padStart(2, '0'), mm: String(d.getMinutes()).padStart(2, '0'), ss: String(d.getSeconds()).padStart(2, '0'), d }; },

  /* ---------- lifecycle ---------- */
  init() {
    this.lastInput = this.now();
    const mark = () => { const n = this.now(); if (this.idle) this.back(n - this.lastInput); this.lastInput = n; this.idle = false; };
    addEventListener('pointerdown', mark, true);
    addEventListener('keydown', mark, true);
    addEventListener('pointermove', e => { const p = toScreen(e.clientX, e.clientY); this.ptr = p; this.trail.push({ t: this.now(), x: p.x, y: p.y }); if (this.trail.length > 90) this.trail.shift(); mark(); }, true);
  },
  start() {
    this.stop();
    this.ensure();
    this.sessionT0 = this.now(); this.lastInput = this.now();
    this.next = this.now() + this.gap() * 1000;
    this.iv = setInterval(() => this.tick(), 1000);
    this.eyeLoop();
    this.sync();
  },
  stop() {
    clearInterval(this.iv); cancelAnimationFrame(this.eyeRaf); this.eyeRaf = 0;
    const c = $('#wallfx'); if (c) c.getContext('2d').clearRect(0, 0, c.width, c.height);
    this.mirrorUntil = 0; this.clockOv = null; this.lastCh = -1;
  },
  /* older saves: add the files this layer relies on */
  ensure() {
    if (!G) return;
    G.log = G.log || []; G.hist = G.hist || [];
    if (!G.fs.img1123) G.fs.img1123 = { id: 'img1123', p: 'pics', name: 'IMG_1123.bmp', t: 'img', src: 'door', cond: 'img1123', keep: 1, size: '404 KB', date: '2004/11/23 04:04' };
    if (!G.fs.evlog) G.fs.evlog = { id: 'evlog', p: 'sysdir', name: 'event.log', t: 'txt', ro: 1, keep: 1, size: '12 KB', date: '2004/11/23 04:04' };
    if (!G.fs.anata) G.fs.anata = { id: 'anata', p: 'docs', name: 'あなた.txt', t: 'txt', ro: 1, keep: 1, cond: 'anata', size: '1 KB', date: '2004/11/23 04:04' };
  },
  /* chapter changed (or loaded) */
  sync() {
    const s = this.st();
    AU.hiss([0, .004, .006, .011, .017, .026][s] || 0);
    if (!G || s === this.lastCh) return;
    this.lastCh = s;
    const once = (k, fn) => { if (!G.flags['h_st' + k]) { G.flags['h_st' + k] = 1; fn(); } };
    if (s >= 3) once(3, () => this.log('警告', 'ユーザー プロファイル {M} に、2 つ目のセッションが接続しています'));
    if (s >= 4) once(4, () => { this.log('エラー', 'ユーザー プロファイル {M} の一部が見つかりません'); G.flags.img1123 = 1; this.log('情報', 'ユーザー THE USER が IMG_1123.bmp を保存しました'); REFRESH(); });
    if (s >= 5) once(5, () => { G.flags.anata = 1; this.log('情報', 'ユーザー「あなた」のプロファイルを作成しました'); REFRESH(); });
  },
  gap() {
    const T = { 1: [80, 120], 2: [50, 75], 3: [30, 46], 4: [18, 30], 5: [11, 19] }[this.st()] || [999, 999];
    return rnd(T[0], T[1]) * (1 - (G ? G.corrupt : 0) / 260);
  },
  tick() {
    const s = this.st(); if (!s || document.hidden) return;
    const n = this.now();
    this.clockTick(n);
    if (STORY.busy) return;
    if (s >= 2 && !this.idle && n - this.lastInput > 50000) { this.idle = true; this.onIdle(); }
    if (WM.get('pz')) return; // repair screens are haunted separately
    if (SCARE.lock) return;
    SCARE.tick();
    if (n >= this.next) { this.next = n + this.gap() * 1000; if (!this.idle) this.fire(); }
  },
  fire(only) {
    const s = this.st();
    const pool = EFFECTS.filter(e => s >= e.min && s <= (e.max || 9) && (!e.once || !G.flags['h_' + e.id]) && (!e.cond || e.cond(s)) && !this.recent.includes(e.id) && (!only || only.includes(e.id)));
    if (!pool.length) return;
    let r = Math.random() * pool.reduce((a, e) => a + e.w, 0), i = 0;
    while ((r -= pool[i].w) > 0) i++;
    const e = pool[i];
    if (e.once) G.flags['h_' + e.id] = 1;
    this.lastFire = this.now(); G.hist = G.hist || []; G.hist.push({ k: 'fx', id: e.id, ch: s, at: Date.now() }); if (G.hist.length > 300) G.hist.splice(0, G.hist.length - 300);
    this.recent.push(e.id); if (this.recent.length > 3) this.recent.shift();
    try { e.run(s); } catch (err) { console.warn('haunt', e.id, err); }
  },

  /* ---------- event log (rewritten as the story advances) ---------- */
  stamp() { const r = this.real(); const c = STORY.clockText(); return `2004/11/23 ${/^\d\d:\d\d$/.test(c) ? c : '04:04'}:${r.ss}`; },
  log(lv, m, act) {

  logText() {
    const M = this.mio();
    const row = (d, lv, m) => `${d}  ${(lv + '　　').slice(0, 3)}  ${m}`;
    const head = [
      'PaneOS イベント ログ　　C:\\PANE\\SYSTEM\\event.log', '─'.repeat(52), '日付 / 時刻            種類   内容', '',
      row('2004/11/22 23:51:02', '情報', `ユーザー ${M} が IMG_1122.bmp を保存しました`),
      row('2004/11/22 23:58:40', '情報', `ユーザー ${M} が navigator.exe を起動しました`),
      row('2004/11/23 03:57:12', '警告', '不明なページ 404.htm を受信しました（送信元：なし）'),
      row('2004/11/23 04:01:37', '情報', `ユーザー ${M} がフォルダ「＿」を作成しました`),
      row('2004/11/23 04:02:55', '情報', `ユーザー ${M} が voice_1123.wav を保存しました`),
      row('2004/11/23 04:03:00', '情報', '復元ポイントを作成しました'),
      row('2004/11/23 04:04:04', 'エラー', `ユーザー ${M} の名前を 404.htm に送信しました`),
      row('2004/11/23 04:04:04', 'エラー', `ユーザー ${M} が見つかりません`),

  anataText() {
    const acts = (G.log || []).filter(e => e.act).filter((e, i, a) => !i || a[i - 1].act !== e.act).slice(-9);

    if (r.btn === 0 && (r.value || '').trim()) { FX.glitch(500, .8); AU.thud(); G.corrupt = Math.min(100, G.corrupt + 25); G.flags.gaveName = (G.flags.gaveName || 0) + 1; HAUNT.log('エラー', 'ユーザー アカウント：名前を受信しました → 404'); TRAY.tick(); setTimeout(() => IM.say('ありがとう'), 1500); if (G.corrupt >= 100) setTimeout(() => STORY.ending('notfound'), 1800); }
    else HAUNT.log('情報', 'ユーザーの追加は取り消されました');
  } },
  { id: 'openAnata', min: 5, w: 3, once: 1, run: () => { FS.open('anata'); } },
  { id: 'mass', min: 5, w: 3, run: () => { HAUNT.fire(['labelName', 'localWin']); setTimeout(() => HAUNT.fire(['iconSwap', 'title', 'microShift']), 380); setTimeout(() => HAUNT.clockFlash('──:──', 600), 700); } },
];

/* strange system errors: each is shown once, each says something true */
const ERRS = [
  { s: 3, t: 'PaneOS', m: '"0x00000404" の命令が "0x00000404" のメモリを参照しました。\nメモリが "found" になることはできませんでした。\n\nプログラムを終了するには [OK] をクリックしてください。', log: 'アプリケーション エラー 0x00000404' },
  { s: 3, t: 'ネットワーク', ico: 'warn', m: '名前の解決に失敗しました。\n\nホスト名：mio\n状態：見つかりません (404)', log: '名前 mio を解決できませんでした' },
  { s: 4, t: 'ログオン', ico: 'warn', m: 'このコンピュータには、現在 2 人のユーザーがログオンしています。\n\n　＿＿＿（切断）\n　あなた（コンソール）\n\n続行すると、ほかのユーザーの作業内容が失われる可能性があります。', log: 'セッション 2 を検出しました：あなた' },
  { s: 4, t: 'ユーザー アカウント', m: 'ユーザー名またはパスワードが正しくありません。\n\nユーザー名：＿＿＿\nドメイン：PANE', log: 'ログオン失敗：＿＿＿' },
  { s: 5, t: 'PaneOS', ico: 'info', m: 'ユーザー「あなた」のプロファイルを準備しています...\n\nしばらくお待ちください。', log: 'プロファイルの準備：あなた' },
];
/* things it says once it is online — it knows your time */
const TALK = [
  { s: 3, f: () => { const r = HAUNT.real(); return `いま　${r.hh}:${r.mm}　でしょ`; } },
  { s: 3, f: () => 'こっちは　ずっと　4じ4ふん' },
  { s: 4, f: () => `もう　${Math.max(1, Math.round((HAUNT.now() - HAUNT.sessionT0) / 60000))}ぷんも　いるね` },
  { s: 4, f: () => 'あなたの　へやは　あかるい？' },
  { s: 5, f: () => 'わたしの　なまえ　しってる？' },
  { s: 5, f: () => 'もうすぐ　あなたの　ばん' },
];

/* =========================================================
   SCARE — jump scares featuring THE USER
   - Every pattern is used at most once per playthrough (imgSwap twice, never
     back to back), so nothing repeats.
   - Triggers: chapter (director), progress (after story events settle) and
     the player's own actions (opening images, returning from idle, logs...).
   - Spacing: never within 25 s of a story event, never while repairing,
     never twice within the chapter's cool-down; history saved in G.hist.
   - Every pattern ends within ~2.5 s and restores the screen; only the STOP
     screen blocks input, and only for its 2.4 s.
   Settings: SET.scare 2 = standard, 1 = mild (no flashed images), 0 = off.
   ========================================================= */
const SCARE = {
  lock: false, last: 0, cv: null,
  /* which patterns each chapter may use, by trigger */
  TABLE: {
    director: { 3: ['notice', 'blackout'], 4: ['flash', 'collapse', 'multi', 'door', 'wallSwap', 'notice', 'blackout'], 5: ['stop', 'camera', 'flash', 'collapse', 'multi', 'wallSwap'] },
    image: { 3: ['imgSwap'], 4: ['imgSwap'], 5: ['imgSwap'] },
    idleBack: { 4: ['blackout'], 5: ['blackout', 'flash'] },
    log: { 4: ['collapse'], 5: ['multi'] },
  },
  ctx() { if (!this.cv) this.cv = $('#scarec'); return this.cv.getContext('2d'); },
  clear() { const x = this.ctx(); x.clearRect(0, 0, SW, SH); $('#scare').classList.remove('block'); $('#scare .stop').classList.add('hidden'); },
  hist() { return (G.hist = G.hist || []); },
  used(id) { return this.hist().filter(h => h.k === 'scare' && h.id === id).length; },
  spacing() { return ({ 3: 150, 4: 95, 5: 65 }[G.ch] || 1e9) * 1000; },
  ok() {
    return SET.scare > 0 && G && !G.flags.ending && !STORY.busy && !this.lock && !WM.get('pz') && !document.hidden
      && performance.now() - (STORY.quietSince || 0) > 25000 && performance.now() - this.last > this.spacing() && performance.now() - (HAUNT.lastFire || 0) > 4000;
  },
  eligible(id, arg) {
    const max = id === 'imgSwap' ? 2 : 1;
    if (this.used(id) >= max) return false;
    const h = this.hist().filter(x => x.k === 'scare'); if (h.length && h[h.length - 1].id === id) return false;
    const c = P_COND[id]; return !c || c(arg);
  },
  consider(trigger, arg) {
    if (!this.ok()) return false;
    const list = (this.TABLE[trigger] || {})[G.ch] || [];
    const cand = list.filter(id => this.eligible(id, arg));
    if (!cand.length) return false;
    this.play(trigger === 'director' ? pick(cand) : cand[0], arg);
    return true;
  },
  tick() { // called each second by HAUNT
    if (!G || G.ch < 3 || !this.ok()) return;
    if (Math.random() < (G.ch >= 5 ? .05 : .03)) this.consider('director');
  },
  async play(id, arg) {
    this.lock = true;
    this.hist().push({ k: 'scare', id, ch: G.ch, at: Date.now() }); if (G.hist.length > 300) G.hist.splice(0, G.hist.length - 300);
    HAUNT.log('エラー', P_LOG[id] || 'THE USER');
    try { await P[id](arg); } catch (e) { console.warn('scare', id, e); }
    this.clear(); FX.dim(0, 200);
    this.last = performance.now(); this.lock = false;
  },
  /* draw a canvas fitted into a rect on the overlay */
  put(src, r, alpha = 1, cover = true) {
    const x = this.ctx(); const s = cover ? Math.max(r.w / src.width, r.h / src.height) : Math.min(r.w / src.width, r.h / src.height);
    const w = src.width * s, h = src.height * s; x.save(); x.beginPath(); x.rect(r.x, r.y, r.w, r.h); x.clip(); x.globalAlpha = alpha;
    x.drawImage(src, r.x + (r.w - w) / 2, r.y + (r.h - h) / 2, w, h); x.restore();
  },
  black(a = 1) { const x = this.ctx(); x.fillStyle = `rgba(0,0,0,${a})`; x.fillRect(0, 0, SW, SH); },
  mild() { return SET.scare === 1; },
};

const P_COND = {
  imgSwap: () => !!WM.get('viewer'),
  multi: () => HAUNT.visWins().length >= 2,
  door: () => !!G.fs.img1123 && G.flags.img1123,
};
const P_LOG = {
  flash: 'ディスプレイ：不明な画像を表示しました（ソース：THE USER）',
  imgSwap: '画像ビューア：表示中の画像が書き換えられました',
  collapse: 'デスクトップ ウィンドウ マネージャが応答していません',
  stop: 'STOP 0x00000404 USER_NOT_FOUND',
  blackout: 'ディスプレイの信号が失われました（0.0 秒前に、だれかが前を通りました）',
  notice: 'ユーザー THE USER がログオンしました（セッション 2）',
  multi: 'すべてのウィンドウの所有者が THE USER に変更されました',
  camera: 'PaneCam：カメラを検出しました（許可されていません）',
  door: '画像ビューア：IMG_1123.bmp を開きました（要求元：THE USER）',
  wallSwap: 'デスクトップ：壁紙が一時的に置き換えられました',
};

/* ---------- the patterns ---------- */
const P = {
  /* THE USER stands in front of everything for a heartbeat */
  async flash() {
    AU.dropout(420); await sleep(420);
    if (!SCARE.mild()) { SCARE.black(.92); SCARE.put(IMG.art('body', { w: 300, h: 900 }), { x: SW / 2 - 190, y: 20, w: 380, h: 760 }, .95, false); }
    AU.sting('hit'); FX.glitch(180, .8, false);
    await sleep(SCARE.mild() ? 60 : 120); SCARE.clear(); FX.local(SW / 2 - 200, 0, 400, SH, 300, 1.2, null, true);
    await sleep(300);
  },
  /* the picture you are looking at is, for a moment, not the picture */
  async imgSwap() {
    const w = WM.get('viewer'); if (!w) return;
    const r = HAUNT.rectOf($('.view', w.body));
    await sleep(rnd(200, 900));
    if (!SCARE.mild()) SCARE.put(IMG.art(pick(['face', 'posture'])), r, 1);
    AU.sting('snap'); FX.el(w.body, 200);
    await sleep(140); SCARE.clear(); FX.local(r.x, r.y, r.w, r.h, 220, 1, null, true);
  },
  /* the desktop comes apart, goes dark, and something is in the dark */
  async collapse() {
    AU.sting('tear'); FX.glitch(600, 1.2, false);
    const ws = HAUNT.visWins(); ws.forEach(w => { w.el.style.translate = `${ri(-40, 40)}px ${ri(-24, 24)}px`; w.el.classList.add('lg'); });
    await sleep(480);
    SCARE.black(1); if (!SCARE.mild()) SCARE.put(IMG.art('posture'), { x: SW / 2 - 300, y: 60, w: 600, h: 680 }, .9);
    await sleep(90); SCARE.clear(); SCARE.black(1);
    await sleep(320);
    ws.forEach(w => { w.el.style.translate = ''; w.el.classList.remove('lg'); });
    SCARE.clear(); FX.local(0, 0, SW, 40, 260, 1, null, true);
  },
  /* a system screen that should not exist */
  async stop() {
    const S = $('#scare .stop'); $('#scare').classList.add('block'); S.classList.remove('hidden');
    S.textContent = `*** STOP: 0x00000404 (0x00000000, 0x00000404, 0x00000000, 0x00000000)\nUSER_NOT_FOUND\n\nユーザー「＿＿＿」は見つかりませんでした。\n代わりのユーザーを検索しています...\n\n　　見つかりました：　あなた\n\n\n物理メモリのダンプを開始しています\n物理メモリのダンプが完了しました\n\nシステム管理者に連絡するまで、そこから動かないでください。`;
    AU.ambOn(false); AU.sting('stop');
    if (!SCARE.mild()) { const x = SCARE.ctx(); x.globalAlpha = .12; x.drawImage(IMG.art('crumble', { w: 400, h: 520 }), SW - 470, SH - 600); x.globalAlpha = 1; }
    await sleep(1900);
    S.textContent = '再起動しています...'; await sleep(550);
    S.classList.add('hidden'); SCARE.clear(); AU.ambOn(true); FX.glitch(220, .6, false);
  },
  /* the screen loses its signal; when it comes back, it is standing there */
  async blackout() {
    AU.ambOn(false); FX.dim(1, 90); await sleep(1100);
    if (!SCARE.mild()) { SCARE.black(1); const x = SCARE.ctx(), gr = x.createRadialGradient(SW / 2, SH / 2, 40, SW / 2, SH / 2, 620); gr.addColorStop(0, '#3a3f45'); gr.addColorStop(1, '#050607'); x.fillStyle = gr; x.fillRect(0, 0, SW, SH); IMG.theUser(x, SW / 2 + ri(-140, 140), SH + 60, 900, { alpha: .92, face: .8, tilt: rnd(-.8, .8) }); }
    FX.dim(0, 0); AU.sting('breath');
    await sleep(85); SCARE.clear(); AU.ambOn(true);
  },
  /* a notification window that will not simply close */
  async notice() {
    const face = IMG.art('face', { w: 72, h: 96 });
    let n = 0;
    const w = WM.open({
      title: 'PaneOS', icon: 'userx', w: 400, h: 200, x: SW - 420, y: DESK_H - 220, resizable: false, silent: true,
      build: ww => {
        ww.body.innerHTML = `<div class="ntc"><canvas width="72" height="96"></canvas><div style="flex:1">ユーザー「THE USER」がログオンしました。<br><small style="color:#58626d">セッション 2：コンソール（あなたの すぐ うしろ）</small></div></div><div style="display:flex;justify-content:flex-end;padding:0 10px 10px"><button class="btn primary">OK</button></div>`;
        $('canvas', ww.body).getContext('2d').drawImage(face, 0, 0);
        const b = $('button', ww.body);
        b.onclick = () => { if (++n === 1) { b.textContent = 'みつけた'; AU.imOdd(); FX.el(ww.el, 260); WM.glide(ww, ww.x - 30, ww.y - 18, 400); } else WM.close(ww, true); };
      },
    });
    AU.imOdd();
    setTimeout(() => { if (WM.get(w.id)) WM.close(w, true); }, 14000);
    await sleep(600);
  },
  /* every window, at once */
  async multi() {
    const ws = HAUNT.visWins(); const t0 = ws.map(w => w.title);
    AU.sting('screech');
    ws.forEach(w => { WM.setTitle(w, 'THE USER'); HAUNT.scramble(w.body, 900, .55); FX.el(w.el, 500); });
    const one = pick(ws);
    if (!SCARE.mild()) SCARE.put(IMG.art('face'), HAUNT.rectOf(one.body), .9);
    await sleep(160); SCARE.clear();
    await sleep(740);
    ws.forEach((w, i) => { if (WM.get(w.id) && w.title === 'THE USER') WM.setTitle(w, t0[i]); });
  },
  /* a camera you do not have turns on */
  async camera() {
    let raf = 0, t0 = performance.now();
    const w = WM.open({
      title: 'PaneCam - ライブ', icon: 'viewer', w: 440, h: 380, x: ri(380, 700), y: ri(60, 200), resizable: false,
      onClosed: () => cancelAnimationFrame(raf),
      build: ww => {
        ww.body.innerHTML = `<div class="cam"><canvas width="420" height="300"></canvas><div class="bar2"><span>● REC</span><span>USB ビデオ デバイス（ドライバなし）</span></div></div>`;
        const cv = $('canvas', ww.body), x = cv.getContext('2d'), seed = ri(1, 1e9);
        const loop = now => {
          raf = requestAnimationFrame(loop); const t = (now - t0) / 1000;
          const g = x.createRadialGradient(210, 160, 10, 210, 160, 300); g.addColorStop(0, '#2a2e33'); g.addColorStop(1, '#050607'); x.fillStyle = g; x.fillRect(0, 0, 420, 300);
          x.fillStyle = '#0b0d10'; x.fillRect(0, 230, 420, 70); x.fillStyle = 'rgba(160,170,180,.08)'; x.fillRect(300, 30, 70, 120);
          if (t > 2.1 && !SCARE.mild()) IMG.theUser(x, 120 + Math.min(1, (t - 2.1) / .9) * 60, 300 + Math.min(1, (t - 2.1) / .9) * 120, 240 + Math.min(1, (t - 2.1) / .9) * 220, { seed, alpha: Math.min(.85, (t - 2.1) * 1.4), face: .45, tilt: .5, ghost: false });
          const id = x.getImageData(0, 0, 420, 300), d = id.data; for (let i = 0; i < d.length; i += 4) { const v = (Math.random() - .5) * 40; d[i] += v; d[i + 1] += v; d[i + 2] += v; } x.putImageData(id, 0, 0);
          x.fillStyle = '#e0e6ec'; x.font = '12px monospace'; x.fillText(new Date().toLocaleTimeString('ja-JP'), 10, 18);
        };
        raf = requestAnimationFrame(loop);
      },
    });
    AU.tone(880, .05, 'square', .02);
    await sleep(2300); AU.sting('breath');
    await sleep(1100);
    if (WM.get(w.id)) { FX.el(w.el, 250); AU.sting('snap'); await sleep(220); WM.close(w, true); }
  },
  /* a photo of a doorway; each time it opens, it is closer */
  async door() {
    APPS.viewer('img1123'); await sleep(700);
    const v = WM.get('viewer'); if (!v) return; const r = HAUNT.rectOf($('.view', v.body));
    if (!SCARE.mild()) for (let i = 0; i <= 10; i++) { SCARE.ctx().clearRect(0, 0, SW, SH); SCARE.put(IMG.art('door', { zoom: 1 + i * .14, tear: .4, dy: i * 6 }), r, 1); await sleep(80); }
    SCARE.black(1); AU.sting('hit'); await sleep(150);
  },
  /* the wallpaper is replaced for a moment */
  async wallSwap() {
    const c = $('#wallc'), x = c.getContext('2d');
    AU.dropout(250); await sleep(250);
    if (!SCARE.mild()) { const a = IMG.art('land', { w: 640, h: 382 }); x.drawImage(a, 0, 0, c.width, c.height); }
    FX.local(0, 0, SW, DESK_H, 240, 1.3, null, true); AU.sting('snap');
    await sleep(170); IMG.wallpaper(c, STORY.wallStage());
  },
};
