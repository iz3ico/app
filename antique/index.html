<style>
:root{--gold:#c9a764;--gold2:#ead6a6;--dim:#a89874;--ink:#0d0907}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#eadcc0;font-family:'Shippori Mincho','Cormorant Garamond',serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hide{display:none!important}
.layer{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20}
.en{font-family:'Cinzel',serif;letter-spacing:.28em;font-size:11px;color:var(--gold);text-transform:uppercase}
.btn{font-family:'Shippori Mincho',serif;font-size:15px;letter-spacing:.2em;color:#efe2c4;background:rgba(20,13,9,.55);border:1px solid rgba(201,167,100,.55);padding:12px 26px;min-width:230px;cursor:pointer;position:relative;transition:background .3s,border-color .3s,color .3s;outline:none}
.btn:hover,.btn:focus-visible{background:rgba(70,48,26,.6);border-color:var(--gold2);color:#fff6e0}
.btn small{display:block;font-family:'Cinzel',serif;font-size:9.5px;letter-spacing:.3em;color:var(--dim);margin-top:3px}
.panel{background:linear-gradient(180deg,rgba(26,18,12,.94),rgba(12,8,6,.94));border:1px solid rgba(201,167,100,.5);box-shadow:0 0 0 4px rgba(10,7,5,.92),0 0 0 5px rgba(201,167,100,.28),0 24px 70px rgba(0,0,0,.65);position:relative}
.panel:before,.panel:after{content:'✦';position:absolute;color:var(--gold);font-size:10px;top:-7px;left:50%;transform:translateX(-50%);background:#120c08;padding:0 6px}
.panel:after{top:auto;bottom:-7px}
/* loading */
#loading{background:#000;flex-direction:column;z-index:40;transition:opacity 1.2s}
#loading .t{font-family:'Cinzel',serif;font-size:22px;letter-spacing:.35em;color:var(--gold);margin-bottom:22px;text-align:center;padding-left:.35em}
#loading .bar{width:220px;height:1px;background:rgba(201,167,100,.2);overflow:hidden}
#loading .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,transparent,var(--gold2));transition:width .3s}
#loading .msg{margin-top:16px;font-size:13px;letter-spacing:.15em;color:var(--dim);min-height:1.4em}
#loading .err{margin-top:18px;color:#d98a7a;font-size:13px;max-width:80vw;text-align:center;line-height:1.7}
/* title */
#title{flex-direction:column;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 0%,rgba(0,0,0,.35) 55%,rgba(0,0,0,.8) 100%);transition:opacity 1s}
#title .pre{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;letter-spacing:.3em;color:var(--dim);margin-bottom:10px}
#title h1{margin:0;font-family:'Cinzel',serif;font-weight:400;font-size:clamp(30px,6.4vw,74px);letter-spacing:.2em;padding-left:.2em;text-align:center;line-height:1.15;background:linear-gradient(180deg,#f6e7c0 10%,#c9a764 55%,#8a6a3a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 14px rgba(0,0,0,.8))}
#title .jp{margin-top:12px;font-size:clamp(14px,2vw,18px);letter-spacing:.6em;padding-left:.6em;color:#e6d6b2;text-shadow:0 2px 10px #000}
#title .orn{width:min(420px,70vw);height:22px;margin:22px 0 26px;opacity:.85}
#title .menu{display:flex;flex-direction:column;gap:12px;align-items:center}
#title .foot{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.2em;color:rgba(214,196,160,.6);padding:0 16px}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#reticle{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(240,225,190,.75);box-shadow:0 0 4px rgba(0,0,0,.8);transition:all .25s}
#reticle.on{width:22px;height:22px;margin:-11px 0 0 -11px;background:transparent;border:1px solid rgba(234,214,166,.85);box-shadow:0 0 8px rgba(234,214,166,.35)}
#prompt{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .3s;white-space:nowrap}
#prompt.on{opacity:1}
#prompt .nm{font-size:16px;letter-spacing:.2em;color:#f3e6c8;text-shadow:0 2px 8px #000,0 0 2px #000}
#prompt .k{display:inline-block;margin-top:7px;font-size:12px;letter-spacing:.2em;color:var(--gold2);text-shadow:0 1px 6px #000}
#prompt .k b{display:inline-block;border:1px solid rgba(234,214,166,.7);padding:1px 7px;margin-right:8px;font-family:'Cinzel',serif;font-weight:400;font-size:11px}
#areaBanner{position:absolute;left:0;right:0;top:15%;text-align:center;opacity:0;transition:opacity 1.6s}
#areaBanner.on{opacity:1}
#areaBanner .a{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.5em;color:var(--gold);text-shadow:0 1px 8px #000}
#areaBanner .b{font-family:'Cinzel',serif;font-size:clamp(20px,3.4vw,34px);letter-spacing:.3em;padding-left:.3em;color:#f1e2bf;margin:6px 0;text-shadow:0 2px 16px #000,0 0 3px #000}
#areaBanner .c{font-size:14px;letter-spacing:.5em;padding-left:.5em;color:#e3d2ab;text-shadow:0 2px 10px #000}
#areaBanner .line{width:140px;height:1px;margin:10px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
#areaTag{position:absolute;left:18px;top:16px;font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:.32em;color:rgba(214,190,140,.75);text-shadow:0 1px 6px #000}
#areaTag span{display:block;font-family:'Shippori Mincho',serif;letter-spacing:.3em;font-size:11px;color:rgba(226,210,176,.7);margin-top:3px}
#btnMenu{pointer-events:auto;position:absolute;right:14px;top:12px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(201,167,100,.5);background:rgba(16,10,7,.45);color:var(--gold2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-size:12px;letter-spacing:.15em;color:rgba(230,214,180,.75);text-shadow:0 1px 6px #000;transition:opacity 1s;white-space:nowrap}
/* touch */
#touch{position:fixed;inset:0;z-index:11;pointer-events:none}
#stick{position:absolute;width:120px;height:120px;border-radius:50%;border:1px solid rgba(234,214,166,.35);background:radial-gradient(circle,rgba(30,20,12,.25),rgba(30,20,12,.05));transform:translate(-50%,-50%);opacity:0;transition:opacity .2s}
#stick.on{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(234,214,166,.25);border:1px solid rgba(234,214,166,.6)}
.tbtn{pointer-events:auto;position:absolute;border-radius:50%;border:1px solid rgba(234,214,166,.55);background:rgba(18,12,8,.5);color:#f0e2c2;font-family:'Shippori Mincho',serif;font-size:13px;letter-spacing:.1em;display:flex;align-items:center;justify-content:center;text-align:center}
#tInspect{right:22px;bottom:118px;width:74px;height:74px;font-size:15px;opacity:0;transform:scale(.8);transition:opacity .25s,transform .25s;pointer-events:none}
#tInspect.on{opacity:1;transform:scale(1);pointer-events:auto;border-color:var(--gold2);box-shadow:0 0 16px rgba(234,214,166,.3)}
#tRun{right:26px;bottom:34px;width:60px;height:60px;font-size:12px}
#tRun.on{background:rgba(110,80,40,.55)}
#tLook{left:26px;top:auto;bottom:34px;display:none}
/* inspect */
#inspect{position:fixed;left:28px;bottom:28px;max-width:420px;padding:20px 24px 18px;z-index:15;opacity:0;transform:translateY(12px);transition:opacity .5s,transform .5s;pointer-events:none}
#inspect.on{opacity:1;transform:none;pointer-events:auto}
#inspect .en{font-size:10px}
#inspect h2{margin:6px 0 10px;font-weight:600;font-size:21px;letter-spacing:.14em;color:#f4e6c6}
#inspect p{margin:0;font-size:14px;line-height:1.95;letter-spacing:.06em;color:#dccaa6}
#inspect .h{margin-top:12px;font-size:11px;letter-spacing:.15em;color:var(--dim);display:flex;justify-content:space-between;align-items:center;gap:12px}
#inspect .h button{pointer-events:auto;font-family:'Shippori Mincho',serif;font-size:12px;letter-spacing:.15em;color:#f0e2c2;background:rgba(40,28,18,.6);border:1px solid rgba(201,167,100,.5);padding:6px 14px;cursor:pointer}
/* menus */
.dlg{background:rgba(0,0,0,.45);z-index:30}
.dlg .panel{padding:30px 34px 28px;min-width:300px;max-width:min(560px,92vw);max-height:88vh;overflow:auto;text-align:center}
.dlg h3{margin:4px 0 18px;font-weight:400;font-size:20px;letter-spacing:.3em;color:#f2e4c4}
.dlg .col{display:flex;flex-direction:column;gap:11px;align-items:center}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid rgba(201,167,100,.14);text-align:left;font-size:14px;letter-spacing:.1em}
.row:last-of-type{border-bottom:none}
.row label{color:#e2d1ae}
.seg{display:flex;border:1px solid rgba(201,167,100,.45)}
.seg button{font-family:'Shippori Mincho',serif;background:transparent;border:none;color:#cdbb94;padding:6px 12px;font-size:13px;cursor:pointer;letter-spacing:.1em}
.seg button.on{background:rgba(201,167,100,.25);color:#fff4da}
input[type=range]{-webkit-appearance:none;appearance:none;width:150px;height:2px;background:rgba(201,167,100,.4);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#e6cf98;border:1px solid #7a5a2a;cursor:pointer}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#e6cf98;border:1px solid #7a5a2a}
.keys{text-align:left;font-size:14px;line-height:2.1;letter-spacing:.08em;color:#e0cfaa}
.keys b{display:inline-block;min-width:96px;font-family:'Cinzel',serif;font-weight:400;font-size:12px;letter-spacing:.12em;color:var(--gold2)}
.note{font-size:12px;color:var(--dim);letter-spacing:.1em;line-height:1.8;margin-top:12px}
#lockHint{position:fixed;left:50%;top:58%;transform:translateX(-50%);z-index:12;font-size:13px;letter-spacing:.2em;color:#eadcc0;text-shadow:0 1px 8px #000;pointer-events:none;transition:opacity .4s}
#fade{position:fixed;inset:0;background:#000;z-index:35;pointer-events:none;opacity:0;transition:opacity 1s}
@media (max-width:640px){
  #inspect{left:10px;right:10px;bottom:10px;max-width:none;padding:16px 18px 14px}
  #inspect h2{font-size:18px}
  #inspect p{font-size:13px;line-height:1.85}
  .btn{min-width:210px;padding:11px 20px}
  #areaTag{top:14px;left:14px}
}
</style>

<body>
<canvas id="c"></canvas>

<div id="loading" class="layer">
  <div class="t">THE ANTIQUE ROOM</div>
  <div class="bar"><i id="loadBar"></i></div>
  <div class="msg" id="loadMsg">扉の鍵を探しています…</div>
  <div class="err hide" id="loadErr"></div>
</div>

<div id="title" class="layer hide">
  <div class="pre">— a room where time stood still —</div>
  <h1>THE ANTIQUE<br>ROOM</h1>
  <div class="jp">時の止まった洋館</div>
  <svg class="orn" viewBox="0 0 420 22" fill="none" stroke="#c9a764" stroke-width="1"><path d="M0 11H170M250 11H420"/><path d="M170 11c10-9 20-9 26 0c6 9 16 9 14 0c-2-6-10-6-10 0M250 11c-10-9-20-9-26 0c-6 9-16 9-14 0c2-6 10-6 10 0"/><circle cx="210" cy="11" r="3" fill="#c9a764"/></svg>
  <div class="menu">
    <button class="btn" id="bStart">扉をひらく<small>ENTER</small></button>
    <button class="btn" id="bHow">操作方法<small>CONTROLS</small></button>
    <button class="btn" id="bSet">設定<small>SETTINGS</small></button>
  </div>
  <div class="foot">ゆっくり歩き、眺め、見つけてください。</div>
</div>

<div id="hud" class="hide">
  <div id="areaTag"></div>
  <div id="areaBanner"><div class="a"></div><div class="b"></div><div class="line"></div><div class="c"></div></div>
  <div id="reticle"></div>
  <div id="prompt"><div class="nm"></div><div class="k"><b>E</b>鑑賞する</div></div>
  <div id="hint"></div>
  <button id="btnMenu" aria-label="メニュー">≡</button>
</div>

<div id="touch" class="hide">
  <div id="stick"><div id="knob"></div></div>
  <button class="tbtn" id="tInspect">鑑賞</button>
  <button class="tbtn" id="tRun">歩く</button>
</div>

<div id="inspect" class="panel">
  <div class="en" id="inEn"></div>
  <h2 id="inName"></h2>
  <p id="inDesc"></p>
  <div class="h"><span id="inHint">ドラッグで眺める</span><button id="inBack">もどる</button></div>
</div>

<div id="lockHint" class="hide">クリックで視点を動かせます</div>

<div id="menu" class="layer dlg hide"><div class="panel">
  <div class="en">pause</div><h3>ひと休み</h3>
  <div class="col">
    <button class="btn" id="mResume">再開する<small>RESUME</small></button>
    <button class="btn" id="mSet">設定<small>SETTINGS</small></button>
    <button class="btn" id="mHow">操作方法<small>CONTROLS</small></button>
    <button class="btn" id="mQuit">館を出る<small>RETURN TO TITLE</small></button>
  </div>
</div></div>

<div id="settings" class="layer dlg hide"><div class="panel">
  <div class="en">settings</div><h3>設定</h3>
  <div class="row"><label>画質</label><div class="seg" id="sQuality"><button data-v="low">低</button><button data-v="mid">中</button><button data-v="high">高</button></div></div>
  <div class="row"><label>絵画フィルター</label><div class="seg" id="sPaint"><button data-v="1">オン</button><button data-v="0">オフ</button></div></div>
  <div class="row"><label>視点の感度</label><input type="range" id="sSens" min="0.3" max="2.2" step="0.05"></div>
  <div class="row"><label>歩く速さ</label><input type="range" id="sSpeed" min="0.5" max="1.8" step="0.05"></div>
  <div class="row"><label>歩くときの揺れ</label><div class="seg" id="sBob"><button data-v="1">オン</button><button data-v="0">オフ</button></div></div>
  <div class="row"><label>音</label><div class="seg" id="sSound"><button data-v="1">オン</button><button data-v="0">オフ</button></div></div>
  <div class="row"><label>音量</label><input type="range" id="sVol" min="0" max="1" step="0.05"></div>
  <div class="note" id="sNote">画質「高」では窓からの光が本物の影を落とします。</div>
  <div class="col" style="margin-top:16px"><button class="btn" id="sBack">もどる</button></div>
</div></div>

<div id="howto" class="layer dlg hide"><div class="panel">
  <div class="en">controls</div><h3>操作方法</h3>
  <div class="keys" id="howKeys"></div>
  <div class="note">近づいて品物に目を向けると、名前が浮かびます。<br>鑑賞中はドラッグ（またはマウス）で、ぐるりと眺められます。</div>
  <div class="col" style="margin-top:16px"><button class="btn" id="hBack">もどる</button></div>
</div></div>

<div id="fade"></div>

<script type="module">
import * as THREE from 'three';

   THE ANTIQUE ROOM — core
   ========================================================= */
const $ = s => document.querySelector(s);
const DEV = /dev/.test(location.hash);
const IS_TOUCH = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || (('ontouchstart' in window) && navigator.maxTouchPoints > 0);

/* ---------- palette (sRGB hex) ---------- */

  black: 0x161212, teal: 0x24504c, plum: 0x4a2840, rose: 0xa86a66, ochre: 0xaa7c3c, sepia: 0x7a5434, mustard: 0x9a7a30, slate: 0x4a4e52,
  white: 0xffffff,
};
function toCol(c) { if (c instanceof THREE.Color) return c; if (Array.isArray(c)) return new THREE.Color(c[0], c[1], c[2]); return new THREE.Color(c); }
function cmul(hex, f) { return toCol(hex).clone().multiplyScalar(f); }
function cvar(hex, amt = 0.12) { const c = toCol(hex).clone(); const f = 1 + rr(-amt, amt); c.r *= f * (1 + rr(-amt, amt) * .3); c.g *= f; c.b *= f * (1 + rr(-amt, amt) * .3); return c; }
const GLOW = (r, g, b) => new THREE.Color(r, g, b); // linear HDR colours for unlit glow

/* ---------- renderer / scene ---------- */
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', stencil: false });

const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.04, 2800);

scene.add(camera);

/* ---------- transforms ---------- */
const _q = new THREE.Quaternion(), _e = new THREE.Euler(), _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _s1 = new THREE.Vector3();

  _e.set(r ? r[0] : 0, r ? r[1] : 0, r ? r[2] : 0, 'YXZ'); _q.setFromEuler(_e);

  m.compose(_v1.set(p ? p[0] : 0, p ? p[1] : 0, p ? p[2] : 0), _q, _s1);

function globeMap(x, w, h) {
  const id = x.createImageData(w, h), d = id.data;
  for (let y = 0; y < h; y++) for (let X = 0; X < w; X++) {
    const lon = X / w * TAU, lat = (y / h - .5) * PI; const px = Math.cos(lat) * Math.cos(lon), py = Math.sin(lat), pz = Math.cos(lat) * Math.sin(lon);
    const n = fbm2(px * 2.2 + 9, py * 2.2 + pz * 1.7 + 4, 5, 91);
    const land = n > .53; let c = land ? [206, 176, 118] : [150, 154, 124];

  }

}
function drawOpenBook(x, w, h, v) {

    for (let l = 0; l < 22; l++) { const y = 30 + l * ((h - 50) / 22); if (v === 1 && p === 1 && l > 3 && l < 15) continue; let xx = ox; while (xx < ox + pw) { const ww = rr(8, 28); x.fillRect(xx, y, Math.min(ww, ox + pw - xx), 2.2); xx += ww + 4; } }

function poster(x, w, h) {

/* ---- stained glass atlas ---- */
/* aged, warm "antique" glass: amber / honey / cream quarries with muted claret, moss and smoke-blue accents */
function stainedAtlas() {
  const A = new Atlas(1024, 1024, '#000');
  const lead = (x, lw = 5) => { x.strokeStyle = '#140f0a'; x.lineWidth = lw; x.stroke(); };
  const P = { amber: '#a8782c', honey: '#c49a52', cream: '#cdb88c', sepia: '#7e5428', claret: '#6a2a22', wine: '#4e2228', moss: '#55593a', smoke: '#3e4a4c', olive: '#6e6634', deep: '#2e2418' };
  const jew = [P.amber, P.claret, P.honey, P.moss, P.sepia, P.smoke, P.olive, P.cream];
  // uneven, slightly dirty glass: per-pane brightness wobble + soot toward the edges
  const age = (x, w, h) => {
    x.save(); x.globalCompositeOperation = 'multiply';
    for (let i = 0; i < 70; i++) { const r = rr(10, 60); const g = x.createRadialGradient(0, 0, 0, 0, 0, r); const k = Math.round(rr(150, 225)); g.addColorStop(0, `rgba(${k},${k - 8},${k - 22},.55)`); g.addColorStop(1, 'rgba(255,255,255,0)'); x.setTransform(1, 0, 0, 1, rr(0, w), rr(0, h)); x.fillStyle = g; x.fillRect(-r, -r, 2 * r, 2 * r); }
    x.setTransform(1, 0, 0, 1, 0, 0);
    const v = x.createRadialGradient(w / 2, h / 2, Math.min(w, h) * .25, w / 2, h / 2, Math.max(w, h) * .72); v.addColorStop(0, 'rgba(255,255,255,1)'); v.addColorStop(1, 'rgba(120,100,80,1)');
    x.fillStyle = v; x.fillRect(0, 0, w, h); x.restore();
  };
  A.alloc('rose', 512, 512, (x, w, h) => {
    const cx = w / 2, cy = h / 2;
    x.fillStyle = P.deep; x.fillRect(0, 0, w, h);
    const ringCol = [[P.honey], [P.claret, P.amber], [P.cream, P.sepia, P.cream, P.moss], [P.amber, P.smoke, P.amber, P.olive]];
    for (let ring = 0; ring < 4; ring++) {
      const r0 = [0, 60, 130, 200][ring], r1 = [60, 130, 200, 256][ring], n = [1, 8, 16, 24][ring];
      for (let i = 0; i < n; i++) {
        const a0 = i / n * TAU, a1 = (i + 1) / n * TAU;
        x.beginPath(); if (r0 === 0) x.arc(cx, cy, r1, 0, TAU); else { x.arc(cx, cy, r1, a0, a1); x.arc(cx, cy, r0, a1, a0, true); x.closePath(); }
        const rc = ringCol[ring]; x.fillStyle = rc[i % rc.length]; x.fill(); lead(x, 5);
        if (ring >= 1) { const am = (a0 + a1) / 2, rm = (r0 + r1) / 2; x.beginPath(); x.arc(cx + Math.cos(am) * rm, cy + Math.sin(am) * rm, (r1 - r0) * .28, 0, TAU); x.fillStyle = ring === 1 ? P.honey : (i % 2 ? P.claret : P.cream); x.fill(); lead(x, 4); }
      }
    }
    x.beginPath(); for (let i = 0; i < 8; i++) { const a = i / 8 * TAU; x.moveTo(cx, cy); x.lineTo(cx + Math.cos(a) * 60, cy + Math.sin(a) * 60); } lead(x, 4);
    age(x, w, h);
  });
  for (let v = 0; v < 2; v++) A.alloc('head' + v, 256, 512, (x, w, h) => {
    // diamond quarries of pale amber / cream glass
    x.fillStyle = P.cream; x.fillRect(0, 0, w, h);
    const s = 36;
    for (let y = -s; y < h + s; y += s) for (let X = -s; X < w + s; X += s) {
      const ox = ((y / s) & 1) * s / 2; x.beginPath(); x.moveTo(X + ox, y - s / 2); x.lineTo(X + ox + s / 2, y); x.lineTo(X + ox, y + s / 2); x.lineTo(X + ox - s / 2, y); x.closePath();
      x.fillStyle = pick([P.cream, P.cream, P.honey, '#bfa676']); x.fill(); lead(x, 2.5);
    }
    // narrow coloured border
    x.lineWidth = 14; x.strokeStyle = v ? P.moss : P.claret; x.strokeRect(7, 7, w - 14, h - 14); x.beginPath(); x.rect(0, 0, w, h); x.rect(14, 14, w - 28, h - 28); lead(x, 3);
    const cx = w / 2, cy = h * .45; x.beginPath(); x.arc(cx, cy, 86, 0, TAU); x.fillStyle = P.amber; x.fill(); lead(x, 6);
    x.beginPath(); x.arc(cx, cy, 66, 0, TAU); x.fillStyle = v ? P.moss : P.wine; x.fill(); lead(x, 5);
    for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; x.beginPath(); x.ellipse(cx + Math.cos(a) * 36, cy + Math.sin(a) * 36, 24, 11, a, 0, TAU); x.fillStyle = P.cream; x.fill(); lead(x, 3); }
    x.beginPath(); x.arc(cx, cy, 16, 0, TAU); x.fillStyle = P.honey; x.fill(); lead(x, 3);
    age(x, w, h);
  });
  A.alloc('circle', 256, 256, (x, w, h) => {
    const cx = w / 2, cy = h / 2; x.fillStyle = P.wine; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 4; i++) { const a = i / 4 * TAU; x.beginPath(); x.arc(cx + Math.cos(a) * 50, cy + Math.sin(a) * 50, 52, 0, TAU); x.fillStyle = P.amber; x.fill(); lead(x, 4); }
    x.beginPath(); x.arc(cx, cy, 40, 0, TAU); x.fillStyle = P.cream; x.fill(); lead(x, 4);
    age(x, w, h);
  });
  A.alloc('fan', 256, 256, (x, w, h) => {
    x.fillStyle = P.honey; x.fillRect(0, 0, w, h);
    const cx = w / 2, cy = h; for (let i = 0; i < 9; i++) { const a0 = PI + i / 9 * PI, a1 = PI + (i + 1) / 9 * PI; x.beginPath(); x.moveTo(cx, cy); x.arc(cx, cy, 250, a0, a1); x.closePath(); x.fillStyle = i % 2 ? P.amber : P.cream; x.fill(); lead(x, 4); }
    x.beginPath(); x.arc(cx, cy, 70, PI, TAU); x.fillStyle = P.claret; x.fill(); lead(x, 4);
    age(x, w, h);
  });
  return A;
}

function buildAtlases() {
  const ART = new Atlas(2048, 2048, '#201810');

    ['lady', 448, 600, (x, w, h) => pPortrait(x, w, h, true)], ['gent', 448, 600, (x, w, h) => pPortrait(x, w, h, false)],
    ['flowers', 448, 560, pFlowers], ['forest', 640, 480, pForest],
    ['girl', 320, 400, (x, w, h) => pPortrait(x, w, h, true)],
  ];
  for (const [n, w, h, fn] of paintings) ART.alloc(n, w, h, (ctx, W, H) => paintInto(ctx, W, H, fn, 1, Math.max(4, W / 110)));
  const PR = new Atlas(2048, 2048, '#d8c8a0');
  PR.alloc('astro', 512, 512, astroDial);
  for (let i = 0; i < 5; i++) PR.alloc('dial' + i, 256, 256, (x, w, h) => dial(x, w, h, i));
  PR.alloc('pdial', 128, 128, (x, w, h) => dial(x, w, h, 3));
  PR.x = PR.W;
  PR.alloc('map', 640, 448, map);
  PR.alloc('globe', 512, 256, globeMap);
  PR.alloc('book0', 512, 320, (x, w, h) => drawOpenBook(x, w, h, 0));
  PR.alloc('paper', 128, 128, (x, w, h) => { x.fillStyle = '#e6d6b2'; x.fillRect(0, 0, w, h); });
  PR.alloc('typed', 256, 300, (x, w, h) => { x.fillStyle = '#efe6d2'; x.fillRect(0, 0, w, h); x.fillStyle = 'rgba(30,30,30,.8)'; for (let l = 0; l < 9; l++) { let xx = 24; const y = 30 + l * 14; while (xx < w - 30) { const ww = rr(6, 26); x.fillRect(xx, y, ww, 3); xx += ww + 5; } } });
  PR.x = PR.W;
  PR.alloc('poster', 300, 420, poster);
  for (let i = 0; i < 3; i++) PR.alloc('plate' + i, 300, 400, (x, w, h) => plate(x, w, h, i));
  PR.alloc('music', 256, 340, sheetMusic);
  PR.alloc('music2', 256, 340, sheetMusic);
  for (let i = 0; i < 2; i++) PR.alloc('photo' + i, 160, 208, (x, w, h) => photo(x, w, h, i));
  PR.x = PR.W;
  for (let i = 0; i < 4; i++) PR.alloc('letter' + i, 256, 330, (x, w, h) => letter(x, w, h, i));
  for (let i = 2; i < 6; i++) PR.alloc('photo' + i, 160, 208, (x, w, h) => photo(x, w, h, i));
  PR.x = PR.W;
  PR.alloc('book1', 512, 320, (x, w, h) => drawOpenBook(x, w, h, 1));
  return { ART, PR };
}

/* =========================================================
   architecture: the great room
   ========================================================= */
/* room size. Positions written for the original 36x28 m hall are pulled in with FX/FZ:
   anything within a few metres of a wall keeps its distance to that wall, the open middle shrinks. */
const OLD = { X: 18, Z: 14 };
const ROOM = { x0: -12, x1: 12, z0: -9.5, z1: 9.5, h: 11 };
const RX = ROOM.x1, RZ = ROOM.z1, RH = ROOM.h;

const MEZ_Y = 4.6;
const MEZ_X = -RX + 3;             // inner edge of the west gallery
const MEZ_Z = RZ - 3;              // inner edge of the south gallery
const MEZ_END = +FX(-4).toFixed(2); // east end of the south gallery
const ARC_W = Array.from({ length: 7 }, (_, i) => +(-RZ + i * (MEZ_Z + RZ) / 6).toFixed(3));   // shaft z positions on x = MEZ_X
const ARC_S = [MEZ_X, +(MEZ_X + (MEZ_END - MEZ_X) / 3).toFixed(3), +(MEZ_X + 2 * (MEZ_END - MEZ_X) / 3).toFixed(3), MEZ_END];
const STAIR = { x: MEZ_X + 1.9, z: +((ARC_W[2] + ARC_W[3]) / 2).toFixed(3), r: 2.0, ri: 0.22, n: 36, turns: 1.5 };
STAIR.sweep = TAU * STAIR.turns; STAIR.d = STAIR.sweep / STAIR.n; STAIR.rise = MEZ_Y / STAIR.n;
const DOME = { x: 0, z: +FZ(-1).toFixed(2), r: 4.2 };
const WIN_N = [{ x: 0, w: 5.2, bot: 0.5, sill: 1.0, spring: 5.0, big: true }, { x: -4.95, w: 2.2, bot: 1.3, sill: 1.3, spring: 5.2 }, { x: 4.95, w: 2.2, bot: 1.3, sill: 1.3, spring: 5.2 }];
const WIN_E = { z: +FZ(7).toFixed(2), w: 2.2, bot: 1.32, sill: 1.32, spring: 4.6 };
const DOOR = { x: +FX(.5).toFixed(2), w: 2.4, spring: 3.0 };
const GROUND_COLS = [[MEZ_X, ARC_W[1]], [MEZ_X, ARC_W[3]], [MEZ_X, ARC_W[5]], [MEZ_X, MEZ_Z], [ARC_S[2], MEZ_Z], [MEZ_END, MEZ_Z]];

function headPath(x0, x1, ys) { const s = new THREE.Shape(); const w = x1 - x0; s.moveTo(x0, ys); s.lineTo(x1, ys); s.absarc(x0, ys, w, 0, PI / 3, false); s.absarc(x1, ys, w, PI * 2 / 3, PI, false); return s; }

function archRing(x0, x1, bot, ys, t) {

/* ---------------- floor & walls ---------------- */
function buildFloorWalls() {
  const fl = G.plane(2 * RX, 2 * RZ); fl.rotateX(-PI / 2);

  // stone plinth along north wall

  for (const [a, b] of segs) { ROOT.add(G.box(b - a, .34, .1), MAT.stone, [(a + b) / 2, .17, -RZ + .05], { c: 0xb8ae9c }); ROOT.add(G.box(b - a, .06, .14), MAT.stone, [(a + b) / 2, .37, -RZ + .07], { c: 0xb8ae9c }); }
  // WEST wall (behind shelves)

function wainscot(K, a, b) {

/* ---------------- windows ---------------- */
function glassPiece(K, shape, kind, region, z, tint = 1.25) {

function buildWindows() {

    const hw = w.w / 2;
    const tr = archPath(-hw - .02, hw + .02, w.bot, w.spring);
    const holes = [];
    if (w.big) {
      const b = .16, m = .16, lw = (w.w - 2 * b - 2 * m) / 3;

      }
      holes.push(['stained', circlePath(0, w.spring + 2.65, 1.15), 'rose']);
      holes.push(['stained', circlePath(-1.72, w.spring + 1.85, .34), 'circle']);
      holes.push(['stained', circlePath(1.72, w.spring + 1.85, .34), 'circle']);
    } else {
      const b = .16, m = .12, lw = (w.w - 2 * b - m) / 2;
      for (let i = 0; i < 2; i++) {
        const x0 = -hw + b + i * (lw + m), x1 = x0 + lw;
        holes.push(['clear', rectPath(x0, w.sill + .12, x1, w.spring - .22), null]);
        holes.push(['stained', headPath(x0, x1, w.spring - .08), 'head' + i]);
      }

    }
    for (const h of holes) tr.holes.push(h[1]);
    K.add(G.ext(tr, .2, 0, 16), MAT.stone, [0, 0, -.1], { c: 0xc8bea8 });
    for (const [kind, path, reg] of holes) {
      const sh = new THREE.Shape(path.getPoints(kind === 'clear' ? 1 : 20));
      glassPiece(K, sh, kind === 'clear' ? 'clear' : 'stained', reg, -.02);
    }
    // stone sill / seat

    } else {

  }

    K.add(G.ext(archRing(-hw, hw, WIN_E.bot, WIN_E.spring, .26), .1, .02, 24), MAT.stone, [0, 0, 0], { c: 0xcfc5b0 });

/* ---------------- ceiling ---------------- */

/* ---------------- mezzanine, arcade, columns ---------------- */

      }
    }
    e.preventDefault();
  }, { passive: false });
  const end = e => {
    for (const t of e.changedTouches) {
      if (t.identifier === TOUCH.stickId) { TOUCH.stickId = null; INPUT.mx = INPUT.my = 0; stick.classList.remove('on'); }
      if (t.identifier === TOUCH.lookId) { TOUCH.lookId = null; if (TOUCH.lookMoved < 8 && performance.now() - TOUCH.lookStart < 300 && MODE === 'play' && TARGET) startInspect(TARGET); }
    }
  };
  canvas.addEventListener('touchend', end); canvas.addEventListener('touchcancel', end);
  $('#tInspect').addEventListener('touchstart', e => { e.preventDefault(); if (MODE === 'play' && TARGET) startInspect(TARGET); }, { passive: false });
  $('#tRun').addEventListener('touchstart', e => { e.preventDefault(); INPUT.run = !INPUT.run; $('#tRun').classList.toggle('on', INPUT.run); $('#tRun').textContent = INPUT.run ? '走る' : '歩く'; }, { passive: false });
}

/* =========================================================
   sound: synthesized ambience (no audio files)
   ========================================================= */
const AUDIO = (() => {
  let ctx = null, master = null, rev = null, dry = null, noiseBuf = null, started = false;
  const amb = {};
  let tickNext = 0, tickPhase = 0, crackleNext = 0;
  function mkNoise(sec) { const b = ctx.createBuffer(2, ctx.sampleRate * sec, ctx.sampleRate); for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); let last = 0; for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; last = (last + .02 * w) / 1.02; d[i] = c === 0 ? w * .5 + last * 2 : w * .5 + last * 2; } } return b; }
  function mkIR(sec) { const b = ctx.createBuffer(2, ctx.sampleRate * sec, ctx.sampleRate); for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < d.length; i++) { const t = i / d.length; d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 3.2) * (i < 400 ? i / 400 : 1); } } return b; }
  function loop(filterType, freq, q, gain) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; s.loopStart = Math.random();
    const f = ctx.createBiquadFilter(); f.type = filterType; f.frequency.value = freq; f.Q.value = q;
    const g = ctx.createGain(); g.gain.value = gain; s.connect(f); f.connect(g); g.connect(dry); g.connect(rev); s.start(); return { s, f, g };
  }
  function init() {
    if (ctx) return;
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    master = ctx.createGain(); master.gain.value = SETTINGS.sound ? SETTINGS.volume : 0; master.connect(ctx.destination);
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3; comp.connect(master);
    dry = ctx.createGain(); dry.gain.value = 1; dry.connect(comp);
    const conv = ctx.createConvolver(); conv.buffer = mkIR(3.2); rev = ctx.createGain(); rev.gain.value = .32; rev.connect(conv); conv.connect(comp);
    noiseBuf = mkNoise(6);
    amb.room = loop('lowpass', 220, .5, .05);
    amb.wind = loop('bandpass', 420, .9, 0);
    amb.rain = loop('highpass', 2600, .4, 0);
    amb.fire = loop('lowpass', 520, .7, 0);
    started = true;
  }
  function env(g, t0, a, peak, d) { g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + a); g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d); }
  function click(t, freq, gain, dec = .03, toRev = .4, type = 'bandpass') {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = 6;
    const g = ctx.createGain(); s.connect(f); f.connect(g); g.connect(dry); const rg = ctx.createGain(); rg.gain.value = toRev; g.connect(rg); rg.connect(rev);
    env(g, t, .002, gain, dec); s.start(t, Math.random() * 4); s.stop(t + dec + .05);
  }
  function tone(t, f, dur, gain, type = 'sine', partials = [1, .5, .25, .12], dec = 1.2) {
    for (let i = 0; i < partials.length; i++) {
      const o = ctx.createOscillator(); o.type = type; o.frequency.value = f * (i + 1) * (1 + (i ? .0015 * i : 0));
      const g = ctx.createGain(); o.connect(g); g.connect(dry); const rg = ctx.createGain(); rg.gain.value = .6; g.connect(rg); rg.connect(rev);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain * partials[i], t + .006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur * dec / (1 + i * .6));
      o.start(t); o.stop(t + dur * dec + .1);
    }
  }
  const NOTE = n => 440 * Math.pow(2, (n - 69) / 12);
  function update(dt) {
    if (!started || !ctx || ctx.state !== 'running') return;
    const now = ctx.currentTime;
    const ox = FXi(P.x), oz = FZi(P.z), nearWin = clamp(1 - (oz + 13) / 14, 0, 1);
    const dFire = Math.hypot(ox - 9, oz - 13), dClock = Math.hypot(ox - 16, oz + 5);
    amb.wind.g.gain.setTargetAtTime(.03 + nearWin * .09 + SKY.flash * .05, now, .5);
    amb.wind.f.frequency.setTargetAtTime(380 + 140 * Math.sin(now * .13) + 80 * Math.sin(now * .37), now, .4);
    amb.rain.g.gain.setTargetAtTime(.008 + nearWin * .02, now, .5);
    amb.fire.g.gain.setTargetAtTime(clamp(1 - dFire / 9, 0, 1) * .12, now, .3);
    // fire crackles
    if (now > crackleNext) { crackleNext = now + Math.random() * .25 + .03; const k = clamp(1 - dFire / 8, 0, 1); if (k > .02) click(now + .01, 1800 + Math.random() * 3000, k * (.05 + Math.random() * .12), .02 + Math.random() * .03, .2, 'highpass'); }
    // clock ticks (pendulum: 1 s)
    if (now > tickNext - .05) {
      const t = Math.max(now, tickNext); tickNext = t + 1; tickPhase ^= 1;
      const k = clamp(1 - dClock / 18, 0, 1) * .85 + .05;
      click(t, tickPhase ? 3200 : 2500, .09 * k, .025, .5);
      if (k > .3) click(t + .37, 4200, .03 * k, .015, .4);
    }
  }
  return {
    get ok() { return !!ctx; },
    start() { init(); if (ctx && ctx.state === 'suspended') ctx.resume(); },
    update,
    setOn(v) { if (master) master.gain.setTargetAtTime(v ? SETTINGS.volume : 0, ctx.currentTime, .1); },
    setVol(v) { if (master && SETTINGS.sound) master.gain.setTargetAtTime(v, ctx.currentTime, .1); },
    step(kind, run) { if (!started) return; const t = ctx.currentTime; click(t, kind === 1 ? 420 : (kind === 2 ? 300 : 230), run ? .16 : .11, .07, .25, 'lowpass'); if (Math.random() < .15) click(t + .05, 900 + Math.random() * 400, .02, .12, .3); },
    thunder(delay) { if (!started) return; const t = ctx.currentTime + delay; const s = ctx.createBufferSource(); s.buffer = noiseBuf; const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 160; const g = ctx.createGain(); s.connect(f); f.connect(g); g.connect(dry); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(.35, t + .3); g.gain.exponentialRampToValueAtTime(.12, t + 1.2); g.gain.exponentialRampToValueAtTime(0.0001, t + 4.5); s.start(t); s.stop(t + 5); },
    inspect(it) {
      if (!started) return; const t = ctx.currentTime + .15;
      if (it.sound === 'piano') { const seq = [62, 65, 69, 74, 72, 69, 65, 64, 62, 57, 62, 65]; seq.forEach((n, i) => tone(t + i * .34, NOTE(n), 1.6, .09, 'sine', [1, .45, .2, .1, .05], 1.4)); tone(t, NOTE(38), 3, .07, 'sine', [1, .4, .2]); tone(t + 1.36, NOTE(41), 3, .06, 'sine', [1, .4, .2]); tone(t + 2.72, NOTE(45), 3, .06, 'sine', [1, .4, .2]); }
      else if (it.sound === 'chime') { [76, 72, 74, 67].forEach((n, i) => tone(t + i * .7, NOTE(n), 2.2, .07, 'sine', [1, .3, .55, .12], 1.6)); [43, 43, 43].forEach((n, i) => tone(t + 3.4 + i * 1.6, NOTE(n), 3, .09, 'sine', [1, .5, .7, .2], 1.6)); }
      else if (it.sound === 'musicbox') { const seq = [84, 88, 91, 88, 86, 83, 86, 84, 79, 81, 83, 84]; seq.forEach((n, i) => tone(t + i * .28 + (i % 4 === 3 ? .1 : 0), NOTE(n), .9, .05, 'triangle', [1, .2, .35], 1.1)); }
      else if (it.sound === 'gramo') { for (let i = 0; i < 40; i++) click(t + i * .11 + Math.random() * .05, 5000, .02, .01, .1, 'highpass'); const seq = [67, 71, 74, 72, 71, 69, 67, 66, 67]; seq.forEach((n, i) => tone(t + .3 + i * .45, NOTE(n), 1, .045, 'sawtooth', [1, .3], .8)); }
      else if (it.sound === 'tick') { for (let i = 0; i < 6; i++) click(t + i * .25, 5200, .05, .012, .3); }
      else click(t, 1400, .025, .05, .6);
    },
  };
})();
window.AUDIO = AUDIO;

/* =========================================================
   boot & main loop
   ========================================================= */
const clock = new THREE.Clock(); let TIME = 0, FADE = 0, FADE_T = 1;
function titleCam(t) {
  const a = t * .045;
  camera.position.set(Math.sin(a) * 2.4 + .8, 2.1 + Math.sin(t * .11) * .35, 5.6 + Math.cos(a) * 1.6);
  _m4.lookAt(camera.position, V3(Math.sin(a * .7) * 2.0, 4.4, -RZ + 2), camera.up); camera.quaternion.setFromRotationMatrix(_m4);
}
function toTitle() {
  MODE = 'title'; show($('#title'), true); show($('#hud'), false); show($('#touch'), false);
  $('#loading').style.opacity = 0; setTimeout(() => show($('#loading'), false), 1300);
  FADE_T = 1;
}
function startGame() {
  if (MODE !== 'title') return;
  AUDIO.start();
  if (!IS_TOUCH) requestLook();
  $('#fade').style.opacity = 1;
  setTimeout(() => {
    show($('#title'), false); show($('#hud'), true); if (IS_TOUCH) show($('#touch'), true);
    P.x = DOOR.x; P.z = RZ - 2.1; P.y = 0; P.yaw = 0; P.pitch = .08; P.vx = P.vz = 0; P.onStair = false; UI.area = null;
    MODE = 'play'; placeCamera();
    $('#fade').style.opacity = 0;
    if (!IS_TOUCH) flashHint(UI.pointerLocked ? 'WASDで歩く ・ マウスで見まわす ・ Eで鑑賞' : 'クリックで視点を固定 ・ WASDで歩く ・ Eで鑑賞', 6);
    else flashHint('左側で歩き、右側で見まわします', 5);
  }, 900);
}
function quitToTitle() {
  show($('#menu'), false); releasePointer();
  $('#fade').style.opacity = 1;
  setTimeout(() => { show($('#hud'), false); show($('#touch'), false); hideInspect(); MODE = 'title'; show($('#title'), true); $('#fade').style.opacity = 0; }, 900);
}
function frameLoop() {
  requestAnimationFrame(frameLoop);
  const dt = Math.min(clock.getDelta(), .05); TIME += dt;
  step(dt);
  composer.render(dt);
  perfTick(dt);
}
function step(dt) {
  if (MODE === 'title') titleCam(TIME);
  else if (MODE === 'play') { moveStep(dt); placeCamera(); TARGET = findTarget(); }
  else if (MODE === 'inspect') { inspectStep(dt); }
  for (const f of ANIMS) f(TIME, dt);
  if (MODE === 'play' || MODE === 'inspect') updateHUD(dt);
  AUDIO.update(dt);
  _gi += (_giT - _gi) * Math.min(1, dt * 3);
  gradePass.uniforms.uTime.value = TIME; gradePass.uniforms.uInspect.value = _gi;
}
async function boot() {
  try {
    setLoad(.04, '扉の鍵を探しています…'); await nextFrame();
    try { await Promise.race([document.fonts.load('600 20px "Cinzel"'), new Promise(r => setTimeout(r, 1500))]); } catch (e) { }
    setLoad(.1, '壁紙を貼り、古書の背を塗っています…'); await nextFrame();
    buildMaterials();
    setLoad(.3, '石を積み、アーチを架けています…'); await nextFrame();
    buildArchitecture();
    setLoad(.42, '書架を組み立て、古書を並べています…'); await nextFrame();
    buildLayout();
    setLoad(.66, '窓の外に霧を流しています…'); await nextFrame();
    buildOutside();
    setLoad(.74, '調度品を磨いています…'); await nextFrame();
    bakeStatic(); buildBooks();
    setLoad(.82, '燭台に火を灯しています…'); await nextFrame();
    buildLights(); buildEnv(); buildFlames(); buildDust(); buildShafts(); buildPatch(); buildPost();
    setLoad(.92, '時計の振り子を揺らしています…'); await nextFrame();
    renderer.compile(scene, camera);
    bindUI(); syncSettings();
    setLoad(1, '');
    MODE = 'title'; titleCam(0);
    renderer.shadowMap.needsUpdate = true;
    frameLoop();
    toTitle();
  } catch (e) { loadError(e); }
}

boot();
