<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ============================================================
//  DEEP SMILE — core
// ============================================================
const DEV = /dev/.test(location.hash);
const TOTAL = 300;
const EYE_Y = 1.62;
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// keyed value, smoothstep between keys
function kf(keys, t) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) { const a = keys[i - 1], b = keys[i]; const u = (t - a[0]) / (b[0] - a[0]); const e = u * u * (3 - 2 * u); return a[1] + (b[1] - a[1]) * e; }
  }
  return keys[keys.length - 1][1];
}
// smooth table (cubic hermite) for shape profiles
function tb(T, s) {
  const n = T.length;
  if (s <= T[0][0]) return T[0][1];
  if (s >= T[n - 1][0]) return T[n - 1][1];
  let i = 0; while (s > T[i + 1][0]) i++;
  const m = k => { const a = T[Math.max(0, k - 1)], b = T[Math.min(n - 1, k + 1)]; return (b[1] - a[1]) / (b[0] - a[0]); };
  const s0 = T[i][0], s1 = T[i + 1][0], h = s1 - s0, u = (s - s0) / h;
  const u2 = u * u, u3 = u2 * u;
  return (2 * u3 - 3 * u2 + 1) * T[i][1] + (u3 - 2 * u2 + u) * h * m(i) + (-2 * u3 + 3 * u2) * T[i + 1][1] + (u3 - u2) * h * m(i + 1);
}
// value noise 1D (deterministic, for shakes)
function vnoise(x) { const i = Math.floor(x), f = x - i; const h = k => { const s = Math.sin(k * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }; const u = f * f * (3 - 2 * f); return lerp(h(i), h(i + 1), u) * 2 - 1; }

const NOISE_GLSL = /* glsl */`
vec3 dsM289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 dsM289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 dsPerm(vec4 x){return dsM289(((x*34.0)+10.0)*x);}
vec4 dsTis(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=dsM289(i);
  vec4 p=dsPerm(dsPerm(dsPerm(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 nr=dsTis(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=nr.x;p1*=nr.y;p2*=nr.z;p3*=nr.w;
  vec4 m=max(0.5-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 105.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
vec3 dsPerturb(vec3 surf_pos, vec3 surf_norm, vec2 dHdxy, float faceDirection){
  vec3 vSigmaX=normalize(dFdx(surf_pos)); vec3 vSigmaY=normalize(dFdy(surf_pos)); vec3 vN=surf_norm;
  vec3 R1=cross(vSigmaY,vN); vec3 R2=cross(vN,vSigmaX);
  float fDet=dot(vSigmaX,R1)*faceDirection;
  vec3 vGrad=sign(fDet)*(dHdxy.x*R1+dHdxy.y*R2);
  return normalize(abs(fDet)*surf_norm-vGrad);
}
`;

// ---------------- renderer / scene ----------------
const canvas = document.getElementById('c');
const MOBILE = matchMedia('(pointer:coarse)').matches;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !MOBILE, powerPreference: 'high-performance' });
let PR = Math.min(devicePixelRatio || 1, MOBILE ? 1.5 : 1.75);
renderer.setPixelRatio(PR);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.02);
const camera = new THREE.PerspectiveCamera(70, 1, 0.04, 1200);

// shared uniforms
const GU = {
  uTime: { value: 0 },
};

// ============================================================
//  THE MONSTER  (based on the hand drawing)  — v2
//  local frame: nose at origin, head faces +Z, body runs to -Z
// ============================================================
const MON = (() => {
  const ML = 22;          // body length to tail base (m)
  const VS = 0.86;        // vertical scale against the drawing
  const SC = 0.48;        // mouth corner (fraction of body length)
  const EXP = 0.9;        // cross-section squareness
  const B_T = [[0, .20], [.12, .225], [.22, .255], [.32, .2625], [.45, .25], [.6, .21], [.75, .145], [.88, .08], [1, .036]];
  const K_T = [[0, -.02], [.03, .2], [.08, .4], [.14, .4], [.24, .2], [.36, .08], [.48, .2], [.62, .12], [1, .06]];
  const WR_T = [[0, 0.98], [.25, 0.98], [.55, .86], [.85, .66], [1, .5]];

  const bH = s => { const c = Math.sqrt(Math.max(0, 1 - Math.pow(1 - Math.min(s / 0.11, 1), 2))); return tb(B_T, s) * c * ML * VS; };
  const cY = s => 0.03 * s * s * ML * VS;
  const kLip = s => tb(K_T, s);
  const wr = s => tb(WR_T, s);
  const phiM = s => { const k = kLip(s); const c = -Math.sign(k) * Math.pow(Math.abs(k), 1 / EXP); return Math.acos(clamp(c, -1, 1)); };
  const G = (x, w) => Math.exp(-(x / w) * (x / w));
  const EYE_S = 0.08, EYE_P = 0.74 * Math.PI, EYE_MOUND = 1.0, ER = 1.5;

  // sculpted relief (metres, along the cross-section normal)
  function relief(s, ph) {
    let a = ph; while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI;
    const A = Math.abs(a), m = phiM(s), dl = A - m;  // dl > 0: above the lip line
    let d = 0;
    // throat pleats (the drawing's curved lines under the mouth) — broad ridges
    if (A < m) {
      const g = A / m;
      const env = sstep(0.05, 0.16, s) * (1 - sstep(0.8, 0.97, s)) * (1 - sstep(0.8, 0.9, g));
      d += 0.02 * Math.cos(2 * Math.PI * g * 6) * env;
    }
    // fleshy lips along the whole mouth
    const mouth = (1 - sstep(SC - 0.03, SC + 0.03, s)) * sstep(0.0, 0.035, s);
    d += 0.16 * G(dl, 0.09) * mouth;
    // jowls at the corners of the mouth
    d += 0.42 * G(s - 0.43, 0.065) * G(dl + 0.05, 0.32);
    // eye mounds (the eyeballs bulge out of these) and a heavy brow above them
    { const ds = (s - EYE_S) * ML, dp = (A - EYE_P) * bH(EYE_S) * 1.0; d += EYE_MOUND * Math.exp(-(ds * ds + dp * dp) / 2.6);
      const db = ds + 1.3; d += 0.75 * Math.exp(-(db * db * 0.8 + dp * dp) / 2.2); }   // hood behind the eye
    d += 0.22 * G(s - 0.085, 0.045) * G(A - 0.88 * Math.PI, 0.1);
    d -= 0.75 * G(A - Math.PI, 0.42) * G(s - 0.075, 0.075);   // sunken forehead between the eyes
    // low dorsal ridge
    d += 0.17 * G(A - Math.PI, 0.1) * sstep(0.2, 0.4, s) * (1 - sstep(0.82, 0.97, s));
    // lateral line groove behind the mouth
    d -= 0.05 * G(dl, 0.035) * sstep(SC + 0.01, SC + 0.07, s) * (1 - sstep(0.9, 1, s));
    return d * sstep(0, 0.03, s);
  }
  function surf(s, ph, out = new THREE.Vector3()) {
    const b = bH(s), hw = b * wr(s), cy = cY(s);
    const sn = Math.sin(ph), cs = Math.cos(ph);
    const sx = Math.sign(sn) * Math.pow(Math.abs(sn), EXP);
    const sy = Math.sign(cs) * Math.pow(Math.abs(cs), EXP);
    const yy = -sy * b * (1 - 0.07 * clamp(sy, 0, 1));
    let nx = sx * b, ny = -sy * hw; const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
    const r = relief(s, ph);
    return out.set(hw * sx + nx * r, cy + yy + ny * r, -s * ML);
  }
  function surfN(s, ph, out = new THREE.Vector3()) {
    const e = 6e-4, se = Math.max(s, 2e-3);
    const a = surf(Math.min(1, se + e), ph), b = surf(Math.max(0, se - e), ph);
    const c = surf(se, ph + e), d = surf(se, ph - e);
    out.crossVectors(a.sub(b), c.sub(d)).normalize();
    if (!isFinite(out.x)) out.set(0, 0, 1);
    return out;
  }

  const sAll = []; { const N = 210; for (let i = 0; i <= N; i++) sAll.push(Math.pow(i / N, 1.35)); }

  function patch(sList, nPhi, phiOf, gOf) {
    const nu = sList.length, nv = nPhi + 1;
    const pos = new Float32Array(nu * nv * 3), nor = new Float32Array(nu * nv * 3), sp = new Float32Array(nu * nv * 2);
    const P = new THREE.Vector3(), N = new THREE.Vector3();
    for (let i = 0; i < nu; i++) {
      const s = sList[i];
      for (let j = 0; j < nv; j++) {
        const f = j / nPhi, ph = phiOf(s, f), k = i * nv + j;
        surf(s, ph, P); surfN(s, ph, N);
        pos.set([P.x, P.y, P.z], k * 3); nor.set([N.x, N.y, N.z], k * 3); sp.set([s, gOf(s, f)], k * 2);
      }
    }
    const idx = [];
    for (let i = 0; i < nu - 1; i++) for (let j = 0; j < nPhi; j++) {
      const a = i * nv + j, b = (i + 1) * nv + j, c = i * nv + j + 1, d = (i + 1) * nv + j + 1;
      idx.push(a, b, c, b, d, c);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    g.setAttribute('sp', new THREE.BufferAttribute(sp, 2));
    g.setIndex(idx);
    return g;
  }

  // ---------------- shared deformation (swim wave + jaw) ----------------
  const uSw = { value: new THREE.Vector4(0, 0, 0, 0.07) }; // amp, phase, bend, jaw
  const hinge = surf(SC, phiM(SC)); hinge.x = 0;
  const uHinge = { value: hinge.clone() };
  const DEFORM = /* glsl */`
uniform vec4 uSw; uniform vec3 uHinge;
vec3 dsRotX(vec3 v, float a){ float c = cos(a), sn = sin(a); return vec3(v.x, v.y*c - v.z*sn, v.y*sn + v.z*c); }
float dsJawA(float s, float lower){ return uSw.w * lower * (1.0 - smoothstep(${(SC - 0.16).toFixed(3)}, ${(SC + 0.01).toFixed(3)}, s)); }
vec3 dsSwim(vec3 p, float s){ float w = smoothstep(0.28, 1.0, s); p.x += uSw.x * w * w * sin(uSw.y - s * 5.5) * ${(ML * 0.07).toFixed(3)} + uSw.z * pow(max(s - 0.18, 0.0), 2.0); return p; }
`;
  // lower-jaw parts that are not part of the body patch (gums, teeth, tongue)
  function jawMat(mat, instanced) {
    const prev = mat.onBeforeCompile;
    mat.onBeforeCompile = (sh, r) => {
      if (prev) prev(sh, r);
      sh.uniforms.uSw = uSw; sh.uniforms.uHinge = uHinge;
      sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\n' + DEFORM)
        .replace('#include <project_vertex>', `
vec4 mvPosition = vec4(transformed, 1.0);
#ifdef USE_INSTANCING
mvPosition = instanceMatrix * mvPosition;
#endif
{ float s = clamp(-mvPosition.z / ${ML.toFixed(1)}, 0.0, 1.0); float a = dsJawA(s, 1.0);
  mvPosition.xyz = dsRotX(mvPosition.xyz - uHinge, a) + uHinge; }
mvPosition = modelViewMatrix * mvPosition;
gl_Position = projectionMatrix * mvPosition;`);
    };
    mat.customProgramCacheKey = () => 'jaw' + (instanced ? 'i' : '') + mat.type;
    return mat;
  }

  // ---------------- skin ----------------
  const skinMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: .5, metalness: 0, side: THREE.DoubleSide });
  skinMat.onBeforeCompile = sh => {
    sh.uniforms.uSw = uSw; sh.uniforms.uHinge = uHinge;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
attribute vec2 sp; attribute float ao; varying vec2 vSp; varying vec3 vLp; varying float vAo;
${DEFORM}`)
      .replace('#include <beginnormal_vertex>', `#include <beginnormal_vertex>
float dsA = dsJawA(sp.x, (sp.y < 1.5 && sp.x < 0.7) ? 1.0 : 0.0);
objectNormal = dsRotX(objectNormal, dsA);`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
vSp = sp; vLp = position; vAo = ao;
transformed = dsRotX(transformed - uHinge, dsA) + uHinge;
transformed = dsSwim(transformed, sp.x);`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
varying vec2 vSp; varying vec3 vLp; varying float vAo;
${NOISE_GLSL}
float dsH; float dsR;`)
      .replace('#include <color_fragment>', `#include <color_fragment>
{
  float gg = vSp.y, s = vSp.x;
  vec3 P = vLp * 0.33;
  float n1 = snoise(P * 0.45) * .5 + .5;
  float n2 = snoise(P * 1.7 + 7.1) * .5 + .5;
  float n3 = snoise(P * 5.5 + 3.3) * .5 + .5;
  float n4 = snoise(P * 17.0) * .5 + .5;
  float n5 = snoise(P * 42.0 + 1.7) * .5 + .5;
  bool lower = gg < 1.5;
  float dors = lower ? 0.0 : 1.0 - abs((gg - 2.0) * 2.0 - 1.0);
  float lowr = lower ? 1.0 - abs(gg) : 0.0;
  float lipD = lower ? 1.0 - abs(gg) : min(gg - 2.0, 3.0 - gg);      // 0 at the lip / lateral line
  float mouthZ = 1.0 - smoothstep(${(SC - 0.02).toFixed(3)}, ${(SC + 0.04).toFixed(3)}, s);
  // countershading
  vec3 cDors = vec3(0.052, 0.056, 0.062);
  vec3 cFlank = vec3(0.25, 0.255, 0.23);
  vec3 cBelly = vec3(0.53, 0.44, 0.39);
  vec3 col = mix(cFlank, cDors, smoothstep(0.08, 0.75, dors));
  col = mix(col, cBelly, smoothstep(0.05, 0.6, lowr));
  // soft, irregular mottling
  float mott = snoise(P * 0.9 + vec3(n2 * 1.6, n1, 0.0));
  col *= 1.0 + mott * 0.16;
  col *= mix(0.78, 1.08, n1);
  // dark freckles on back and flanks
  float frk = smoothstep(0.74, 0.84, n3 * 0.65 + n4 * 0.35) * (1.0 - lowr) * (0.4 + 0.6 * smoothstep(0.2, 0.6, n2));

    amp += kf([[251, 0], [254, 0.006], [255.9, 0.012], [256, 0.11], [258.5, 0.02], [262, 0.004], [268, 0.012], [270, 0]], t);
    amp += kf([[287.5, 0], [290.8, 0.07], [291, 0]], t);
    const s1 = kick(150.6, 0.012, 3), s2 = kick(185.6, 0.03, 2.5), s3 = kick(255.95, 0.11, 3.2);
    sway = s1 * Math.sin((t - 150.6) * 2.2) + s2 * Math.sin((t - 185.6) * 2.6) + s3 * Math.sin((t - 255.95) * 2.4) + 0.004 * Math.sin(t * 0.37);
    swayZ = s3 * 0.5 * Math.sin((t - 255.95) * 1.9 + 1) + 0.003 * Math.sin(t * 0.29 + 1);
    return { amp, sway, swayZ };
  }
  // look-assist targets (soft camera guidance when the player is idle)
  const ASSIST = [[68, 77, 0.35], [104, 118, 0.6], [146, 157, 0.5], [181, 188, 0.6], [219, 270, 1.2], [276, 291, 1.5]];
  function assistAt(t) { for (const a of ASSIST) if (t > a[0] && t < a[1]) return a[2]; return 0; }

  // swim phase integral
  const PT = new Float32Array(Math.ceil(TOTAL / 0.05) + 2);
  { let ph = 0; const a = V3(), b = V3(); for (let i = 0; i < PT.length; i++) { const t = i * 0.05; path(t - 0.1, a); path(t + 0.1, b); const sp = a.distanceTo(b) / 0.2; const f = 0.16 + clamp(sp, 0, 14) * 0.055; PT[i] = ph; ph += f * Math.PI * 2 * 0.05; } }
  const phaseAt = t => { const x = clamp(t, 0, TOTAL) / 0.05, i = Math.floor(x), f = x - i; return lerp(PT[i], PT[Math.min(PT.length - 1, i + 1)], f); };

  // music / ambience levels
  const M = {
    drone: [[0, 0], [62, 0], [70, 0.35], [80, 0.25], [96, 0.4], [112, 0.6], [135, 0.45], [150, 0.7], [195, 0.75], [226, 0.9], [256, 1], [269.99, 1], [270, 0], [300, 0]],
    cluster: [[0, 0], [140, 0], [152, 0.35], [175, 0.3], [186, 0.6], [200, 0.4], [222, 0.8], [240, 0.9], [254, 1.4], [256.2, 0.6], [269.99, 1], [270, 0], [300, 0]],
    high: [[0, 0], [104, 0], [112, 0.5], [118, 0], [178, 0], [186, 0.6], [194, 0.1], [226, 0.3], [245, 0.8], [256, 1.2], [269.99, 1], [270, 0], [286, 0], [290.8, 0.7], [291, 0]],
    sub: [[0, 0], [60, 0], [70, 0.3], [78, 0.1], [140, 0.2], [226, 0.6], [256, 1], [269.99, 1], [270, 0], [283, 0], [290.8, 0.9], [291, 0]],
    riser: [[0, 0], [249, 0], [255.9, 1], [256.05, 0], [286.8, 0], [290.8, 1.1], [291, 0]],
    growl: [[0, 0], [145, 0], [151, 0.35], [158, 0], [182, 0], [186, 0.5], [190, 0], [228, 0], [234, 0.5], [244, 0.65], [256, 1], [262, 0.7], [270, 0.8], [275, 0], [279, 0.4], [287, 0.6], [291, 1]],
    breathRate: [[0, 5.4], [60, 5.0], [100, 4.4], [140, 4.0], [180, 3.2], [200, 3.6], [226, 3.0], [244, 2.4], [270, 2.0], [280, 2.6], [300, 2.6]],
  };
  const holdBreath = t => (t > 228.5 && t < 238.5) || (t > 253.5 && t < 256.4) || (t > 269.5 && t < 274.5) || t > 286.8;

  // events (fire once when crossed)
  const EV = [
    [1.0, () => AU.fx('creak', 0.35, 0.8, 1.8)],
    [36.5, () => { AU.fx('clunk', 0.6); }],
    [64, () => AU.fx('moan', 0.32, 64, 7)],
    [71.8, () => AU.fx('boom', 0.25, undefined, 60, 2.6)],
    [96, () => AU.fx('moan', 0.38, 58, 8)],
    [111.5, () => AU.fx('boom', 0.3, undefined, 50, 3)],
    [138, () => AU.fx('creak', 0.5, 0.6, 2.2)],
    [150.6, () => { AU.fx('creak', 0.45, 0.9, 1.6); AU.fx('boom', 0.25, undefined, 70, 1.4); }],
    [165, () => AU.fx('moan', 0.3, 52, 6)],
    [185.6, () => { AU.fx('clang', 0.45); AU.fx('boom', 0.5, undefined, 90, 1.2); }],
    [200, () => AU.fx('clunk', 0.5)],
    [214, () => AU.fx('moan', 0.45, 48, 9)],
    [226.5, () => AU.fx('heartbeat', 0.5)], [229, () => AU.fx('heartbeat', 0.55)], [231.2, () => AU.fx('heartbeat', 0.6)], [233.2, () => AU.fx('heartbeat', 0.6)], [235, () => AU.fx('heartbeat', 0.65)],
    [236.6, () => AU.fx('heartbeat', 0.65)], [238, () => AU.fx('heartbeat', 0.7)],
    [238.2, () => AU.fx('chuckle', 0.55, 8)],
    [241, () => AU.fx('creak', 0.5, 0.5, 2.5)],
    [244.5, () => AU.fx('chuckle', 0.4, 6)],
    [256.0, () => { AU.fx('clang', 1.0); AU.fx('boom', 1.0, undefined, 120, 2.2); AU.fx('spark', 0.35); }],
    [258.5, () => AU.fx('creak', 0.6, 0.55, 2.6)],
    [263, () => AU.fx('chuckle', 0.6, 9)],
    [269.95, () => { AU.fx('spark', 0.5); }],
    [270.0, () => { AU.hardStop(); }],
    [273.6, () => AU.unmute(0.9)],
    [276.5, () => AU.fx('chuckle', 0.25, 5)],
    [290.75, () => { AU.fx('roar', 1.1); AU.fx('clang', 0.8); }],
    [291.05, () => { AU.hardStop(); }],
    [293.2, () => { AU.unmute(0.8); AU.fx('boom', 0.35, undefined, 55, 4); }],
  ];

  const tmp = V3(), tmp2 = V3(), tmp3 = V3();
  const mq = new THREE.Quaternion(), mm = new THREE.Matrix4();
  const camW = V3();
  let lastFwd = V3(0, 0, -1);
  function headingAt(t, out) {
    path(t - 0.7, tmp2); path(t + 0.7, tmp3); out.subVectors(tmp3, tmp2);
    return out;
  }
  function monsterPose(t) {
    const p = path(t, V3());
    const vel = headingAt(t, V3()); const speed = vel.length() / 1.4;
    const fwd = speed > 0.05 ? vel.clone().normalize() : lastFwd.clone();
    // face the camera?
    const lk = kf(LOOK, t);
    CAGE.rig.getWorldPosition(camW);
    const toCam = V3().subVectors(camW, p); toCam.y *= 0.6; toCam.normalize();
    const f = fwd.clone().lerp(toCam, lk).normalize();
    lastFwd.copy(fwd);
    // turn rate → bank and bend
    const fa = headingAt(t - 0.8, V3()), fb = headingAt(t + 0.8, V3());
    const ya = Math.atan2(fa.x, fa.z), yb = Math.atan2(fb.x, fb.z);
    let dy = yb - ya; while (dy > Math.PI) dy -= 2 * Math.PI; while (dy < -Math.PI) dy += 2 * Math.PI;
    const turn = (fa.lengthSq() > 0.01 && fb.lengthSq() > 0.01) ? dy / 1.6 : 0;
    const x = V3().crossVectors(V3(0, 1, 0), f).normalize(), y = V3().crossVectors(f, x);
    mm.makeBasis(x, y, f); mq.setFromRotationMatrix(mm);
    const roll = clamp(-turn * 0.9, -0.5, 0.5) * (1 - lk);
    mq.multiply(new THREE.Quaternion().setFromAxisAngle(V3(0, 0, 1), roll));
    return { p, q: mq.clone(), speed, turn, lk };
  }

  let lastT = -1;
  function events(t) {
    if (lastT < 0) { lastT = t; return; }
    for (const [te, fn] of EV) if (lastT < te && t >= te && t - te < 1.5) fn();
    lastT = t;
  }
  function resetEvents(t = -1) { lastT = t; }

  function state(t) {
    const S = {};
    S.lights = lightsAt(t);
    S.shake = shakeAt(t);
    S.dark = t >= 270 ? 1 : 0;
    S.assist = assistAt(t);
    S.jaw = kf(JAW, t) + (t > 229 && t < 270 ? Math.sin(t * 1.3) * 0.02 : 0);
    S.eyeGlow = kf(EYEG, t);
    S.phase = phaseAt(t);
    S.ambA = t < 270 ? 1 : 0; S.audioLive = (t < 270 || (t > 273.6 && t < 291)) ? 1 : 0;
    S.ambBright = clamp(1 - ENV.depthAt(t) / 120, 0, 1);
    S.winch = ENV.speedAt(t) > 0.05 ? 0.4 + ENV.speedAt(t) * 0.12 : 0;
    S.buzz = S.lights.front > 0 ? 1 : 0;
    S.mDrone = kf(M.drone, t); S.mCluster = kf(M.cluster, t); S.mHigh = kf(M.high, t); S.mSub = kf(M.sub, t); S.riser = kf(M.riser, t);
    S.growl = kf(M.growl, t);
    S.breath = !holdBreath(t) && t < 291; S.breathRate = kf(M.breathRate, t); S.breathVol = t > 270 ? 0.6 : 1;

  return { path, monsterPose, state, events, resetEvents, kf, phaseAt, Y0 };
})();

// ============================================================
//  MAIN — input, loop, UI
// ============================================================
scene.add(MON.root);
renderer.info.autoReset = false;
const $ = id => document.getElementById(id);
const UI = { title: $('title'), end: $('end'), pause: $('pause'), pausebtn: $('pausebtn'), hint: $('hint') };

let mode = 'title';   // title | play | ending
let T = 0, paused = false;
let yaw = 0, pitch = 0.02, lastInput = -99, userYawVel = 0;
const lookSens = MOBILE ? 0.0052 : 0.0034;

// ---------------- input ----------------
let dragging = false, lx = 0, ly = 0;
canvas.addEventListener('pointerdown', e => { dragging = true; lx = e.clientX; ly = e.clientY; canvas.setPointerCapture?.(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if (mode !== 'play' || paused) return;
  let dx = 0, dy = 0;
  if (document.pointerLockElement === canvas) { dx = e.movementX; dy = e.movementY; }
  else if (dragging) { dx = e.clientX - lx; dy = e.clientY - ly; lx = e.clientX; ly = e.clientY; }
  else return;
  yaw -= dx * lookSens; pitch = clamp(pitch - dy * lookSens, -1.25, 1.3);
  lastInput = performance.now() / 1000;
});
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointercancel', () => { dragging = false; });
addEventListener('keydown', e => {
  if (e.code === 'Escape' || e.code === 'KeyP') { if (mode === 'play') setPause(!paused); }
  if (mode === 'play' && !paused) {
    if (e.code === 'ArrowLeft') { yaw += 0.12; lastInput = performance.now() / 1000; }
    if (e.code === 'ArrowRight') { yaw -= 0.12; lastInput = performance.now() / 1000; }
    if (e.code === 'ArrowUp') pitch = clamp(pitch + 0.1, -1.25, 1.3);
    if (e.code === 'ArrowDown') pitch = clamp(pitch - 0.1, -1.25, 1.3);
  }
});
document.addEventListener('pointerlockchange', () => { if (!document.pointerLockElement && mode === 'play' && !paused && !MOBILE) {/* drag still works */ } });

function setPause(p) {
  paused = p;
  UI.pause.style.display = p ? 'flex' : 'none';
  if (p) { AU.suspend(); if (document.pointerLockElement) document.exitPointerLock(); } else AU.resume();
}
UI.pausebtn.addEventListener('click', e => { e.stopPropagation(); if (mode === 'play') setPause(true); });
$('resume').addEventListener('click', e => { e.stopPropagation(); setPause(false); });
$('totitle').addEventListener('click', e => { e.stopPropagation(); setPause(false); toTitle(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play' && !paused) setPause(true); });

UI.title.addEventListener('click', start);
function start() {
  if (mode !== 'title') return;
  AU.init(); AU.unmute(0.9); AU.resetBreath();
  mode = 'play'; T = DEV && window.__startT ? window.__startT : 0; paused = false;
  DIR.resetEvents(T);
  yaw = 0; pitch = 0.02; lastInput = -99;
  UI.title.classList.add('hide'); UI.end.classList.remove('show');
  UI.pausebtn.style.display = 'flex';
  UI.hint.style.opacity = 1; setTimeout(() => UI.hint.style.opacity = 0, 5000);
  if (!MOBILE && canvas.requestPointerLock) { try { const p = canvas.requestPointerLock(); if (p && p.catch) p.catch(() => { }); } catch (e) { } }
}
function toTitle() {
  mode = 'title'; T = 0; DIR.resetEvents(-1);
  UI.title.classList.remove('hide'); UI.end.classList.remove('show'); UI.pausebtn.style.display = 'none';
  if (document.pointerLockElement) document.exitPointerLock();
  AU.unmute(0.5);
}

// ---------------- resize ----------------
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // keep a wide enough horizontal view on portrait phones
  const hf = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(70) / 2) * Math.max(1, 1.25 / camera.aspect));
  camera.fov = THREE.MathUtils.radToDeg(Math.min(hf, THREE.MathUtils.degToRad(100)));
  camera.updateProjectionMatrix();
  ENV.resize(w, h);
}
addEventListener('resize', resize); resize();

// ---------------- frame ----------------
const camPos = V3(), camFwd = V3(), camUp = V3(), monHead = V3(), tmpV = V3();
const exhalePt = V3();
let fpsAcc = 0, fpsN = 0, lowFrames = 0;
function onExhale() {
  if (mode !== 'play') return;
  CAGE.rig.localToWorld(exhalePt.set(Math.sin(yaw) * -0.22, -0.22, Math.cos(yaw) * -0.22));
  ENV.exhale(exhalePt, 22);
}

function frame(t, dt, realDt) {
  GU.uTime.value += realDt;
  const S = DIR.state(t);
  // lights (dimmed a little when the face is right at the bars, like an auto-exposure)
  const pose = DIR.monsterPose(t);
  const dN = Math.hypot(pose.p.x, pose.p.z);
  const ex = clamp(Math.pow(dN / 10, 1.3), 0.32, 1);
  CAGE.setLights(S.lights.front * ex, S.lights.back, S.lights.inner);
  // cage sway + shake
  const sh = S.shake;
  CAGE.group.rotation.set(sh.swayZ, 0, sh.sway);
  const k = performance.now() / 1000;
  const ax = sh.amp * vnoise(k * 31.0), ay = sh.amp * vnoise(k * 27.0 + 5), az = sh.amp * vnoise(k * 23 + 9);
  CAGE.rig.position.set(ax * 0.6, EYE_Y + ay * 0.6 + Math.sin(GU.uTime.value * 0.9) * 0.006, 0.15 + az * 0.4);
  // look assist toward the monster when idle
  if (mode === 'play' && S.assist > 0) {
    const idle = performance.now() / 1000 - lastInput;
    if (idle > 1.4) {
      CAGE.rig.getWorldPosition(tmpV);
      const head = V3().copy(pose.p).add(V3(0, 1.8, 0).applyQuaternion(pose.q));
      const dx = head.x - tmpV.x, dz = head.z - tmpV.z;
      const target = Math.atan2(-dx, -dz);
      let d = target - yaw; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
      yaw += d * clamp(S.assist * dt * 0.9, 0, 0.2) * sstep(1.4, 3, idle);
      const tp = Math.atan2(head.y - tmpV.y, Math.hypot(dx, dz));
      pitch += (clamp(tp, -0.5, 0.6) - pitch) * clamp(S.assist * dt * 0.6, 0, 0.15) * sstep(1.4, 3, idle);
    }
  }
  if (DEV && window.__dev && window.__dev.free) { } else
  CAGE.rig.rotation.set(0, yaw, ax * 0.8);
  CAGE.pitchObj.rotation.set(pitch + ay * 0.8, 0, 0);
  // monster
  MON.root.position.copy(pose.p); MON.root.quaternion.copy(pose.q);
  MON.st.amp = clamp(0.18 + pose.speed * 0.07, 0.15, 0.85);
  MON.st.phase = S.phase;
  MON.st.bend = clamp(pose.turn * 3.2, -2.2, 2.2) * (1 - pose.lk);
  MON.st.jaw = S.jaw; MON.st.eyeGlow = S.eyeGlow;
  const d = pose.p.distanceTo(CAGE.group.position);
  MON.root.visible = d < 175;
  camera.updateMatrixWorld();
  camera.getWorldPosition(camPos);
  MON.update(camPos);
  // environment
  const depth = ENV.update(t, dt, S);
  if (DEV && window.__dev && window.__dev.fogOff) { scene.fog.density = 0.002; scene.background.setRGB(0.05, 0.08, 0.1); }
  CAGE.drawGauge(depth);
  // post
  const fx = ENV.fx.uniforms;
  fx.uTime.value = GU.uTime.value;
  fx.uFade.value = S.fade * (mode === 'title' ? 1 : 1);
  fx.uFlash.value = S.flash;
  fx.uCA.value = 0.0018 + Math.min(sh.amp, 0.03) * 0.08;
  fx.uGrain.value = 0.035 + (t > 240 ? 0.015 : 0);
  // audio
  camera.getWorldDirection(camFwd); camUp.set(0, 1, 0).applyQuaternion(camera.getWorldQuaternion(new THREE.Quaternion()));
  monHead.copy(pose.p).add(V3(0, 1, -3).applyQuaternion(pose.q));
  S.camPos = camPos; S.camFwd = camFwd; S.camUp = camUp; S.monHead = monHead; S.monSpeed = Math.min(pose.speed, 12) * clamp(1 - d / 120, 0, 1);
  if (mode === 'play') { AU.update(t, dt, S, onExhale); DIR.events(t); }
  renderer.info.reset();
  ENV.composer.render();
}

// title idle view
let titleYaw = 0;
let last = performance.now();
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now(), realDt = Math.min(0.1, (now - last) / 1000); last = now;
  if (DEV && window.__dev && window.__dev.paused) { frame(T, 0, 0); return; }
  if (mode === 'play') {
    if (!paused) T += realDt;
    if (T >= 291 && !UI.end.classList.contains('show') && T >= 292.8) UI.end.classList.add('show');
    if (T >= 300.5) { mode = 'ending'; setTimeout(() => { UI.end.classList.remove('show'); toTitle(); }, 2600); }
    frame(T, paused ? 0 : realDt, paused ? 0 : realDt);
  } else if (mode === 'ending') {
    frame(300, realDt, realDt);
  } else {
    titleYaw += realDt * 0.04;
    yaw = Math.sin(titleYaw) * 0.6; pitch = 0.35 + Math.sin(titleYaw * 0.7) * 0.15;
    frame(4, realDt, realDt);
  }
  // adaptive resolution
  if (!paused) { fpsAcc += realDt; fpsN++; if (fpsAcc > 2) { const fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; if (fps < 38 && PR > 0.8) { PR = Math.max(0.8, PR - 0.25); renderer.setPixelRatio(PR); resize(); } } }
}
requestAnimationFrame(loop);

if (DEV) {
  window.__dev = {
    paused: false,
    setT(t) { T = t; DIR.resetEvents(t); },
    getT: () => T,
    look(y, p) { yaw = y; pitch = p; lastInput = performance.now() / 1000 + 9999; },
    start() { start(); },
    mode: () => mode,
    cam: camera, MON, DIR, ENV, CAGE,
    frame(t) { frame(t, 1 / 30, 1 / 30); },
    THREE, scene, info: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, pr: PR }),
    view(px, py, pz, tx, ty, tz) { UI.title.style.display = 'none'; scene.add(camera); camera.position.set(px, py, pz); camera.lookAt(tx, ty, tz); camera.updateMatrixWorld(); window.__dev.free = true; },
    lookdev(i = 2) { const h = new THREE.HemisphereLight(0xcfe0ff, 0x302020, i); scene.add(h); const d = new THREE.DirectionalLight(0xffffff, i); d.position.set(10, 20, 10); scene.add(d); scene.fog.density = 0.002; window.__dev.fogOff = true; },
  };
}
